---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: knowledgebases.agentorca.agentorca.io
spec:
  group: agentorca.agentorca.io
  names:
    kind: KnowledgeBase
    listKind: KnowledgeBaseList
    plural: knowledgebases
    singular: knowledgebase
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.ready
      name: Ready
      type: boolean
    - jsonPath: .status.message
      name: Message
      type: string
    - jsonPath: .status.documentCount
      name: Docs
      type: integer
    - jsonPath: .status.chunkCount
      name: Chunks
      type: integer
    - jsonPath: .status.storageUsedPercent
      name: Storage%
      type: integer
    - jsonPath: .status.qdrantVersion
      name: Qdrant
      type: string
    - jsonPath: .status.embeddingModelProvider
      name: EmbedProvider
