---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: mcpservers.agentorca.agentorca.io
spec:
  group: agentorca.agentorca.io
  names:
    kind: MCPServer
    listKind: MCPServerList
    plural: mcpservers
    singular: mcpserver
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.transport
      name: Transport
      type: string
    - jsonPath: .status.ready
      name: Ready
      type: boolean
    - jsonPath: .status.toolCount
      name: Tools
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          MCPServer declares an MCP server and the tools it provides.
          The controller generates one child Tool CR per declared tool.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: MCPServerSpec defines the desired state of an MCPServer.
            properties:
              allowApps:
                description: |-
                  AllowApps enables MCP App rendering for this server. When false (default),
                  _meta.ui.resourceUri is ignored and no sandboxed iframe is rendered in the UI.
                  Set to true only for MCP servers whose HTML output you explicitly trust.
                type: boolean
              allowedAgents:
                description: |-
                  AllowedAgents is the explicit list of Agent names (in the same namespace) that are
                  permitted to use this MCP server. Access is denied by default — if this list is
                  empty, no agent may access the server regardless of what tools it declares.

                  The agent-orca operator enforces this at AgentRun creation time: if the agent
                  running the run is not listed here, the run is failed before the pod is scheduled.
                  At runtime, the model-router sidecar sends a short-lived Kubernetes ServiceAccount
                  JWT (audience "agentorca/mcp") with every HTTP/SSE request to the MCP server so the
                  server can independently verify the caller's identity via the TokenReview API.

                  Example — grant access to two agents:
                    allowedAgents:
                    - analyst
                    - report-builder
                items:
                  type: string
                type: array
              args:
                description: |-
                  Args are the command-line arguments passed to the MCP server process.
                  Only used for stdio transport.
                items:
                  type: string
                type: array
              auth:
                description: |-
                  Auth configures authentication for HTTP/SSE transports.
                  The model-router reads each referenced Secret (mounted as a file into the
                  sidecar) and injects it as an HTTP header on every request to the remote
                  MCP server. Not supported for stdio transport (use EnvFrom instead — the
                  agentorca admission webhook rejects auth on stdio).
                properties:
                  apiKey:
                    description: APIKey sets a custom header with a key read from
                      a Secret.
                    properties:
                      headerName:
                        default: X-API-Key
                        description: HeaderName is the HTTP header name. Defaults
                          to "X-API-Key".
                        type: string
                      secretKeyRef:
                        description: SecretKeyRef references the Secret containing
                          the API key.
                        properties:
                          key:
                            description: Key within the Secret.
                            type: string
                          name:
                            description: Name of the Secret.
                            type: string
                          namespace:
                            description: Namespace of the Secret. Defaults to the
                              same namespace as the referencing resource.
                            type: string
                        required:
                        - key
                        - name
                        type: object
                    required:
                    - secretKeyRef
                    type: object
                  bearerToken:
                    description: |-
                      BearerToken sets the Authorization header to "Bearer <token>".
                      The token value is read from a Kubernetes Secret.
                    properties:
                      key:
                        description: Key within the Secret.
                        type: string
                      name:
                        description: Name of the Secret.
                        type: string
                      namespace:
                        description: Namespace of the Secret. Defaults to the same
                          namespace as the referencing resource.
                        type: string
                    required:
                    - key
                    - name
                    type: object
                  headers:
                    description: |-
                      Headers sets custom HTTP headers from Secrets.
                      Use this for non-standard auth schemes.
                    items:
                      description: AuthHeader maps an HTTP header name to a Secret
                        key reference.
                      properties:
                        name:
                          description: Name is the HTTP header name (e.g., "Authorization",
                            "X-Custom-Token").
                          type: string
                        secretKeyRef:
                          description: SecretKeyRef references the Secret containing
                            the header value.
                          properties:
                            key:
                              description: Key within the Secret.
                              type: string
                            name:
                              description: Name of the Secret.
                              type: string
                            namespace:
                              description: Namespace of the Secret. Defaults to the
                                same namespace as the referencing resource.
                              type: string
                          required:
                          - key
                          - name
                          type: object
                      required:
                      - name
                      - secretKeyRef
                      type: object
                    type: array
                  oauth:
                    description: |-
                      OAuth drives OAuth 2.0 token management for the remote MCP server (HTTP/SSE).
                      When set, the MCPServer controller discovers the server's OAuth config from its
                      RFC 8414 metadata, exchanges a refresh token (or a one-time authorization code
                      via PKCE) for an access token, writes it to accessTokenSecretRef, and wires
                      auth.bearerToken to that Secret so the model-router sends it as a bearer. This is
                      what makes OAuth-only MCP servers usable (e.g. Slack, which rejects static tokens
                      with -32001 invalid_token). Mutually exclusive with bearerToken/apiKey/headers.
                    properties:
                      accessTokenSecretRef:
                        description: |-
                          AccessTokenSecretRef is the Secret (key "token") the access token is written to
                          and that auth.bearerToken references. If omitted, the controller names it
                          "<mcpserver>-mcp-token" (key "token").
                        properties:
                          key:
                            description: Key within the Secret.
                            type: string
                          name:
                            description: Name of the Secret.
                            type: string
                          namespace:
                            description: Namespace of the Secret. Defaults to the
                              same namespace as the referencing resource.
                            type: string
                        required:
                        - key
                        - name
                        type: object
                      credentials:
                        description: |-
                          Credentials is a Secret (in the MCPServer's namespace) holding the OAuth client
                          id/secret (keys: client_id, client_secret), an optional registered redirect_uri
                          (key: redirect_uri), and an optional pre-provisioned refresh_token (key:
                          refresh_token). Supplying a refresh_token skips the one-time authorization-code
                          seed; otherwise the controller reports "seeding required" and the operator runs
                          `oauth-proxy seed` once.
                        properties:
                          name:
                            description: Name of the resource.
                            type: string
                        required:
                        - name
                        type: object
                      refreshTokenSecretRef:
                        description: |-
                          RefreshTokenSecretRef optionally points to a Secret/key holding just the refresh
                          token (instead of inside Credentials). When set, this takes precedence.
                        properties:
                          key:
                            description: Key within the Secret.
                            type: string
                          name:
                            description: Name of the Secret.
                            type: string
                          namespace:
                            description: Namespace of the Secret. Defaults to the
                              same namespace as the referencing resource.
                            type: string
                        required:
                        - key
                        - name
                        type: object
                      scopes:
                        description: Scopes overrides the server's scopes_supported;
                          if empty, discovery scopes win.
                        items:
                          type: string
                        type: array
                    required:
                    - credentials
                    type: object
                type: object
              discoverability:
                default: enabled
                description: |-
                  Discoverability controls how MCP tools are surfaced to agents.

                  "enabled" (default): the model-router auto-discovers all tools at runtime via
                  tools/list and exposes them to the LLM. spec.tools is optional — when omitted,
                  the controller creates one connector Tool CR (named after the MCPServer) and the
                  agent references the server by that name. Any tools declared in spec.tools are
                  still created as child Tool CRs (useful for access-control cataloguing).

                  "disabled": spec.tools is required and the agent must reference each declared
                  Tool CR explicitly.
                enum:
                - enabled
                - disabled
                type: string
              env:
                additionalProperties:
                  type: string
                description: Env sets environment variables for the MCP server process.
                type: object
              envFrom:
                description: |-
                  EnvFrom sets environment variables sourced from Kubernetes Secrets.
                  These are merged with (and override) Env entries of the same name.
                  Only used for stdio transport.
                items:
                  description: |-
                    EnvVar represents an environment variable with either a literal value or an indirect
                    reference to a Kubernetes Secret key. If ValueFrom is set, Value is ignored.
                  properties:
                    name:
                      description: Name of the environment variable.
                      type: string
                    value:
                      description: Value is a literal value. Ignored if ValueFrom
                        is set.
                      type: string
                    valueFrom:
                      description: ValueFrom references an indirect source for the
                        value.
                      properties:
                        secretKeyRef:
                          description: SecretKeyRef selects a key from a Kubernetes
                            Secret.
                          properties:
                            key:
                              description: Key within the Secret.
                              type: string
                            name:
                              description: Name of the Secret.
                              type: string
                            namespace:
                              description: Namespace of the Secret. Defaults to the
                                same namespace as the referencing resource.
                              type: string
                          required:
                          - key
                          - name
                          type: object
                      type: object
                  required:
                  - name
                  type: object
                type: array
              excludePatterns:
                description: |-
                  ExcludePatterns is a list of glob patterns to hide discovered tools. A tool
                  matching any pattern is dropped before it reaches the LLM, even if it matched
                  an IncludePatterns entry (exclude always wins). Applied after IncludePatterns.
                items:
                  type: string
                type: array
              includePatterns:
                description: |-
                  IncludePatterns is a list of glob patterns used to filter the tools the
                  model-router discovers at runtime. When non-empty, only tools whose name matches
                  at least one pattern are exposed to agents. Supports "*", "?", and "**" for
                  recursive multi-segment matching (e.g. "search/**"). Mirrors the
                  includePatterns convention used by KnowledgeBase ingestion.
                items:
                  type: string
                type: array
              networkEgress:
                description: |-
                  NetworkEgress defines additional outbound network rules for agent pods
                  using tools from this MCP server.
                items:
                  description: EgressRule defines an allowed outbound network target
                    for a tool or agent pod.
                  properties:
                    host:
                      description: Host is the target hostname. Wildcards like "*.example.com"
                        are supported.
                      type: string
                    port:
                      description: Port is the target port.
                      format: int32
                      type: integer
                    protocol:
                      default: TCP
                      description: Protocol defaults to TCP.
                      type: string
                  required:
                  - host
                  - port
                  type: object
                type: array
              ociRef:
                description: |-
                  OCIRef is the OCI image reference for stdio transport servers
                  that run as a sidecar. Must be signed with Cosign unless
                  imageVerification.skip is true.
                type: string
              resources:
                description: Resources sets CPU/memory limits for the MCP server sidecar.
                properties:
                  claims:
                    description: |-
                      Claims lists the names of resources, defined in spec.resourceClaims,
                      that are used by this container.

                      This field depends on the
                      DynamicResourceAllocation feature gate.

                      This field is immutable. It can only be set for containers.
                    items:
                      description: ResourceClaim references one entry in PodSpec.ResourceClaims.
                      properties:
                        name:
                          description: |-
                            Name must match the name of one entry in pod.spec.resourceClaims of
                            the Pod where this field is used. It makes that resource available
                            inside a container.
                          type: string
                        request:
                          description: |-
                            Request is the name chosen for a request in the referenced claim.
                            If empty, everything from the claim is made available, otherwise
                            only the result of this request.
                          type: string
                      required:
                      - name
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                  limits:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: |-
                      Limits describes the maximum amount of compute resources allowed.
                      More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                    type: object
                  requests:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: |-
                      Requests describes the minimum amount of compute resources required.
                      If Requests is omitted for a container, it defaults to Limits if that is explicitly specified,
                      otherwise to an implementation-defined value. Requests cannot exceed Limits.
                      More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                    type: object
                type: object
              tools:
                description: |-
                  Tools declares the tools this MCP server provides.
                  Each entry becomes a child Tool CR managed by the MCPServer controller.

                  Optional when spec.discoverability is "enabled" (the default): if Tools is
                  empty the controller creates a single connector Tool CR (named after the
                  MCPServer) and the model-router discovers every tool at runtime via tools/list.
                  When spec.discoverability is "disabled", Tools is required.
                items:
                  description: MCPServerTool declares a single tool provided by an
                    MCP server.
                  properties:
                    description:
                      description: Description is a human-readable description shown
                        to the LLM.
                      type: string
                    inputSchema:
                      description: InputSchema is a JSON Schema object for the tool's
                        input parameters.
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                    name:
                      description: |-
                        Name is the tool name. Combined with the MCPServer name to form the
                        child Tool CR name: <mcpserver>-<name>.
                      minLength: 1
                      pattern: ^[a-z0-9]([a-z0-9-]*[a-z0-9])?$
                      type: string
                  required:
                  - name
                  type: object
                type: array
              transport:
                default: stdio
                description: Transport is the MCP transport protocol.
                enum:
                - stdio
                - http
                - sse
                type: string
              url:
                description: |-
                  URL is the MCP server URL for http and sse transports.
                  If set, the server runs externally and no sidecar is injected.
                type: string
            type: object
          status:
            description: MCPServerStatus defines the observed state of an MCPServer.
            properties:
              conditions:
                description: Conditions holds standard Kubernetes conditions.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              discovering:
                description: |-
                  Discovering is true when spec.discoverability is "enabled" and spec.tools is
                  empty, meaning the controller created a connector Tool CR and the model-router
                  will discover all tools at runtime via tools/list.
                type: boolean
              message:
                description: Message contains a human-readable status message.
                type: string
              ready:
                description: Ready indicates all child Tools were created successfully.
                type: boolean
              toolCount:
                description: ToolCount is the number of child Tool CRs managed by
                  this MCPServer.
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
