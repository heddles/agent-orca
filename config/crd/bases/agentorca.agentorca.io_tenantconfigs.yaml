---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: tenantconfigs.agentorca.agentorca.io
spec:
  group: agentorca.agentorca.io
  names:
    kind: TenantConfig
    listKind: TenantConfigList
    plural: tenantconfigs
    singular: tenantconfig
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.authMode
      name: AuthMode
      type: string
    - jsonPath: .spec.targetNamespace
      name: Namespace
      type: string
    - jsonPath: .status.ready
      name: Ready
      type: boolean
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          TenantConfig defines authentication and authorization for an enterprise tenant
          accessing agent-orca's external API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: TenantConfigSpec defines authentication and authorization
              for an enterprise tenant.
            properties:
              allowedAgents:
                description: |-
                  AllowedAgents restricts which agents this tenant may invoke.
                  An empty list means no agents are allowed; omitting the field allows all agents
                  in the target namespace.
                items:
                  type: string
                type: array
              authMode:
                description: |-
                  AuthMode selects the authentication strategy for this tenant.
                  "issued" — agent-orca issues OAuth2 tokens via client_credentials grant.
                  "federated" — agent-orca trusts JWTs from the tenant's external IdP.
                enum:
                - issued
                - federated
                type: string
              budgetPerDayUSD:
                description: |-
                  BudgetPerDayUSD is the maximum daily spend in USD for this tenant.
                  Enforced across all runs in the target namespace attributed to this tenant.
                type: string
              federated:
                description: |-
                  Federated configures trust for an external OIDC identity provider.
                  Required when AuthMode is "federated".
                properties:
                  claimMappings:
                    description: |-
                      ClaimMappings selects which IdP claims map onto the resolved principal/identity.
                      All fields default to the standard OIDC claim when empty (userid=sub,
                      groups=groups, email=email). Set userid=email for Google social login.
                    properties:
                      email:
                        description: Email maps to TenantIdentity.Email (default "email").
                        type: string
                      groups:
                        description: Groups maps to TenantIdentity.Groups (default
                          "groups").
                        type: string
                      userid:
                        description: UserID maps to TenantIdentity.UserID (default
                          "sub").
                        type: string
                    type: object
                  clientID:
                    description: |-
                      ClientID is the expected "aud" (audience) claim in the JWT for bearer tokens,
                      and the OAuth2 client ID used for the interactive login flow.
                    minLength: 1
                    type: string
                  clientSecretRef:
                    description: |-
                      ClientSecretRef references the OAuth2 client_secret used for the interactive
                      login (authorization-code) flow, fetched from the tenant's targetNamespace.
                      Omit for bearer-only federation (no secret is needed — verification uses the
                      IdP's public JWKS).
                    properties:
                      key:
                        description: Key within the Secret.
                        type: string
                      name:
                        description: Name of the Secret.
                        type: string
                      namespace:
                        description: Namespace of the Secret. Defaults to the same
                          namespace as the referencing resource.
                        type: string
                    required:
                    - key
                    - name
                    type: object
                  issuerURL:
                    description: |-
                      IssuerURL is the OIDC issuer URL (e.g. "https://acme.okta.com/oauth2/default").
                      agent-orca fetches the JWKS from this issuer to verify token signatures.
                    minLength: 1
                    type: string
                  matchClaim:
                    description: |-
                      MatchClaim is the JWT claim used to identify this tenant (e.g. "org_id",
                      "tenant", or a GitHub-style "repository_owner"). When both MatchClaim and
                      MatchValue are omitted the tenant trusts *any* token validly signed by
                      IssuerURL with the expected ClientID audience (issuer-only / default-allow).
                    minLength: 1
                    type: string
                  matchValue:
                    description: |-
                      MatchValue is the expected value of MatchClaim that maps to this tenant.
                      Required when MatchClaim is set; omit both for issuer-only trust.
                    minLength: 1
                    type: string
                  redirectURI:
                    description: |-
                      RedirectURI is the callback URL registered with the IdP for the interactive
                      login flow. Omit for bearer-only federation.
                    type: string
                required:
                - clientID
                - issuerURL
                type: object
              issued:
                description: |-
                  Issued configures agent-orca-issued OAuth2 client credentials.
                  Required when AuthMode is "issued".
                properties:
                  clientID:
                    description: ClientID is the OAuth2 client identifier for this
                      tenant.
                    minLength: 1
                    type: string
                  clientSecretRef:
                    description: |-
                      ClientSecretRef references the Kubernetes Secret containing the client secret.
                      The operator reads this to validate client_credentials requests.
                    properties:
                      key:
                        description: Key within the Secret.
                        type: string
                      name:
                        description: Name of the Secret.
                        type: string
                      namespace:
                        description: Namespace of the Secret. Defaults to the same
                          namespace as the referencing resource.
                        type: string
                    required:
                    - key
                    - name
                    type: object
                required:
                - clientID
                - clientSecretRef
                type: object
              rateLimit:
                description: RateLimit configures request rate limiting for this tenant.
                properties:
                  concurrentRuns:
                    description: ConcurrentRuns is the maximum number of simultaneously
                      running AgentRuns.
                    type: integer
                  requestsPerMinute:
                    description: RequestsPerMinute is the maximum number of task submissions
                      per minute.
                    type: integer
                type: object
              targetNamespace:
                description: |-
                  TargetNamespace is the Kubernetes namespace where this tenant's agents
                  and resources live. All API requests from this tenant are scoped to this namespace.
                minLength: 1
                type: string
            required:
            - authMode
            - targetNamespace
            type: object
          status:
            description: TenantConfigStatus holds the observed state of a TenantConfig.
            properties:
              conditions:
                description: Conditions holds standard Kubernetes conditions.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              message:
                description: Message contains a human-readable status message.
                type: string
              ready:
                description: Ready indicates the tenant configuration has been validated
                  and is active.
                type: boolean
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
