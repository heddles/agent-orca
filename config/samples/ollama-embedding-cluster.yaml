---
# Ollama deployment for embedding models in-cluster
# Deploy this to make embeddings available without host networking
# Usage: kubectl apply -f config/samples/ollama-embedding-cluster.yaml

# First, create a PVC for Ollama models
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-models
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi

---
# Job to pre-pull the embedding model
apiVersion: batch/v1
kind: Job
metadata:
  name: ollama-pull-model
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: ollama
          image: ollama/ollama:latest
          command:
            - /bin/sh
            - -c
            - |
              ollama serve &
              sleep 5
              echo "Pulling nomic-embed-text model..."
              ollama pull nomic-embed-text
              # Bake num_thread into the model so llama.cpp matches the
              # container's CPU limit instead of defaulting to the host's
              # core count (which oversubscribes and thrashes under cgroup
              # CPU limits).
              printf 'FROM nomic-embed-text\nPARAMETER num_thread 4\n' > /tmp/Modelfile
              ollama create nomic-embed-text-4cpu -f /tmp/Modelfile
              echo "Model pulled and tuned successfully"
          env:
            - name: OLLAMA_HOST
              value: "0.0.0.0"
          volumeMounts:
            - name: models
              mountPath: /root/.ollama
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: ollama-models

---
# Ollama deployment for embedding models
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama-embed
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ollama-embed
  template:
    metadata:
      labels:
        app: ollama-embed
    spec:
      containers:
        - name: ollama
          image: ollama/ollama:latest
          ports:
            - containerPort: 11434
          env:
            - name: OLLAMA_HOST
              value: "0.0.0.0"
            - name: OLLAMA_NUM_PARALLEL
              value: "4"
            # Keep the embedding model resident between requests; reloading
            # it after every idle gap dominates latency during bulk ingestion.
            - name: OLLAMA_KEEP_ALIVE
              value: "-1"
          volumeMounts:
            - name: models
              mountPath: /root/.ollama
          resources:
            requests:
              cpu: 4
              memory: 1Gi
            limits:
              cpu: 4
              memory: 1Gi
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: ollama-models

---
apiVersion: v1
kind: Service
metadata:
  name: ollama-embed
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 11434
      targetPort: 11434
  selector:
    app: ollama-embed

---
# Dummy secret for Ollama (no auth required)
apiVersion: v1
kind: Secret
metadata:
  name: ollama-embed-credentials
type: Opaque
stringData:
  api-key: "dummy-key"

---
# ModelProvider for Ollama embedding model
apiVersion: agentorca.agentorca.io/v1alpha1
kind: ModelProvider
metadata:
  name: ollama-embed
spec:
  litellmModel: "ollama/nomic-embed-text-4cpu"
  baseURL: "http://ollama-embed.agent-orca-system.svc:11434"
  credentialsRef:
    name: ollama-embed-credentials
    key: api-key
  latencyProfile: "fast"
  capabilities:
    - embeddings
  queryPrompt: "search_query: "
  docPrompt: "search_document: "
  constraints:
    contextWindow: 8192
    costPerMillionInputTokens: "0"
    costPerMillionOutputTokens: "0"

---
# ModelSelector for embedding calls
apiVersion: agentorca.agentorca.io/v1alpha1
kind: ModelSelector
metadata:
  name: ollama-embed
spec:
  strategy: rule-based
  providers:
    - name: ollama-embed
      weight: 100
