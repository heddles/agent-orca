---
# Sample Kubernetes Secret holding the OIDC OAuth2 client_secret for the
# interactive login flow (login via OIDC). Create it in the operator namespace and
# reference it from the Helm chart:
#
#   operator:
#     oidc:
#       enabled: true
#       clientSecretRef:
#         name: oidc-client-secret
#         key: client-secret
#
# In dev (skaffold), the same Secret is created from the shell env var
# OIDC_CLIENT_SECRET via the `dev-oidc` wiring — see docs/oauth-login.md.
#
# NEVER commit a real secret here. This sample carries a placeholder; replace it
# with the real value via `kubectl create secret` (or your sealed-secret /
# external-secrets pipeline), not by editing this file:
#
#   kubectl create secret generic oidc-client-secret \
#     --namespace=agent-orca-system \
#     --from-literal=client-secret='$(oidc-client-secret-from-your-idp)'
apiVersion: v1
kind: Secret
metadata:
  name: oidc-client-secret
  namespace: agent-orca-system
type: Opaque
stringData:
  client-secret: "REPLACE-ME-CHANGE-ME"
