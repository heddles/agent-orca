---
# Secret with dummy API key (Ollama doesn't need auth)
apiVersion: v1
kind: Secret
metadata:
  name: ollama-embed-credentials
  namespace: default
type: Opaque
stringData:
  api-key: "dummy-key"

---
# ModelProvider for Ollama's nomic-embed-text embedding model
apiVersion: agentorca.agentorca.io/v1alpha1
kind: ModelProvider
metadata:
  name: ollama-embed
  namespace: default
spec:
  litellmModel: "ollama/nomic-embed-text"
  baseURL: "http://ollama.default.svc:11434"  # in-cluster bridge to host Ollama
  credentialsRef:
    name: ollama-embed-credentials
    key: api-key
  latencyProfile: "fast"
  capabilities:
    - embedding
  constraints:
    contextWindow: 8192
    costPerMillionInputTokens: "0"
    costPerMillionOutputTokens: "0"
  # nomic-embed-text requires task prefixes for retrieval-quality embeddings
  queryPrompt: "search_query: "
  docPrompt: "search_document: "

---
# ModelSelector for embedding calls
apiVersion: agentorca.agentorca.io/v1alpha1
kind: ModelSelector
metadata:
  name: local-embeddings
  namespace: default
spec:
  strategy: rule-based
  providers:
    - name: ollama-embed
      weight: 100

---
# ConfigMap with sample documents to ingest
apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-knowledge
  namespace: default
data:
  kubernetes.txt: |
    Kubernetes is an open-source container orchestration platform originally
    designed by Google. It automates deployment, scaling, and management of
    containerized applications. The smallest deployable unit is a Pod, which
    can contain one or more containers sharing network and storage.
  rag.txt: |
    Retrieval-Augmented Generation (RAG) combines information retrieval with
    text generation. Documents are chunked into smaller segments, embedded into
    dense vectors, and stored in a vector database like Qdrant. At query time,
    the user's question is embedded and used to find the most similar document
    chunks, which are then provided as context to a language model.
  agent-orca.txt: |
    Agent-orca is a Kubernetes-native agent orchestration platform. It manages
    AI agents as custom resources, handles model routing through ModelSelectors,
    and provides tools, knowledge bases, and workflow orchestration. The
    model-router sidecar intercepts LLM calls and applies routing, budgeting,
    and tool injection transparently.

---
# KnowledgeBase using Ollama for embeddings and local Qdrant
apiVersion: agentorca.agentorca.io/v1alpha1
kind: KnowledgeBase
metadata:
  name: demo-kb
  namespace: default
spec:
  description: "Demo knowledge base with project documentation"
  allowedAgents:
    - rag-demo-agent
  vectorStore:
    provider: qdrant
    collectionName: demo-kb
    storageSize: "1Gi"
  embedding:
    modelSelectorRef: local-embeddings
    dimensions: 768        # nomic-embed-text outputs 768 dims
    chunkSize: 256
    chunkOverlap: 32
  ingestion:
    configMapRefs:
      - name: demo-knowledge
    syncIntervalSeconds: 0   # one-shot, no periodic re-sync

---
# ModelProvider for Ollama chat completions (e.g. mistral or llama3)
# Pull the model first: ollama pull mistral
apiVersion: agentorca.agentorca.io/v1alpha1
kind: ModelProvider
metadata:
  name: ollama-chat
  namespace: default
spec:
  litellmModel: "ollama/mistral"
  baseURL: "http://ollama.default.svc:11434"
  credentialsRef:
    name: ollama-embed-credentials   # reuse dummy key
    key: api-key
  latencyProfile: "fast"
  capabilities:
    - fast
    - cheap
  constraints:
    contextWindow: 32768
    maxOutputTokens: 8000
    costPerMillionInputTokens: "0"
    costPerMillionOutputTokens: "0"

---
# ModelSelector for chat completions
apiVersion: agentorca.agentorca.io/v1alpha1
kind: ModelSelector
metadata:
  name: local-chat
  namespace: default
spec:
  strategy: rule-based
  providers:
    - name: ollama-chat
      weight: 100

---
# Agent that uses the demo KnowledgeBase for RAG
apiVersion: agentorca.agentorca.io/v1alpha1
kind: Agent
metadata:
  name: rag-demo-agent
  namespace: default
spec:
  modelSelectorRef: default
  knowledgeBases:
    - demo-kb
  systemPrompt: |
    You are a helpful assistant with access to a knowledge base.
    Always use _rag_search to find relevant information before answering questions.
    Cite the source documents when possible.
  runtime:
    ociRef: python:3.12-slim
    framework: openai-compatible
    command: ["python3", "-c"]
    args:
      - |
        import json, os, signal, time, urllib.request

        input_source = os.environ.get("AGENTORC_INPUT_SOURCE", "")
        inp = os.environ.get("AGENTORC_INPUT", "")

        def handle_request(prompt):
            api_key = os.environ.get("OPENAI_API_KEY", "unused")
            body = json.dumps({
              "model": "default",
              "stream": True,
              "messages": [{"role": "user", "content": prompt}],
            }).encode()
            req = urllib.request.Request(
              "http://localhost:8080/v1/chat/completions",
              data=body,
              headers={"Content-Type": "application/json", "Authorization": f"Bearer {api_key}"},
            )
            with urllib.request.urlopen(req, timeout=120) as r:
              while True:
                raw = r.readline()
                if not raw:
                  break
                line = raw.decode().strip()
                if not line.startswith("data: "):
                  continue
                data = line[len("data: "):]
                if data == "[DONE]":
                  break
                chunk = json.loads(data)
                choices = chunk.get("choices", [])
                if not choices:
                  continue
                content = choices[0].get("delta", {}).get("content", "")
                if content:
                  print(content, end="", flush=True)

        if inp:
            handle_request(inp)
        elif input_source == "chat":
            print("RAG agent ready, waiting for chat input via AgentRuns...", flush=True)
            signal.signal(signal.SIGTERM, lambda *_: exit(0))
            while True:
                time.sleep(60)
        else:
            handle_request("What is agent-orca?")
  memory:
    checkpointEvery: 1
    resumeWindowSeconds: 3600
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

---
# AgentDeployment: long-running chat service backed by RAG
apiVersion: agentorca.agentorca.io/v1alpha1
kind: AgentDeployment
metadata:
  name: rag-demo-deployment
  namespace: default
spec:
  agentRef: rag-demo-agent
  inputSource:
    type: chat
  replicas: 1
  restartPolicy:
    minBackoffSeconds: 5
    maxBackoffSeconds: 300
    maxConsecutiveFailures: 5
  checkpointTTL: 604800
