---
# Secret for dev tenant client credentials
# Used for ACP API authentication during development
apiVersion: v1
kind: Secret
metadata:
  name: dev-client-secret
type: Opaque
stringData:
  password: "password"

---
# Developer TenantConfig for ACP API access
# Allows local development with clientId "dev" and secret "password"
# Uses the agent-orc-system namespace
# All agents in the default namespace are accessible (allowedAgents omitted = allow all)
apiVersion: agentorc.agentorc.io/v1alpha1
kind: TenantConfig
metadata:
  name: dev
spec:
  authMode: issued
  targetNamespace: agent-orc-system
  issued:
    clientID: dev
    clientSecretRef:
      name: dev-client-secret
      key: password