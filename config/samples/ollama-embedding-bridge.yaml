---
# Bridge to host-running Ollama from inside kind.
#
# Prerequisites:
#   1. Install Ollama: brew install ollama
#   2. Pull the embedding model: ollama pull nomic-embed-text
#   3. Ollama serves on host port 11434 by default
#
# On kind, the host is reachable at the Docker gateway IP.
# Find it with: docker inspect kind-control-plane -f '{{.NetworkSettings.Networks.kind.Gateway}}'
# Typically 172.18.0.1 on Linux Docker, or use host.docker.internal on Docker Desktop.

# Headless Service (no selector — we provide our own Endpoints)
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: default
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 11434
      targetPort: 11434
---
# Endpoints pointing to the Docker host where Ollama runs natively.
# Replace the IP if your Docker gateway differs.
# For Docker Desktop on macOS: use the IP resolved from host.docker.internal
# Find it: docker run --rm alpine nslookup host.docker.internal
apiVersion: v1
kind: Endpoints
metadata:
  name: ollama   # must match Service name
  namespace: default
subsets:
  - addresses:
      - ip: "192.168.65.254"   # Docker Desktop default gateway — update if different
    ports:
      - name: http
        port: 11434

---
# Same bridge in agent-orc-system namespace (operator needs to reach Ollama for embeddings)
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: agent-orc-system
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 11434
      targetPort: 11434
---
apiVersion: v1
kind: Endpoints
metadata:
  name: ollama
  namespace: agent-orc-system
subsets:
  - addresses:
      - ip: "192.168.65.254"
    ports:
      - name: http
        port: 11434
