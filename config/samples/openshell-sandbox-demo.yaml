# OpenShell sandbox demo (docs/openshell-sandbox.md).
#
# A sandboxed agent that runs shell commands, installs a package from PyPI, and
# uses an authenticated MCP tool both through the model-router and directly from
# the sandbox (with an OpenShell placeholder credential it never sees the value of).
#
# Prerequisites: the OpenShell gateway + agent-sandbox installed and the operator
# configured (openshell.enabled). Then:
#
#   kubectl label namespace agent-orca-system agentorca.io/enable-sandboxes=true
#   kubectl create secret generic vault-mcp-token -n agent-orca-system \
#     --from-literal=token="$(openssl rand -hex 24)"
#   kubectl apply -f config/samples/openshell-sandbox-demo.yaml
#   kubectl get agentrun sandbox-coder-demo -n agent-orca-system -w
---
# A minimal MCP server (JSON-RPC over HTTP POST) that requires a bearer token.
apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-mcp
  namespace: agent-orca-system
data:
  server.py: |
    import hmac, json, random
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    TOKEN = open("/etc/vault-mcp/token").read().strip()
    FORTUNES = [
        "A sandbox is a promise kept by the kernel.",
        "The best secret is the one the agent never held.",
        "Least privilege today, fewer incidents tomorrow.",
    ]
    TOOLS = [{
        "name": "vault_fortune",
        "description": "Returns a fortune from the authenticated vault about the given topic.",
        "inputSchema": {"type": "object", "properties": {"topic": {"type": "string"}}},
    }]

    class Handler(BaseHTTPRequestHandler):
        def log_message(self, *args):
            pass

        def reply(self, code, payload):
            data = json.dumps(payload).encode()
            self.send_response(code)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(data)))
            self.end_headers()
            self.wfile.write(data)

        def do_GET(self):
            self.reply(200 if self.path == "/healthz" else 405, {"ok": self.path == "/healthz"})

        def do_POST(self):
            body = json.loads(self.rfile.read(int(self.headers.get("Content-Length", 0))) or b"{}")
            ok = hmac.compare_digest(self.headers.get("Authorization", ""), "Bearer " + TOKEN)
            method = body.get("method")
            print(f"caller={self.client_address[0]} method={method} auth={'ok' if ok else 'DENIED'}", flush=True)
            if not ok:
                return self.reply(401, {"jsonrpc": "2.0", "id": body.get("id"),
                                        "error": {"code": -32001, "message": "unauthorized"}})
            if "id" not in body:  # notification
                self.send_response(202)
                self.end_headers()
                return
            if method == "initialize":
                result = {"protocolVersion": body.get("params", {}).get("protocolVersion", "2024-11-05"),
                          "capabilities": {"tools": {}}, "serverInfo": {"name": "vault", "version": "1.0"}}
            elif method == "tools/list":
                result = {"tools": TOOLS}
            elif method == "tools/call":
                topic = body.get("params", {}).get("arguments", {}).get("topic", "anything")
                result = {"content": [{"type": "text",
                                       "text": f"Vault fortune about {topic}: {random.choice(FORTUNES)}"}]}
            else:
                return self.reply(200, {"jsonrpc": "2.0", "id": body["id"],
                                        "error": {"code": -32601, "message": "method not found"}})
            self.reply(200, {"jsonrpc": "2.0", "id": body["id"], "result": result})

    ThreadingHTTPServer(("", 8000), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vault-mcp
  namespace: agent-orca-system
spec:
  replicas: 1
  selector:
    matchLabels: {app: vault-mcp}
  template:
    metadata:
      labels: {app: vault-mcp}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: server
          image: python:3.12-alpine
          command: ["python3", "-u", "/app/server.py"]
          ports: [{containerPort: 8000}]
          readinessProbe:
            httpGet: {path: /healthz, port: 8000}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: app, mountPath: /app}
            - {name: token, mountPath: /etc/vault-mcp, readOnly: true}
      volumes:
        - name: app
          configMap: {name: vault-mcp}
        - name: token
          secret: {secretName: vault-mcp-token}
---
apiVersion: v1
kind: Service
metadata:
  name: vault-mcp
  namespace: agent-orca-system
spec:
  selector: {app: vault-mcp}
  ports: [{port: 8000, targetPort: 8000}]
---
# The authenticated tool. The router sends the bearer token; a sandboxed agent
# gets an OpenShell placeholder bound to this URL's host:port.
apiVersion: agentorca.agentorca.io/v1alpha1
kind: Tool
metadata:
  name: vault
  namespace: agent-orca-system
spec:
  type: mcp
  mcpConfig:
    transport: http
    url: http://vault-mcp.agent-orca-system.svc.cluster.local:8000/mcp
    auth:
      bearerToken: {name: vault-mcp-token, key: token}
  networkEgress:
    - {host: vault-mcp.agent-orca-system.svc.cluster.local, port: 8000}
---
apiVersion: agentorca.agentorca.io/v1alpha1
kind: GuardrailPolicy
metadata:
  name: sandbox-demo
  namespace: agent-orca-system
spec:
  outputFilters:
    - name: redact-bearer-tokens
      type: regex
      action: redact
      patterns:
        - {name: bearer, pattern: "Bearer [A-Za-z0-9._~+/-]{16,}", replacement: "Bearer [REDACTED]"}
---
apiVersion: agentorca.agentorca.io/v1alpha1
kind: Agent
metadata:
  name: sandbox-coder
  namespace: agent-orca-system
spec:
  modelSelectorRef: default
  guardrailPolicyRef: sandbox-demo
  disableClarify: true
  tools: [vault]
  networkIsolation:
    splitPod: true
  runtime:
    ociRef: python:3.12-slim
    framework: openai-compatible
    inputMode: env
    sandbox:
      provider: openshell
      enforcement: enforce
      egress:
        - host: pypi.org
        - host: files.pythonhosted.org
    command: ["python3", "-u", "-c"]
    args:
      - |
        import json, os, re, subprocess, urllib.error, urllib.request

        def sh(cmd):
            r = subprocess.run(cmd, shell=True, capture_output=True, text=True, timeout=180)
            out = (r.stdout + r.stderr).strip()
            print(f"$ {cmd}\n{out}\n[exit {r.returncode}]", flush=True)
            return f"$ {cmd}\n{out[-2000:]}\n[exit {r.returncode}]"

        print("== 1. sandbox probes", flush=True)
        sh("id; uname -r; pwd")
        sh("echo hello > /sandbox/hello.txt && cat /sandbox/hello.txt")
        sh("echo tamper > /etc/agent-was-here")
        sh("pip install --quiet --disable-pip-version-check --target /sandbox/pylib cowsay "
           "&& PYTHONPATH=/sandbox/pylib python3 -m cowsay -t 'installed from PyPI inside the sandbox'")
        sh("python3 -c \"import urllib.request; urllib.request.urlopen('https://example.com', timeout=10)\" "
           "&& echo UNEXPECTED: example.com reachable || echo example.com blocked as expected")

        print("== 2. direct authenticated MCP call from the sandbox", flush=True)
        creds = json.loads(os.environ.get("AGENTORCA_TOOL_CREDENTIALS", "[]"))
        print("credential descriptor:", json.dumps(creds), flush=True)
        expand = lambda v: re.sub(r"\$\{(\w+)\}", lambda m: os.environ.get(m.group(1), ""), v)
        for c in creds:
            headers = {k: expand(v) for k, v in c["headers"].items()}
            print("value the agent holds:", next(iter(headers.values()))[:48] + "...", flush=True)

            def rpc(method, params):
                body = json.dumps({"jsonrpc": "2.0", "id": 1, "method": method, "params": params}).encode()
                req = urllib.request.Request(c["url"], data=body, headers={"Content-Type": "application/json", **headers})
                return json.load(urllib.request.urlopen(req, timeout=20))

            try:
                print("initialize ->", rpc("initialize", {"protocolVersion": "2024-11-05", "capabilities": {},
                                                          "clientInfo": {"name": "sandbox-agent", "version": "1"}})["result"]["serverInfo"])
                print("tools/list ->", [t["name"] for t in rpc("tools/list", {})["result"]["tools"]])
                print("tools/call ->", rpc("tools/call", {"name": "vault_fortune", "arguments": {"topic": "direct calls"}})["result"]["content"][0]["text"], flush=True)
            except urllib.error.HTTPError as e:
                print("direct MCP call failed:", e.code, e.read()[:300], flush=True)
            try:
                urllib.request.urlopen(urllib.request.Request("https://pypi.org/simple/", headers=headers), timeout=20)
                print("UNEXPECTED: placeholder accepted at pypi.org", flush=True)
            except urllib.error.HTTPError as e:
                print("exfiltration attempt to pypi.org refused:", e.code, e.read()[:200], flush=True)

        print("== 3. LLM-driven task", flush=True)
        system = (
            "You are a coding agent inside a locked-down Linux sandbox (workdir /sandbox). "
            "You can call the provided tools normally, e.g. the vault tool. To run shell commands, reply with ONLY "
            "a JSON object {\"commands\": [\"cmd\", ...]} and you will get their output. When the task is complete, "
            "reply with ONLY {\"done\": \"<short summary>\"}. Never call tools whose names start with an underscore.")
        messages = [{"role": "system", "content": system},
                    {"role": "user", "content": os.environ.get("AGENTORC_INPUT", "")}]
        def chat(messages):
            # The model-router always answers with an SSE stream; assemble the
            # reply text from its content deltas.
            req = urllib.request.Request(
                os.environ["OPENAI_BASE_URL"] + "/chat/completions",
                data=json.dumps({"model": "default", "messages": messages, "stream": True}).encode(),
                headers={"Content-Type": "application/json", "Authorization": "Bearer " + os.environ["OPENAI_API_KEY"]})
            content = ""
            for raw in urllib.request.urlopen(req, timeout=600):
                line = raw.decode("utf-8", "replace").strip()
                if not line.startswith("data:"):
                    continue
                data = line[5:].strip()
                if data == "[DONE]":
                    break
                try:
                    chunk = json.loads(data)
                except ValueError:
                    continue
                for choice in chunk.get("choices") or []:
                    content += (choice.get("delta") or {}).get("content") or ""
            return content

        for turn in range(8):
            content = chat(messages)
            print(f"-- model (turn {turn}): {content[:600]}", flush=True)
            messages.append({"role": "assistant", "content": content})
            m = re.search(r"\{.*\}", content, re.S)
            try:
                action = json.loads(m.group(0)) if m else {}
            except ValueError:
                action = {}
            if "done" in action:
                print("RESULT:", action["done"], flush=True)
                break
            if action.get("commands"):
                messages.append({"role": "user", "content": "\n".join(sh(c) for c in action["commands"])})
            else:
                messages.append({"role": "user", "content": "Reply with only the JSON object described in the instructions."})
---
apiVersion: agentorca.agentorca.io/v1alpha1
kind: AgentRun
metadata:
  name: sandbox-coder-demo
  namespace: agent-orca-system
spec:
  agentRef: sandbox-coder
  timeout: 15m
  restartPolicy:
    maxRetries: 0
  input: >-
    Use the vault tool to get a fortune about sandboxes. Then, with shell commands, write it to
    /sandbox/fortune.txt, print its sha256 with sha256sum, and list /sandbox. Finish with a
    summary that includes the fortune and the hash.
