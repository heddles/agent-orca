# This rule is not used by the project agent-orca itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the agentorca.agentorca.io.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: agent-orca
    app.kubernetes.io/managed-by: kustomize
  name: modelprovider-editor-role
rules:
- apiGroups:
  - agentorca.agentorca.io
  resources:
  - modelproviders
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - agentorca.agentorca.io
  resources:
  - modelproviders/status
  verbs:
  - get
