  # https://docs.together.ai/docs/inference-models
  # ════════════════════════════════════════════════════════════════════════════

  # Meta Llama 3.3 70B Instruct Turbo
  - name: together-llama-3-3-70b
    enabled: false
    litellmModel: "together_ai/meta-llama/Meta-Llama-3.3-70B-Instruct-Turbo"
    credentialsRef:
      existingSecret: "together-api-key"
      key: "api-key"
    capabilities:
      - reasoning
      - code
      - fast
    latencyProfile: fast
    constraints:
      contextWindow: 131072
      maxOutputTokens: 8192
      maxRequestTokens: 0
      costPerMillionInputTokens: "0.88"
      costPerMillionOutputTokens: "0.88"

  # Meta Llama 3.1 405B — largest open-source model available
  - name: together-llama-3-1-405b
    enabled: false
    litellmModel: "together_ai/meta-llama/Meta-Llama-3.1-405B-Instruct-Turbo"
    credentialsRef:
      existingSecret: "together-api-key"
      key: "api-key"
    capabilities:
      - reasoning
      - code
    latencyProfile: medium
    constraints:
      contextWindow: 130815
      maxOutputTokens: 4096
      maxRequestTokens: 0
      costPerMillionInputTokens: "3.50"
      costPerMillionOutputTokens: "3.50"

  # DeepSeek R1 — full reasoning model via Together AI
  - name: together-deepseek-r1
    enabled: false
    litellmModel: "together_ai/deepseek-ai/DeepSeek-R1"
    credentialsRef:
      existingSecret: "together-api-key"
      key: "api-key"
    capabilities:
      - reasoning
      - code
    latencyProfile: slow
    constraints:
      contextWindow: 163840
      maxOutputTokens: 8192
      maxRequestTokens: 0
      costPerMillionInputTokens: "7.00"
      costPerMillionOutputTokens: "7.00"

  # Qwen 2.5 72B Instruct Turbo
  - name: together-qwen-2-5-72b
    enabled: false
    litellmModel: "together_ai/Qwen/Qwen2.5-72B-Instruct-Turbo"
    credentialsRef:
      existingSecret: "together-api-key"
      key: "api-key"
    capabilities:
      - reasoning
      - code
      - fast
    latencyProfile: fast
    constraints:
      contextWindow: 32768
      maxOutputTokens: 8192
      maxRequestTokens: 0
      costPerMillionInputTokens: "1.20"
      costPerMillionOutputTokens: "1.20"

  # ════════════════════════════════════════════════════════════════════════════
  # DeepSeek (direct API)
  # https://platform.deepseek.com/api-docs/
  # ════════════════════════════════════════════════════════════════════════════

  # DeepSeek-V3 — top-tier open-source model at very low cost (V3.2)
  - name: deepseek-v3
    enabled: false
    litellmModel: "deepseek/deepseek-chat"
    credentialsRef:
      existingSecret: "deepseek-api-key"
      key: "api-key"
    capabilities:
      - reasoning
      - code
      - cheap
    latencyProfile: medium
    constraints:
      contextWindow: 65536
      maxOutputTokens: 8192
      maxRequestTokens: 0
      costPerMillionInputTokens: "0.28"
      costPerMillionOutputTokens: "0.42"

  # DeepSeek-R1 — advanced reasoning via chain-of-thought
  - name: deepseek-r1
    enabled: false
    litellmModel: "deepseek/deepseek-reasoner"
    credentialsRef:
      existingSecret: "deepseek-api-key"
      key: "api-key"
    capabilities:
      - reasoning
      - code
    latencyProfile: slow
    constraints:
      contextWindow: 65536
      maxOutputTokens: 8192
      maxRequestTokens: 0
      costPerMillionInputTokens: "0.55"
      costPerMillionOutputTokens: "2.19"

  # ════════════════════════════════════════════════════════════════════════════
  # Azure OpenAI
  # Requires: AZURE_API_BASE and AZURE_API_VERSION set in the operator env.
  # The litellmModel value corresponds to the deployment name in Azure.
  # https://learn.microsoft.com/en-us/azure/ai-services/openai/concepts/models
  # ════════════════════════════════════════════════════════════════════════════

  # azure-gpt-4o — GPT-4o deployed via Azure OpenAI
  - name: azure-gpt-4o
    enabled: false
    litellmModel: "azure/gpt-4o"     # must match the Azure deployment name
    baseURL: ""                       # e.g. https://my-resource.openai.azure.com/
    credentialsRef:
      existingSecret: "azure-openai-api-key"
      key: "api-key"
    capabilities:
      - reasoning
      - code
      - vision
      - fast
    latencyProfile: medium
    constraints:
      contextWindow: 128000
      maxOutputTokens: 16384
      maxRequestTokens: 0
      costPerMillionInputTokens: "2.50"
      costPerMillionOutputTokens: "10.00"

  # azure-gpt-4o-mini — GPT-4o-mini deployed via Azure OpenAI
  - name: azure-gpt-4o-mini
    enabled: false
    litellmModel: "azure/gpt-4o-mini" # must match the Azure deployment name
    baseURL: ""                        # e.g. https://my-resource.openai.azure.com/
    credentialsRef:
      existingSecret: "azure-openai-api-key"
      key: "api-key"
    capabilities:
      - fast
      - cheap
      - vision
    latencyProfile: fast
    constraints:
      contextWindow: 128000
      maxOutputTokens: 16384
      maxRequestTokens: 0
      costPerMillionInputTokens: "0.15"
      costPerMillionOutputTokens: "0.60"

  # ════════════════════════════════════════════════════════════════════════════
  # Ollama (in-cluster)
  # Deploy ollama-embedding-cluster.yaml first to run Ollama in the cluster.
  # Best for local development and testing without external API costs.
  # https://ollama.com/library
  # ════════════════════════════════════════════════════════════════════════════

  # nomic-embed-text — local embedding model (768-dim)
  # Model is pre-pulled by the ollama-pull-model Job when you deploy
  # ollama-embedding-cluster.yaml
  - name: ollama-nomic-embed-text
    enabled: true
    litellmModel: "ollama/nomic-embed-text"
    baseURL: "http://ollama-embed.agent-orc-system.svc:11434"
    credentialsRef:
      existingSecret: "ollama-embed-credentials"
      key: "api-key"
    capabilities:
      - embeddings
    latencyProfile: fast
    constraints:
      contextWindow: 8192
      costPerMillionInputTokens: "0"
      costPerMillionOutputTokens: "0"

# ─────────────────────────────────────────────────────────────────────────────
# Model Selectors
# Pre-built routing policies.  Enable those that match the model providers
# you have activated above.
#
# providers[].name must match a ModelProvider .name value above.
# ─────────────────────────────────────────────────────────────────────────────
modelSelectors:

  # default — balanced quality/cost, multi-provider fallback
  # Enable if you have at least one of: claude-sonnet-4-6, gpt-4o, gemini-2.0-flash
  - name: default
    enabled: true
    strategy: rule-based
    providers:
      - name: anthropic-claude-sonnet-4-6
        weight: 60
      - name: openai-gpt-4o
        weight: 40
    fallbackChain:
      - google-gemini-2-5-flash
      - anthropic-claude-haiku-4-5
      - groq-llama-3-3-70b

  # fast — lowest latency, optimised for interactive / high-volume workloads
  - name: fast
    enabled: true
    strategy: rule-based
    providers:
      - name: openai-gpt-4o-mini
        weight: 40
      - name: anthropic-claude-haiku-4-5
        weight: 40
      - name: google-gemini-2-5-flash-lite
        weight: 20
    fallbackChain:
      - groq-llama-3-1-8b

  # reasoning — deep analytical tasks, math, multi-step problem solving
  - name: reasoning
    enabled: true
    strategy: rule-based
    providers:
      - name: openai-o3-mini
        weight: 50
      - name: anthropic-claude-opus-4-6
        weight: 30
      - name: deepseek-r1
        weight: 20
    fallbackChain:
      - openai-o1
      - groq-deepseek-r1-distill-llama-70b

  # coding — code generation, review, and debugging
  - name: coding
    enabled: true
    strategy: rule-based
    providers:
      - name: anthropic-claude-sonnet-4-6
        weight: 40
      - name: openai-gpt-4o
        weight: 30
    fallbackChain:
      - deepseek-v3
      - groq-deepseek-r1-distill-llama-70b

  # vision — multimodal tasks requiring image or document understanding
  - name: vision
    enabled: true
    strategy: rule-based
    providers:
      - name: anthropic-claude-sonnet-4-6
        weight: 40
      - name: openai-gpt-4o
        weight: 40
      - name: google-gemini-2-5-flash
        weight: 20
    fallbackChain:
      - xai-grok-2-vision

  # long-context — processing large documents (>100k tokens)
  - name: long-context
    enabled: true
    strategy: rule-based
    providers:
      - name: google-gemini-2-5-pro
        weight: 50
      - name: anthropic-claude-sonnet-4-6
        weight: 30
      - name: google-gemini-2-5-flash
        weight: 20
    fallbackChain:
      - google-gemini-2-5-flash-lite

  # embeddings — vector embedding generation for RAG / semantic search
  - name: embeddings
    enabled: true
    strategy: rule-based
    providers:
      - name: openai-text-embedding-3-large
        weight: 40
      - name: google-gemini-embedding-001
        weight: 60
    fallbackChain:
      - mistral-embed
      - openai-text-embedding-3-small

  # ollama-embeddings — local in-cluster Ollama for embeddings
  # Used when running Ollama inside the cluster (no external API costs)
  - name: ollama-embeddings
    enabled: true
    strategy: rule-based
    providers:
      - name: ollama-nomic-embed-text
        weight: 100

  # cheap — cost-optimised for batch / background workloads
  - name: cheap
    enabled: true
    strategy: rule-based
    providers:
      - name: deepseek-v3
        weight: 40
      - name: google-gemini-2-5-flash-lite
        weight: 30
      - name: groq-llama-3-1-8b
        weight: 30
    fallbackChain:
      - openai-gpt-4o-mini
      - mistral-small

  # poolside — all poolside API models
  - name: poolside
    enabled: true
    strategy: rule-based
    providers:
      - name: poolside-laguna-m-ctx256k
      - name: poolside-laguna-xs3-rc2
      - name: poolside-laguna-xs3-rc1
      - name: poolside-fusion
      - name: poolside-kimi-k2-7-code
      - name: poolside-claude-fable-5
      - name: poolside-claude-opus-4-8-fast
      - name: poolside-deepseek-v4-flash
      - name: poolside-claude-opus-4-8
      - name: poolside-laguna-m-nvfp4
      - name: poolside-deepseek-v4-pro
      - name: poolside-production-e2e
      - name: poolside-laguna-xs-polaris
      - name: poolside-gpt-5-5
      - name: poolside-qwen-3-6-27b
      - name: poolside-kimi-k2-6
      - name: poolside-glm-5-1
      - name: poolside-minimax-m2-7
      - name: poolside-claude-opus-4-7
      - name: poolside-nemotron-3-120b
      - name: poolside-kimi-k2-5-turbo
      - name: poolside-kimi-k2-5-nitro
      - name: poolside-gpt-5-4-mini
      - name: poolside-claude-haiku-4-5
      - name: poolside-gemini-3-flash
      - name: poolside-grok-4-fast
      - name: poolside-deepseek-v3-2
      - name: poolside-gpt-oss-120b
      - name: poolside-gpt-5-4
      - name: poolside-qwen3-coder-next-cloud
      - name: poolside-qwen-3-5-35b
      - name: poolside-gpt-5-3-codex
      - name: poolside-trinity-preview
      - name: poolside-devstral
      - name: poolside-mimo-v2
      - name: poolside-minimax-m2-1
      - name: poolside-claude-opus-4-5
      - name: poolside-gemini-3-pro
      - name: poolside-glm-4-7
      - name: poolside-grok-code-fast
      - name: poolside-qwen3-235b
      - name: poolside-claude-4-5-sonnet
      - name: poolside-claude-sonnet-4-6
      - name: poolside-minimax-m2-5-nitro
      - name: poolside-nemotron-3-nano
