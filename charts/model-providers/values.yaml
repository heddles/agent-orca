    enabled: true
    litellmModel: "openai/gpt-4o"
    credentialsRef:
      existingSecret: "openai-api-key"
      key: "api-key"
    capabilities:
      - reasoning
      - code
      - vision
      - fast
    latencyProfile: medium
    constraints:
      contextWindow: 128000
      maxOutputTokens: 16384
      maxRequestTokens: 0
      costPerMillionInputTokens: "2.50"
      costPerMillionOutputTokens: "10.00"

