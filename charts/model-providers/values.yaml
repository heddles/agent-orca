  # Qwen 2.5 72B Instruct Turbo
  - name: together-qwen-2-5-72b
    enabled: false
    litellmModel: "together_ai/Qwen/Qwen2.5-72B-Instruct-Turbo"
    credentialsRef:
      existingSecret: "together-api-key"
      key: "api-key"
    capabilities:
      - reasoning
      - code
      - fast
    latencyProfile: fast
    constraints:
      contextWindow: 32768
      maxOutputTokens: 8192
      maxRequestTokens: 0
      costPerMillionInputTokens: "1.20"
      costPerMillionOutputTokens: "1.20"

  # ════════════════════════════════════════════════════════════════════════════
  # DeepSeek (direct API)
  # https://platform.deepseek.com/api-docs/
  # ════════════════════════════════════════════════════════════════════════════

  # DeepSeek-V3 — top-tier open-source model at very low cost (V3.2)
  - name: deepseek-v3
    enabled: false
    litellmModel: "deepseek/deepseek-chat"
    credentialsRef:
      existingSecret: "deepseek-api-key"
      key: "api-key"
    capabilities:
      - reasoning
      - code
      - cheap
    latencyProfile: medium
    constraints:
      contextWindow: 65536
      maxOutputTokens: 8192
      maxRequestTokens: 0
      costPerMillionInputTokens: "0.28"
      costPerMillionOutputTokens: "0.42"

  # DeepSeek-R1 — advanced reasoning via chain-of-thought
  - name: deepseek-r1
    enabled: false
    litellmModel: "deepseek/deepseek-reasoner"
    credentialsRef:
      existingSecret: "deepseek-api-key"
      key: "api-key"
    capabilities:
      - reasoning
      - code
    latencyProfile: slow
    constraints:
      contextWindow: 65536
      maxOutputTokens: 8192
      maxRequestTokens: 0
      costPerMillionInputTokens: "0.55"
      costPerMillionOutputTokens: "2.19"

  # ════════════════════════════════════════════════════════════════════════════
  # Azure OpenAI
  # Requires: AZURE_API_BASE and AZURE_API_VERSION set in the operator env.
  # The litellmModel value corresponds to the deployment name in Azure.
  # https://learn.microsoft.com/en-us/azure/ai-services/openai/concepts/models
  # ════════════════════════════════════════════════════════════════════════════

  # azure-gpt-4o — GPT-4o deployed via Azure OpenAI
  - name: azure-gpt-4o
    enabled: false
    litellmModel: "azure/gpt-4o"     # must match the Azure deployment name
    baseURL: ""                       # e.g. https://my-resource.openai.azure.com/
    credentialsRef:
      existingSecret: "azure-openai-api-key"
      key: "api-key"
    capabilities:
      - reasoning
      - code
      - vision
      - fast
    latencyProfile: medium
    constraints:
      contextWindow: 128000
      maxOutputTokens: 16384
      maxRequestTokens: 0
      costPerMillionInputTokens: "2.50"
      costPerMillionOutputTokens: "10.00"

  # azure-gpt-4o-mini — GPT-4o-mini deployed via Azure OpenAI
  - name: azure-gpt-4o-mini
    enabled: false
    litellmModel: "azure/gpt-4o-mini" # must match the Azure deployment name
    baseURL: ""                        # e.g. https://my-resource.openai.azure.com/
    credentialsRef:
      existingSecret: "azure-openai-api-key"
      key: "api-key"
    capabilities:
      - fast
      - cheap
      - vision
    latencyProfile: fast
    constraints:
      contextWindow: 128000
      maxOutputTokens: 16384
      maxRequestTokens: 0
      costPerMillionInputTokens: "0.15"
      costPerMillionOutputTokens: "0.60"

  # ════════════════════════════════════════════════════════════════════════════
  # Ollama (in-cluster)
  # Deploy ollama-embedding-cluster.yaml first to run Ollama in the cluster.
  # Best for local development and testing without external API costs.
  # https://ollama.com/library
  # ════════════════════════════════════════════════════════════════════════════

  # nomic-embed-text — local embedding model (768-dim)
  # Model is pre-pulled by the ollama-pull-model Job when you deploy
  # ollama-embedding-cluster.yaml
  #
  # nomic-embed-text requires task-specific prefixes: documents must start with
  # "search_document: " and queries with "search_query: ". Without these prefixes,
  # embeddings are produced in the wrong vector space and retrieval quality
  # degrades significantly.
  #
  # Two Ollama gotchas (from the model card):
  # 1. The native context window is 8,192 tokens, but the Ollama model card
  #    lists 2,048. Set num_ctx: 8192 in the Modelfile to use the full window.
  # 2. The model requires task prefixes (set below as queryPrompt/docPrompt).
  - name: ollama-nomic-embed-text
    enabled: false
    litellmModel: "ollama/nomic-embed-text"
    baseURL: "http://ollama-embed.agent-orca-system.svc:11434"
    credentialsRef:
      existingSecret: "ollama-embed-credentials"
      key: "api-key"
    capabilities:
      - embeddings
    latencyProfile: fast
    constraints:
      contextWindow: 8192
      costPerMillionInputTokens: "0"
      costPerMillionOutputTokens: "0"
    queryPrompt: "search_query: "
    docPrompt: "search_document: "

# ─────────────────────────────────────────────────────────────────────────────
# Model Selectors
# Pre-built routing policies.  Enable those that match the model providers
# you have activated above.
#
# providers[].name must match a ModelProvider .name value above.
# ─────────────────────────────────────────────────────────────────────────────
modelSelectors:

  # default — balanced quality/cost, multi-provider fallback
  # Enable if you have at least one of: claude-sonnet-4-6, gpt-4o, gemini-2.0-flash
  - name: default
    enabled: true
    strategy: rule-based
    providers:
      - name: openrouter-free
        weight: 80
      - name: anthropic-claude-sonnet-4-6
        weight: 60
      - name: openai-gpt-4o
        weight: 40
    fallbackChain:
      - google-gemini-2-5-flash
      - anthropic-claude-haiku-4-5
      - openrouter-free

  # fast — lowest latency, optimised for interactive / high-volume workloads
  - name: fast
    enabled: false
    strategy: rule-based
    providers:
      - name: openai-gpt-4o-mini
        weight: 40
      - name: anthropic-claude-haiku-4-5
        weight: 40
      - name: google-gemini-2-5-flash-lite
        weight: 20
    fallbackChain:
      - groq-llama-3-1-8b

  # reasoning — deep analytical tasks, math, multi-step problem solving
  - name: reasoning
    enabled: false
    strategy: rule-based
    providers:
      - name: openai-o3-mini
        weight: 50
      - name: anthropic-claude-opus-4-6
        weight: 30
      - name: deepseek-r1
        weight: 20
    fallbackChain:
      - openai-o1
      - groq-deepseek-r1-distill-llama-70b

  # coding — code generation, review, and debugging
  - name: coding
    enabled: false
    strategy: rule-based
    providers:
      - name: anthropic-claude-sonnet-4-6
        weight: 40
      - name: openai-gpt-4o
        weight: 30
    fallbackChain:
      - deepseek-v3
      - groq-deepseek-r1-distill-llama-70b

  # vision — multimodal tasks requiring image or document understanding
  - name: vision
    enabled: false
    strategy: rule-based
    providers:
      - name: anthropic-claude-sonnet-4-6
        weight: 40
      - name: openai-gpt-4o
        weight: 40
      - name: google-gemini-2-5-flash
        weight: 20
    fallbackChain:
      - xai-grok-2-vision

  # long-context — processing large documents (>100k tokens)
  - name: long-context
    enabled: false
    strategy: rule-based
    providers:
      - name: google-gemini-2-5-pro
        weight: 50
      - name: anthropic-claude-sonnet-4-6
        weight: 30
      - name: google-gemini-2-5-flash
        weight: 20
    fallbackChain:
      - google-gemini-2-5-flash-lite

  # embeddings — vector embedding generation for RAG / semantic search
  - name: embeddings
    enabled: false
    strategy: rule-based
    providers:
      - name: openai-text-embedding-3-large
        weight: 40
      - name: google-gemini-embedding-001
        weight: 60
    fallbackChain:
      - mistral-embed
      - openai-text-embedding-3-small

  # ollama-embeddings — local in-cluster Ollama for embeddings
  # Used when running Ollama inside the cluster (no external API costs)
  - name: ollama-embed
    enabled: false
    strategy: rule-based
    providers:
      - name: ollama-nomic-embed-text
        weight: 100

  # cheap — cost-optimised for batch / background workloads
  - name: cheap
    enabled: false
    strategy: rule-based
    providers:
      - name: deepseek-v3
        weight: 40
      - name: google-gemini-2-5-flash-lite
        weight: 30
      - name: groq-llama-3-1-8b
        weight: 30
    fallbackChain:
      - openai-gpt-4o-mini
      - mistral-small
