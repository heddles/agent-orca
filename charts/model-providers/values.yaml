# model-providers chart values
#
# Quick-start:
#   1. Set enabled: true + apiKey on each providerSecrets entry you want.
#   2. Set enabled: true on each modelProviders entry you want active.
#   3. Set enabled: true on the modelSelectors you want, updating the
#      providers list to match the models you enabled.
#
# Existing secrets: if you manage secrets externally (e.g. via ESO or Vault),
# set existingSecret: "<secret-name>" on a providerSecrets entry and leave
# apiKey empty.  The secret must have a key named "api-key".

# ─────────────────────────────────────────────────────────────────────────────
# Additional Namespaces
# ModelSelector CRs are always created in .Release.Namespace (typically
# agent-orca-system).  List any extra namespaces here that also need the
# selectors — for example, the `default` namespace so that agents deployed
# there can reference `modelSelectorRef: default` without a namespace hop.
# ─────────────────────────────────────────────────────────────────────────────
additionalNamespaces: []

# ─────────────────────────────────────────────────────────────────────────────
# Provider Secrets
# One Secret per provider API key.  Set enabled: true and fill in apiKey.
# ─────────────────────────────────────────────────────────────────────────────
providerSecrets:
  # ── OpenAI ─────────────────────────────────────────────────────────────────
  - name: openai-api-key
    enabled: true
    apiKey: ""            # sk-...
    existingSecret: ""    # leave empty to auto-create the secret

  # ── Anthropic ──────────────────────────────────────────────────────────────
  - name: anthropic-api-key
    enabled: true
    apiKey: ""            # sk-ant-...
    existingSecret: ""

  # ── Google Gemini (API key auth) ───────────────────────────────────────────
  # Obtain from https://aistudio.google.com/app/apikey
  - name: google-api-key
    enabled: true
    apiKey: ""            # AIza...
    existingSecret: ""

  # ── openrouter ───────────────────────────────────────────────────────────────
  - name: openrouter-api-key
    enabled: true
    apiKey: ""            # ps-...
    existingSecret: ""

  # ── Mistral AI ─────────────────────────────────────────────────────────────
  - name: mistral-api-key
    enabled: false
    apiKey: ""
    existingSecret: ""

  # ── Cohere ─────────────────────────────────────────────────────────────────
  - name: cohere-api-key
    enabled: false
    apiKey: ""
    existingSecret: ""

  # ── xAI (Grok) ─────────────────────────────────────────────────────────────
  - name: xai-api-key
    enabled: false
    apiKey: ""            # xai-...
    existingSecret: ""

  # ── Groq (ultra-fast hosted inference) ────────────────────────────────────
  - name: groq-api-key
    enabled: false
    apiKey: ""            # gsk_...
    existingSecret: ""

  # ── Together AI ────────────────────────────────────────────────────────────
  - name: together-api-key
    enabled: false
    apiKey: ""
    existingSecret: ""

  # ── DeepSeek ───────────────────────────────────────────────────────────────
  - name: deepseek-api-key
    enabled: false
    apiKey: ""
    existingSecret: ""

  # ── Azure OpenAI ───────────────────────────────────────────────────────────
  # Also set AZURE_API_BASE and AZURE_API_VERSION via operator env if needed.
  - name: azure-openai-api-key
    enabled: false
    apiKey: ""
    existingSecret: ""

  # ── Ollama (in-cluster embedding) ───────────────────────────────────────────
  # Used when Ollama is deployed inside the cluster for local embeddings.
  # No real API key required - the service is unauthenticated within the cluster.
  - name: ollama-embed-credentials
    enabled: true
    apiKey: "password"
    existingSecret: ""

# ─────────────────────────────────────────────────────────────────────────────
# Model Providers
# One entry per model.  Set enabled: true to create the ModelProvider CR.
# credentialsRef.existingSecret must match one of the providerSecrets names
# (or any pre-existing Secret in the namespace).
#
# baseURL: optional — omit for hosted cloud providers (LiteLLM resolves the
#   endpoint from the litellmModel prefix).  Set explicitly for self-hosted or
#   proxied endpoints, e.g.:
#     baseURL: "http://vllm-service.inference.svc:8000/v1"
#   Azure OpenAI requires baseURL to be set to your resource endpoint, e.g.:
#     baseURL: "https://my-resource.openai.azure.com/"
#
# maxRequestTokens: optional — set when your account's per-request or TPM limit
#   is lower than the model's contextWindow.  The router will skip this provider
#   for requests whose estimated token count exceeds this value.  0 = no limit.
# ─────────────────────────────────────────────────────────────────────────────
modelProviders:

  - name: openrouter-free
    enabled: true
    litellmModel: "openrouter/free"
    baseURL: "https://openrouter.ai/api/v1"
    credentialsRef:
      existingSecret: "openrouter-api-key"
      key: "api-key"
    capabilities:
      - reasoning
      - code
      - long-context
    latencyProfile: medium
    constraints:
      contextWindow: 1000000
      maxOutputTokens: 32768
      maxRequestTokens: 128000
      costPerMillionInputTokens: "0.10"
      costPerMillionOutputTokens: "0.20"

  # ════════════════════════════════════════════════════════════════════════════
  # OpenAI
  # https://platform.openai.com/docs/models
  # ════════════════════════════════════════════════════════════════════════════

