{{- $labels := include "model-providers.labels" . }}
{{- $namespaces := prepend (.Values.additionalNamespaces | default list) .Release.Namespace | uniq }}
{{- range $ns := $namespaces }}
{{- range $.Values.providerSecrets }}
{{- if and .enabled (not .existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .name }}
  namespace: {{ $ns }}
  labels:
    {{- $labels | nindent 4 }}
  annotations:
    # Preserve the secret across helm upgrades/deletions so API keys are not lost.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  api-key: {{ .apiKey | default "" | quote }}
{{- end }}
{{- end }}
{{- end }}
