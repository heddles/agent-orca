apiVersion: v1
kind: Secret
metadata:
  name: github-mcp-token
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "demo.labels" . | nindent 4 }}
  {{- if not .Values.githubToken }}
  annotations:
    agentorc.io/warning: "githubToken not set — GitHub MCP tools will fail auth. Set via --set githubToken=ghp_..."
  {{- end }}
type: Opaque
stringData:
  token: {{ .Values.githubToken | default "" | quote }}
