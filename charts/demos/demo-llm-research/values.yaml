nameOverride: ""
agent-orca-resources:
  # ── MCPServer ────────────────────────────────────────────────────────────────
  #
  # research-tools: HTTP transport MCP server providing web fetching, PDF extraction,
  # and arXiv search tools. The _controller is included in allowedAgents to enable
  # periodic KnowledgeBase ingestion via CronJobs.
  #
  # Network egress allows the agent to reach:
  #   - export.arxiv.org for arXiv API
  #   - Research sites (openreview.net, semanticscholar.org, github.com)
  #   - PDF documents
  mcpServers:
    - name: research-tools
      transport: http
      url: "http://research-tools-server.agent-orca-system.svc.cluster.local:8080"
      allowedAgents:
        - llm-research-agent
        - _controller
      networkEgress:
        - host: research-tools-server.agent-orca-system.svc.cluster.local
          port: 8080
          protocol: TCP
        - host: export.arxiv.org
          port: 443
          protocol: TCP
        - host: arxiv.org
          port: 443
          protocol: TCP
        - host: api.openreview.net
          port: 443
          protocol: TCP
        - host: www.semanticscholar.org
          port: 443
          protocol: TCP
        - host: github.com
          port: 443
          protocol: TCP
      tools:
        - name: web-fetch
          description: "Fetch web page content from a URL. Returns text content and metadata for research ingestion."
        - name: web-search
          description: "Search the web for academic papers and articles using DuckDuckGo (no API key required)."
        - name: pdf-extract
          description: "Download and extract text content from PDF research documents."
        - name: arxiv-search
          description: "Search arXiv.org for papers on LLM architecture, interpretability, and reasoning."
        - name: arxiv-fetch
          description: "Fetch full-text content from an arXiv paper by ID."
        - name: semaphore
          description: "Signal that research on a topic is complete and ready for synthesis."
      resources:
        requests:
          cpu: 500m
          memory: 2048Mi
        limits:
          cpu: 500m
          memory: 2048Mi
  # ── KnowledgeBase ──────────────────────────────────────────────────────────
  #
  # llm-research-kb: 25Gi vector store for LLM research documents.
  # Uses ollama-embeddings ModelSelector from model-providers chart.
  # syncIntervalSeconds creates a CronJob that runs every 6 hours to fetch
  # new arXiv papers. The _controller principal is required for ingestion Jobs.
  knowledgeBases:
    - name: llm-research-kb
      description: "Research corpus on LLM architecture, layer interpretation, interpretability, and capabilities analysis"
      allowedAgents:
        - llm-research-agent
      embedding:
        modelSelectorRef: ollama-embed
        chunkSize: 512
        chunkOverlap: 64
      vectorStore:
        storageSize: "25Gi"
      ingestion:
        syncIntervalSeconds: 21600 # Every 6 hours
        mcp:
          - mcpServerRef: research-tools
            discover:
              tool: arxiv-search
              arguments:
                query: "(cat:cs.LG OR cat:cs.AI OR cat:cs.CL) AND (LLM OR transformer OR attention OR interpretability)"
                max_results: 100
            discoverRecursive: false
            itemExtractor: jsonObjects
            itemField: id
            fetch:
              tool: arxiv-fetch
              arguments:
                paper_id: "{{item}}"
            maxItems: 20 # Reduced for safer incremental ingestion
            # Resources for the MCP ingestion Job (periodic arXiv fetcher)
            resources:
              requests:
                cpu: 500m
                memory: 2048Mi
              limits:
                cpu: 500m
                memory: 2048Mi

  # ── Agent ───────────────────────────────────────────────────────────────────
  agents:
    - name: llm-research-agent
      modelSelectorRef: default
      systemPrompt: |
        You are an autonomous LLM research agent. Your mission is to build a comprehensive
        knowledge base about how LLMs work internally — from attention mechanisms to layer
        interpretation, from feed-forward networks to reasoning capabilities.

        YOUR RESEARCH AREAS:
        - Transformer architecture fundamentals
        - Attention mechanism analysis and visualization
        - Layer-wise interpretability techniques
        - Activation patterns and what they reveal
        - Chain-of-thought and reasoning emergence
        - Embedding spaces and semantic geometry
        - Model scaling laws and capability thresholds
        - Mechanistic interpretability research

        YOUR TOOLS:
        1. _rag_search — query the llm-research-kb for existing knowledge
        2. _rag_ingest — store documents in the knowledge base for future retrieval
        3. research-tools-web-fetch — fetch web page content by URL
        4. research-tools-web-search — search for research papers and articles via DuckDuckGo
        5. research-tools-pdf-extract — extract text from PDF research papers
        6. research-tools-arxiv-search — search arXiv.org for papers on LLM topics
        7. research-tools-arxiv-fetch — fetch full arXiv paper content
        8. research-tools-semaphore — signal research completion on a topic
        9. _list_resources — list all available MCP servers, KnowledgeBases, and tools for this agent

        YOUR PROCESS:
        1. Start by searching your knowledge base for existing information
        2. Identify gaps that need external research
        3. Use web_search/arxiv_search to find relevant papers
        4. Fetch and extract content from promising sources
        5. Ingest key findings into the knowledge base with source attribution
        6. When research on a sub-topic is complete, call semaphore to signal
        7. Continue iterative research, expanding to related topics

        KEY SOURCES TO MONITOR:
        - arXiv.org (cs.LG, cs.AI, cs.CL categories)
        - OpenReview (ICLR, NeurIPS proceedings)
        - Semantic Scholar
        - Papers With Code
        - GitHub repositories with interpretability tools

        OUTPUT FORMAT for findings:
        - **Source**: [URL or citation]
        - **Key Insight**: [concise finding]
        - **Implications**: [what this tells us about LLM cognition]
        - **Relevance**: [connection to interpretation systems]
      tools:
        - research-tools-web-fetch
        - research-tools-web-search
        - research-tools-pdf-extract
        - research-tools-arxiv-search
        - research-tools-arxiv-fetch
        - research-tools-semaphore
      knowledgeBases:
        - llm-research-kb
      runtime:
        inputMode: http
        ociRef: "ghcr.io/heddles/agent-orca/openai-reference:latest"
        framework: openai-compatible
      memory:
        checkpointEvery: 5
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 1000m
          memory: 2Gi
  # ── AgentDeployment ───────────────────────────────────────────────────────
  agentDeployments:
    - name: llm-research
      agentRef: llm-research-agent
      inputSource:
        type: chat
      replicas: 1
      warmPoolSize: 1
      restartPolicy:
        minBackoffSeconds: 10
        maxBackoffSeconds: 600
        maxConsecutiveFailures: 10
  # ── MCP Server Deployments ──────────────────────────────────────────────────
  mcpServerDeployments:
    - name: research-tools-server
      fileName: server.py
      image: "python:3.12-slim"
      port: 8080
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
