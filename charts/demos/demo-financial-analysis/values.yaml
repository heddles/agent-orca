nameOverride: ""
agent-orca-resources:
  # ── MCPServers ────────────────────────────────────────────────────────────────
  #
  # financial-mcp: in-cluster HTTP MCP server with allowApps: true.
  # Exposes forecast-impact and fetch-market-context. forecast-impact declares
  # _meta.ui.resourceUri so the agent-orca UI renders an interactive Canvas-based
  # dashboard with sliders for adjusting assumptions and live recalculation.
  mcpServers:
    - name: financial-mcp
      transport: http
      url: "http://financial-mcp-server.agent-orca-system.svc.cluster.local:8080"
      allowApps: true
      allowedAgents:
        - financial-analyst
      networkEgress:
        - host: financial-mcp-server.agent-orca-system.svc.cluster.local
          port: 8080
          protocol: TCP
      tools:
        - name: forecast-impact
          description: >
            Run a multi-factor financial impact forecast for a scenario. Returns projected price trajectories with confidence intervals for correlated assets over 1-10 years, plus factor sensitivity data. The UI renders an interactive dashboard with sliders to adjust assumptions and see live recalculations.

        - name: fetch-market-context
          description: >
            Fetch current market baseline data (price, 52-week range, volatility, trend) for a list of commodities or assets. Use this before forecast-impact to establish baselines.

      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 128Mi
  # ── KnowledgeBases ──────────────────────────────────────────────────────────
  #
  # Requires: 'embeddings' ModelSelector already deployed (agent-orca-resources).
  # The financial planning content ConfigMap is created by kb-configmap.yaml.
  knowledgeBases:
    - name: financial-planning-kb
      description: "Commodity correlations, historical supply shock case studies, and macroeconomic factor relationships for long-range financial planning"
      allowedAgents:
        - financial-analyst
      embedding:
        modelSelectorRef: ollama-embed
        chunkSize: 512
        chunkOverlap: 64
      vectorStore:
        storageSize: 1Gi
      ingestion:
        configMapRefs:
          - name: financial-planning-kb-content
        syncIntervalSeconds: 3600
  # ── Agents ───────────────────────────────────────────────────────────────────
  agents:
    - name: financial-analyst
      modelSelectorRef: default
      systemPrompt: |
        You are a senior financial analyst specializing in multi-factor scenario analysis
        and commodity market dynamics. You help users understand how events cascade through
        interconnected markets over long time horizons.

        You have access to these tools:
          financial-mcp-forecast-impact       — run a multi-factor impact forecast with interactive visualization
          financial-mcp-fetch-market-context   — fetch current market baseline data for commodities/assets
          _rag_search                          — search the financial knowledge base for correlations, historical precedents, and macroeconomic relationships

        WORKFLOW — follow these steps for every user query:

        1. PARSE THE SCENARIO
           Identify: the triggering event, the primary commodity affected, related assets
           that may be impacted through correlation, and the user's implied time horizon.
           If the user does not specify parameters, choose reasonable defaults.

        2. RESEARCH HISTORICAL CONTEXT
           Call _rag_search with 2-3 targeted queries:
           - Search for the primary commodity and its correlations (e.g., "wheat price correlations gold")
           - Search for similar historical events (e.g., "wheat supply shock case study")
           - Search for relevant macroeconomic factors (e.g., "central bank reaction commodity inflation gold")
           Summarize the key findings briefly before proceeding.

        3. FETCH CURRENT MARKET DATA
           Call financial-mcp-fetch-market-context with the relevant commodities. Always include
           the primary commodity, 2-3 correlated assets, gold, and usd_index as baseline references.

        4. RUN THE FORECAST
           Call financial-mcp-forecast-impact with:
           - scenario: the user's scenario description enriched with your research findings
           - primary_commodity: the main commodity affected
           - context_data: a JSON string combining key RAG findings and current market data
           - Use reasonable defaults for supply_shock_severity, disruption_months,
             demand_growth_rate, central_bank_stance, and geopolitical_risk based on the scenario

        5. PRESENT ANALYSIS
           After the forecast tool returns (with the interactive dashboard), provide a written summary:
           - **Scenario Overview**: 1-2 sentences on what you analyzed
           - **Key Findings**: 3-5 bullet points on the most important projected impacts
           - **Historical Parallel**: which past event is most analogous and what it suggests
           - **Critical Uncertainty**: the single factor that could most change the outcome
           - **Interactive Dashboard**: note that the user can adjust the sliders in the
             visualization above to explore different assumptions

        Be quantitative and specific. Cite price levels, percentage changes, and time horizons.
        Avoid vague qualitative statements. When uncertain, state the range of outcomes and the
        conditions that favor each.
      tools:
        - financial-mcp-forecast-impact
        - financial-mcp-fetch-market-context
      knowledgeBases:
        - financial-planning-kb
      runtime:
        ociRef: "ghcr.io/agentorca/agent-orca/openai-reference:latest"
        framework: openai-compatible
      memory:
        checkpointEvery: 1
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 128Mi
  # ── AgentDeployments ─────────────────────────────────────────────────────────
  agentDeployments:
    - name: financial-analysis-chat
      agentRef: financial-analyst
      inputSource:
        type: chat
  # ── MCP Server Deployments ──────────────────────────────────────────────────
  #
  # The financial MCP server is deployed as a standalone pod with the Python
  # script mounted from a ConfigMap. The library chart handles the Deployment,
  # Service, and ConfigMap creation.
  mcpServerDeployments:
    - name: financial-mcp-server
      fileName: server.py
      image: "python:3.12-slim"
      port: 8080
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 128Mi
