{{- /*
programming-agent-handbook — curated engineering handbook ingested into the
agent-orca-codebase KnowledgeBase (ConfigMap-backed ingestion, re-synced hourly).
The senior-programmer agent searches this first for architecture/process context,
then falls back to live GitHub MCP tools for fresh source detail.
*/ -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: programming-agent-handbook
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "demo.labels" . | nindent 4 }}
data:
  architecture.md: |
    # agent-orca architecture (quick reference)

    agent-orca is an operator-built platform for running LLM-coded agents as
    first-class Kubernetes workloads. Key components:

    - **Operator** (charts/agent-orca): reconciles Agent, AgentDeployment, AgentRun,
      MCPServer, Tool, KnowledgeBase, ModelSelector, ModelProvider, and TenantConfig CRDs.
      Runs in the `agent-orca-system` namespace. The dev profile disables leader
      election and turns webhooks to Ignore mode.
    - **Model-router sidecar** (cmd/model-router): an OpenAI-compatible proxy injected
      into every agent pod. It injects the system prompt, tools, conversation history,
      episodic summaries, long-term-memory context, guardrails, built-in tool
      resolution (_done, _fail, _clarify, _handoff, _spawn, _rag_search, _rag_ingest),
      spend accounting, and checkpointing. Agents only stream chat/completions to
      http://localhost:8080/v1 — the router handles everything else.
    - **Agent image** (openai-reference): a thin, persona-free transport
      (ghcr.io/agentorca/agent-orca/openai-reference). It either runs one turn from
      AGENTORC_INPUT (env/inputMode=env) or serves GET /healthz + POST /invoke on PORT
      (inputMode=http, warm pool).
    - **KnowledgeBase / Qdrant**: a per-KB vector store. The operator provisions a
      Qdrant StatefulSet + PVC; chunks are embedded via a ModelSelector
      (capability: embeddings) and routed by the model-router. Ingestion sources are
      ConfigMaps, URLs, S3, or MCP server discovery. _rag_search queries;
      _rag_ingest writes back.
    - **MCP**: Model Context Protocol. MCPServer CRs declare tools; the controller
      auto-creates child Tool CRs named <server>-<tool>. stdio servers with an ociRef
      run as sidecars injected into agent pods (the binary is mounted via an image
      volume; credentials go through envFrom, never mcpConfig.auth).
    - **Model providers + selectors**: litellm-backed ModelProviders (OpenAI, Anthropic,
      Google, etc.) and ModelSelectors (rule-based / llm-meta / hybrid) route requests
      with weighted fallback and optional budget caps.
    - **UI** (Dockerfi.ui-proxy): served on the `agent-orca-ui` Service; skaffold
      port-forwards :80 -> localhost:8080. Internal API on
      `agent-orca-internal-api`: :8000 (chat execute), :8004, :8083 (OIDC).

    Traffic flow: User → UI/CLI → internal-api → model-router (side) → provider API.
    Tool calls: agent → model-router → MCP server (stdio sidecar or in-cluster HTTP).

  agent-lifecycle.md: |
    # Agent lifecycle & request model

    1. **Agent CR** defines a persona: modelSelectorRef, systemPrompt, tools,
       knowledgeBases, and a runtime (ociRef + framework). The openai-reference image
       is framework=openai-compatible; the model-router injects the rest.
    2. **AgentDeployment CR** wraps an Agent into a scalable, chat-moded service.
       POST /api/deployments/<namespace>/<deployment>/execute runs a turn (streaming).
       warmPoolSize keeps N pods pre-warmed for low latency; replicas scales the service.
       restartPolicy (minBackoff/maxBackoff/maxConsecutiveFailures) governs crash behavior.
    3. **AgentRun CR** is the unit of execution for each request. One chat turn == one
       AgentRun. Internals: pod = agent container + model-router sidecar (+ MCP sidecars).
       /api/deployments/.../execute → creates an AgentRun → pod scheduled → run executes
       → completion/failure recorded. Each AgentRun is auditable:
         kubectl get agentrun -n agent-orca-system \
           -l agentorca.io/deployment=senior-programmer
         kubectl describe agentrun <name> -n agent-orca-system   # tool calls + spend
    4. **Checkpointing** (memory.checkpointEvery + resumeWindowSeconds) persists
       conversation state to Redis so warm pods survive restarts and resume mid-run.
       The model-router also holds a local disk-backed checkpoint cache that write-
       throughs to Redis.

    Debugging knobs:
      - `kubectl logs <pod> -c agent`           # agent stdout/stderr (tokens stream here)
      - `kubectl logs <pod> -c model-router`    # router: tool resolution, spend, routing
      - `kubectl logs <pod> -c <mcp-sidecar>`   # stdio MCP server logs
      - `kubectl get knowledgebase agent-orca-codebase -n agent-orca-system -o wide`
      - `skaffold run -p dev` (dev profile) builds + kind-loads openai-reference:latest.

  debugging.md: |
    # Debugging guide for the senior programming agent

    Symptom: agent returns "I don't have a tool for that" or tools are missing.
      - `kubectl get tool -n agent-orca-system` — the MCPServer controller creates one
        Tool CR per declared tool (github-mcp-<tool>). Confirm they exist and are Ready.
      - Check the MCPServer status: `kubectl get mcpserver github-mcp -n agent-orca-system -o wide`.
      - The agent's `tools:` list must reference the exact Tool CR names
        (github-mcp-get-file-contents, etc.).

    Symptom: GitHub MCP tools return 401 / 403.
      - The github-mcp-token Secret holds the PAT. Confirm `kubectl get secret github-mcp-token -n agent-orca-system`.
      - The PAT needs `repo` scope (read). Confirm it's set:
        skaffold reads AGENT_ORCA_GITHUB_TOKEN; plain helm: --set githubToken=...
      - The PAT must read the target repository (public repos are fine; private repos
        require the token to have access).

    Symptom: _rag_search returns nothing.
      - `kubectl get knowledgebase agent-orca-codebase -n agent-orca-system`
        → wait for status Ready and at least one ingested document.
      - Ingestion needs the ollama-embed ModelSelector + Ollama deployed. See prerequisites.

    Symptom: slow first response (warm pool cold).
      - `warmPoolSize: 1` keeps one pod ready; the first request may still start it.
        Check `kubectl get pods -n agent-orca-system -l agentorca.io/deployment=senior-programmer`.

    Symptom: spend too high / budget hit.
      - The `default` selector has no budget cap. For demos, prefer faster/cheaper
        models (claude-haiku / gpt-4o-mini) or add a budgetCap to a dedicated selector.

  coding-conventions.md: |
    # Coding conventions & best practices (agent-orca)

    Operator (Go):
      - Modules: internal/ (controllers, framework, security, modelrouter),
        api/v1alpha1/ (CRD types), pkg/ (SDKs: python, ts), cmd/ (operator entrypoints).
      - Log with Zap via logr (r.Log from manager); errors wrap with %w.
      - Reconcile loops are idempotent: fetch, validate, diff, patch status with a
        Ready condition. Use ctrl.SetControllerReference for child owned CRs.
      - RBAC markers (// +kubebuilder:rbac) on the reconciler; run `make manifests`.
      - Admission: agentrun_webhook.go gate-validates spec (ociRef required, registry
        allowlist, tool-ref existence, MCP auth=stdio restriction → use envFrom).
      - NetworkPolicy: per-run egress allowlist built from tool MCP/networkEgress.

    Helm charts:
      - charts/demos/<demo>/ is a full application chart depending on the
        agent-orca-resources library chart (file://../../agent-orca-resources).
      - `values.yaml` nests CRs under the `agent-orca-resources` key; templates/resources.yaml
        renders them via the library helpers. `skaffold run -p <profile>` deploys one.
      - Secrets come from skaffold setValueTemplates / env — never commit tokens.
      - `helm lint` + `helm template` validate a chart locally.

    MCP servers:
      - stdio + ociRef ⇒ sidecar; pass the binary absolute path as args[0]
        (model-router rewrites it into the image-volume mount) and any flags after.
      - stdio credentials MUST use envFrom (secretKeyRef), NOT mcpConfig.auth
        (the webhook rejects auth on stdio).
      - Run stdio servers read-only in demos (--read-only / --tools allow-list).

    KnowledgeBases:
      - Embed via a ModelSelector whose provider supports /v1/embeddings (e.g. ollama-embed).
      - Ingest from ConfigMaps (static corpora) or MCP discovery (live). Re-sync hourly.
