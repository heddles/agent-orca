{{- /*
slack-mcp-token — holds the Slack user token (xoxp-...) consumed by the slack-mcp
MCPServer (HTTP transport) as a Bearer token in the Authorization header.

The model-router reads this Secret (mounted as a file into the sidecar at
/etc/agentorca-tool-secrets/slack-mcp/slack-mcp-token/token) and injects
`Authorization: Bearer <token>` on every request to https://mcp.slack.com/mcp.

The value is supplied at deploy time and is NEVER committed to the chart.
Under Skaffold it is wired from the AGENT_ORCA_SLACK_TOKEN env var; with plain
Helm:  helm install ... --set slackToken=xoxp_xxx
*/ -}}
{{- if .Values.slackToken }}
apiVersion: v1
kind: Secret
metadata:
  name: slack-mcp-token
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "demo.labels" . | nindent 4 }}
type: Opaque
stringData:
  token: {{ .Values.slackToken | quote }}
{{- else }}
  {{- /* Emit a placeholder so the MCPServer's auth.bearerToken still resolves when
          no token is provided — the slack-mcp sidecar will then fail its tool calls
          with a clear 401 rather than the pod failing to schedule on a missing
          Secret. */ -}}
apiVersion: v1
kind: Secret
metadata:
  name: slack-mcp-token
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "demo.labels" . | nindent 4 }}
annotations:
  note: "slackToken is not set; Slack MCP tools will return 401. Set slackToken (skaffold: AGENT_ORCA_SLACK_TOKEN)."
type: Opaque
stringData:
  token: ""
{{- end }}
