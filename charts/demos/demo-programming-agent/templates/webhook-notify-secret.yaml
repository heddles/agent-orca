{{- /*
Slack incoming webhook credentials for the senior-programmer demo.

The agent posts team notifications to Slack via the _webhook_notify builtin tool, which
POSTs to the webhook URL. The URL is the only credential (no per-user OAuth / browser
flow, no data residency): it is mounted into the model-router sidecar as
WEBHOOK_URL from this Secret (podbuilder.WebhookNotifySecretRef on the
AgentDeployment's webhookNotify.webhookSecretRef).

Provisioned from .webhookNotify.url via Skaffold env (AGENT_ORCA_WEBHOOK_URL) or
--set webhookNotify.url=... never committed. resource-policy: keep so your real webhook
URL is not reset on upgrade.
*/ -}}
---
apiVersion: v1
kind: Secret
metadata:
  name: webhook-notify
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "demo.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  url: {{ .Values.webhookNotify.url | quote }}
