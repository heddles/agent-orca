{{/* KnowledgeBase for CVE knowledge - indexed from NVD data */}}
{{- if .Values.components.knowledgeBase }}
---
apiVersion: agentorc.agentorc.io/v1alpha1
kind: KnowledgeBase
metadata:
  name: cve-knowledge-kb
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "demo.labels" . | nindent 4 }}
spec:
  description: "Indexed CVE database from NIST NVD for vulnerability correlation"
  allowedAgents:
    - pentest-orchestrator
  embedding:
    modelSelectorRef: embeddings
  vectorStore:
    provider: qdrant
    storageSize: "5Gi"
{{- end }}