{{/* Network MCP Server CRD */}}
{{- if .Values.components.networkMcpServer }}
---
apiVersion: agentorc.agentorc.io/v1alpha1
kind: MCPServer
metadata:
  name: network-mcp
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "demo.labels" . | nindent 4 }}
spec:
  transport: http
  url: http://network-mcp-server.{{ .Release.Namespace }}.svc:8080
  allowApps: true
  tools:
    - name: scan-target
      description: "Safe port scan and service detection on target host"
    - name: enumerate-hosts
      description: "Discover live hosts on a subnet (limited to /24 for safety)"
  allowedAgents:
    - pentest-orchestrator
{{- end }}