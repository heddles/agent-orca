{{/* MCPServer CRDs - define tools exposed to agents */}}
{{- if .Values.components.cveMcpServer }}
---
apiVersion: agentorc.agentorc.io/v1alpha1
kind: MCPServer
metadata:
  name: cve-mcp
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "demo.labels" . | nindent 4 }}
spec:
  transport: http
  url: http://cve-mcp-server.{{ .Release.Namespace }}.svc:8080
  allowApps: true
  tools:
    - name: search-cve
      description: "Search CVE database by keyword or vendor"
    - name: get-cve-details
      description: "Get detailed CVE information including CVSS and references"
  allowedAgents:
    - pentest-orchestrator
{{- end }}