apiVersion: v2
name: demo-escalation-chain
description: |
  Escalation Chain demo — multi-agent orchestration with human-in-the-loop.

  A deployment planner child agent checks a hardcoded service compatibility
  registry. When a version conflict requires a human decision, it calls _fail
  with the available options. The parent orchestrator escalates via _clarify,
  pauses until the engineer responds, then re-runs the planner with the
  chosen option.

  Requires: agent-orc operator deployed with a 'default' ModelSelector.
  No custom images — uses python:3.12-slim for all agent runtimes.
type: application
version: 0.1.0
appVersion: "0.1.0"
dependencies:
  - name: agent-orc-resources
    version: "0.2.0"
    repository: "file://../../agent-orc-resources"
keywords:
  - demo
  - agents
  - human-in-the-loop
  - escalation
