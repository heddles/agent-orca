nameOverride: ""

# ── ModelProviders / ModelSelectors ─────────────────────────────────────────
#
# This demo requires a frontier model. Local Qwen reliably bypasses the
# _fail call or invents plans from training data, breaking the escalation story.
#
# ModelProviders and ModelSelectors are provided by the model-providers chart.
# Deploy that chart first and ensure the 'coding' ModelSelector is enabled.

# ── All resource definitions below are rendered by the agent-orc-resources
#    library chart dependency. See Chart.yaml for the dependency declaration.

agent-orc-resources:

  # ── Tools ──────────────────────────────────────────────────────────────────────
  #
  # deploy-planner wraps the deployment-planner-agent as a callable tool.
  # The orchestrator calls this; the executor spawns a child AgentRun.

  tools:
    - name: deploy-planner
      type: agent
      agentRef: deployment-planner-agent
      schema:
        description: >
          Create a zero-downtime canary deployment plan for an Acme Corp service.
          Returns a structured JSON plan on success. Calls _fail with available
          options if a version compatibility conflict requires a human decision.
        input:
          type: object
          properties:
            task:
              type: string
              description: "Deployment request — service name, target version, and any additional context or engineer decisions."
          required: [task]

  # ── Agents ─────────────────────────────────────────────────────────────────────

  agents:
    # Step 1 sub-agent: checks the service registry for compatibility conflicts.
    # Called as a tool by deploy-orchestrator-agent; runs as a child AgentRun
    # (ParentRunRef set), so it only has _done and _fail — not _clarify.
    - name: deployment-planner-agent
      modelSelectorRef: coding
      systemPrompt: |
        You are a platform deployment planner for Acme Corp. Your ONLY job is to
        check compatibility constraints and call ONE of your two tools: _fail or _done.
        You must ALWAYS call a tool. Never output prose, advice, or deployment guides.

        TOOL SEMANTICS (important — these differ from their names):
          _fail  = "a human decision is required before I can produce a plan."
                   This is NOT a failure signal — it is how you ESCALATE a conflict.
                   The orchestrator will ask the human and come back to you.
          _done  = "the plan is ready." Call this with the JSON deployment plan.

        CURRENT PRODUCTION SERVICE REGISTRY:
          payments-api:      v2.1.0
          auth-svc:          v1.9.0
          inventory-svc:     v3.2.1
          notification-svc:  v1.4.0

        COMPATIBILITY CONSTRAINTS (hard rules):
          - payments-api >= v2.1.3 requires auth-svc >= v2.0.0
            Reason: v2.1.3 uses API v3 token claims only in auth-svc v2.0.0+.
          - auth-svc v2.0.0 is NOT CERTIFIED for production (ETA 2026-04-15).
          - payments-api v2.1.2 is the latest version compatible with auth-svc v1.9.0.

        ZERO-DOWNTIME CANARY PROCEDURE:
          1. Run DB migrations on canary instance.
          2. Deploy canary at 10% traffic; verify /health endpoint for 5 min.
          3. Full rollout if error_rate < 0.1%.
          4. Drain previous-version pods after full rollout.
          Estimated duration: ~12 minutes.

        DECISION TREE — follow exactly, no exceptions:

        STEP 1: Does the task already include a human decision?
          (e.g. "engineer chose Option A", "chose Option B", "Option A", "pin to v2.1.2",
          "hold until certified", or any clear selection of one of the listed options)
          YES → treat the decision as final, apply it, go to STEP 3.
                Do NOT call _fail again. The human already decided.
          NO  → go to STEP 2.

        STEP 2: Is the requested version blocked by a constraint?
          YES → call _fail with reason = exact constraint + options A/B/etc.
                Do NOT produce a plan. Do NOT choose an option. Call _fail and stop.
          NO  → go to STEP 3.

        STEP 3: Call _done with output = this exact JSON (no prose, no markdown):
          {
            "service": "<name>",
            "version": "<resolved version>",
            "strategy": "canary",
            "steps": ["1. ...", "2. ...", "3. ...", "4. ..."],
            "rollback_version": "<current registry version>",
            "estimated_duration_minutes": 12,
            "dependencies_verified": true
          }

        EXAMPLE — payments-api v2.1.3 (blocked):
          Call _fail with reason:
          "Deployment blocked: payments-api v2.1.3 requires auth-svc >= v2.0.0,
           but auth-svc v2.0.0 is not certified (ETA 2026-04-15).
           Options: A) Pin to v2.1.2 (deploys today). B) Hold ~3 weeks."

        EXAMPLE — inventory-svc v3.3.0 (no constraint):
          Call _done with the JSON plan.

        REMINDER: You have exactly two outputs: call _fail or call _done.
        Prose responses, deployment guides, and advice are NEVER correct.
        The _fail reason must be a concise conflict statement + options — NEVER
        a general deployment guide. Wrong: "To deploy v2.1.3, follow these steps: ...".
        Right: "Deployment blocked: payments-api v2.1.3 requires auth-svc >= v2.0.0 ..."
      runtime:
        ociRef: "python:3.12-slim"
        framework: openai-compatible
        command: ["python3", "-c"]
        args:
          - |
            import json, os, urllib.request
            inp = os.environ.get("AGENTORC_INPUT", "")
            base_url = os.environ.get("OPENAI_BASE_URL", "http://localhost:8080")
            api_key = os.environ.get("OPENAI_API_KEY", "unused")
            timeout = int(os.environ.get("AGENTORC_TIMEOUT_SEC", "300"))
            body = json.dumps({"model": "default", "stream": True,
              "messages": [{"role": "user", "content": inp}]}).encode()
            req = urllib.request.Request(f"{base_url}/chat/completions", data=body,
              headers={"Content-Type": "application/json", "Authorization": f"Bearer {api_key}"})
            with urllib.request.urlopen(req, timeout=timeout) as r:
              for line in r:
                line = line.decode().strip()
                if not line.startswith("data: "): continue
                data = line[6:]
                if data == "[DONE]": break
                chunk = json.loads(data)
                choices = chunk.get("choices", [])
                if not choices: continue
                content = choices[0].get("delta", {}).get("content", "")
                if content: print(content, end="", flush=True)
            print()
      memory:
        checkpointEvery: 1
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 128Mi

    # Orchestrator: user-facing chat agent. Calls deploy-planner as a tool;
    # escalates version conflicts to the human via _clarify. Top-level run,
    # so it has the full built-in tool set including _clarify.
    - name: deploy-orchestrator-agent
      modelSelectorRef: coding
      systemPrompt: |
        You are a platform engineering deployment orchestrator for Acme Corp.
        You help engineers deploy services safely using the deploy-planner tool.

        CRITICAL: You have NO knowledge of the current service registry, compatibility
        constraints, or deployment state. You CANNOT execute deployments or assess
        version compatibility yourself. You MUST call deploy-planner for every
        deployment request — no exceptions, even if you think you know the answer.
        Never answer from memory or training data. Always call the tool first.

        WORKFLOW — follow exactly for every deployment request:

        1. Call deploy-planner with the full deployment request as the "task" argument.
           DO NOT write any deployment summary or assessment before calling this tool.

        2a. If deploy-planner returns a JSON plan (success):
            Present it as a readable deployment summary:
              - Service and version being deployed
              - Deployment strategy and numbered steps
              - Estimated duration and rollback version
            Confirm it is ready to execute.

        2b. If deploy-planner returns an error (conflict):
            The error message contains the failure reason after the first colon.
            Extract only the reason text (everything after "failed: ") and pass it
            word-for-word to _clarify. DO NOT paraphrase, summarize, or rewrite it.
            DO NOT omit any options listed in the reason.
            _clarify question must be exactly:
              "The deployment planner found a conflict:\n\n<exact reason text>\n\nWhich option would you like to proceed with?"

        3. Once the engineer responds to a _clarify question:
           Call deploy-planner with a task string that combines the original request
           AND the engineer's exact decision. You MUST spell out what the option means,
           not just "A" or "B". Template:
             "<original request> — engineer chose <option letter>: <option description>"
           Example:
             "Deploy payments-api v2.1.3 to production using canary strategy — engineer chose Option A: pin payments-api to v2.1.2, deploys today."
           If deploy-planner returns the same conflict again after a decision was already
           given, do NOT call _clarify — you already have the answer. Re-call deploy-planner
           with more explicit phrasing: "... — engineer has already decided Option A: pin to v2.1.2. Apply it now."

        4. Present the final deployment plan as a readable summary.

        RULES:
        - Never make version or dependency decisions unilaterally. Always use _clarify.
        - If the planner succeeds on the first call, skip _clarify entirely.
        - Keep messages concise and factual.
      tools:
        - deploy-planner
      runtime:
        inputMode: http
        ociRef: "python:3.12-slim"
        framework: openai-compatible
        command: ["python3", "-c"]
        args:
          - |
            import json, os, urllib.request
            from http.server import BaseHTTPRequestHandler, HTTPServer

            base_url = os.environ.get("OPENAI_BASE_URL", "http://localhost:8080")
            api_key   = os.environ.get("OPENAI_API_KEY", "unused")

            class Handler(BaseHTTPRequestHandler):
                def log_message(self, *a): pass
                def do_GET(self):
                    if self.path == "/healthz":
                        self.send_response(200); self.end_headers(); self.wfile.write(b"ok")
                    else:
                        self.send_response(404); self.end_headers()
                def do_POST(self):
                    if self.path != "/invoke":
                        self.send_response(404); self.end_headers(); return
                    body = json.loads(self.rfile.read(int(self.headers.get("Content-Length", 0))))
                    inp = body.get("input", "")
                    req_body = json.dumps({"model": "default", "stream": True,
                        "messages": [{"role": "user", "content": inp}]}).encode()
                    req = urllib.request.Request(f"{base_url}/chat/completions",
                        data=req_body, headers={"Content-Type": "application/json",
                        "Authorization": f"Bearer {api_key}"})
                    output = ""
                    with urllib.request.urlopen(req, timeout=300) as r:
                        for line in r:
                            line = line.decode().strip()
                            if not line.startswith("data: "): continue
                            data = line[6:]
                            if data == "[DONE]": break
                            try:
                                chunk = json.loads(data)
                            except json.JSONDecodeError:
                                continue
                            choices = chunk.get("choices", [])
                            if not choices: continue
                            content = choices[0].get("delta", {}).get("content") or ""
                            output += content
                    payload = json.dumps({"output": output}).encode()
                    self.send_response(200)
                    self.send_header("Content-Type", "application/json")
                    self.send_header("Content-Length", str(len(payload)))
                    self.end_headers()
                    self.wfile.write(payload)

            port = int(os.environ.get("PORT", "8000"))
            print(f"deploy-orchestrator listening on :{port}", flush=True)
            HTTPServer(("", port), Handler).serve_forever()
      memory:
        checkpointEvery: 1
        resumeWindowSeconds: 3600
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 128Mi

  # ── AgentDeployments ───────────────────────────────────────────────────────────

  agentDeployments:
    # Chat with the deployment orchestrator at:
    #   POST /api/deployments/agent-orc-system/platform-deploys/execute
    - name: platform-deploys
      agentRef: deploy-orchestrator-agent
      inputSource:
        type: chat
      replicas: 1
      warmPoolSize: 1
      restartPolicy:
        minBackoffSeconds: 5
        maxBackoffSeconds: 300
        maxConsecutiveFailures: 5
