  # ── AgentDeployment ───────────────────────────────────────────────────────

  agentDeployments:
    - name: llm-research
      agentRef: llm-research-agent
      inputSource:
        type: chat
      replicas: 1
      warmPoolSize: 1
      restartPolicy:
        minBackoffSeconds: 10
        maxBackoffSeconds: 600
        maxConsecutiveFailures: 10


  # ── MCP Server Deployments ──────────────────────────────────────────────────

  mcpServerDeployments:
    - name: research-tools-server
      fileName: server.py
      image: "python:3.12-slim"
      port: 8080
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
