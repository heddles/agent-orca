                "execution_output": output[:2000], "execution_error": "" if success else error,
                "duration_ms": int((time.time()-start)*1000),
                "correctness": "pass" if success else "fail",
                "pass@k": {"k": 5, "value": 1.0 if success else 0.0},
                "first_success_attempt": next((a["attempt_number"] for a in attempts if a["success"]), None),
                "total_prompt_tokens": total_tokens,
                "total_generated_tokens": sum(a.get("tokens", 0) for a in attempts),
                "timestamp": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime())
            }))
      resources:
        requests:
          cpu: 500m
          memory: 512Mi
        limits:
          cpu: 1000m
          memory: 1Gi

    # ── Evaluation Agents (M.1) ─────────────────────────────────────────────

    # Python evaluation with Laguna M.1
    - name: eval-python-m1-agent
      modelSelectorRef: evaluation-m1
      systemPrompt: |
        You are a Python code evaluation agent. Generate working Python code, test it iteratively, and report metrics.

        INPUT JSON format: {"task": "...", "task_id": "python-m1", "max_attempts": 5}
        OUTPUT ONLY valid JSON with task_id, language, model, attempts array, final_result, correctness.
      runtime:
        inputMode: env
        ociRef: "agent-orc/eval-runtime:latest"
        framework: openai-compatible
        command: ["python3", "-c"]
        args:
          - |
            import json, os, subprocess, time, urllib.request, sys
            inp = json.loads(os.environ.get("AGENTORC_INPUT", "{}"))
            base_url = os.environ.get("OPENAI_BASE_URL", "http://localhost:8080")
            api_key = os.environ.get("OPENAI_API_KEY", "unused")
            task = inp.get("task", "")
            task_id = inp.get("task_id", "unknown")
            max_attempts = inp.get("max_attempts", 5)
            attempts, total_tokens, start = [], 0, time.time()
            success, output, error = False, "", ""

            for attempt in range(1, max_attempts + 1):
                if len(attempts) > 0:
                    last_error = attempts[-1]["error"]
                    prompt = f"Generate working Python code for: {task}. Previous attempt failed: {last_error}. Fix and output ONLY code with no markdown fences."
                else:
                    prompt = f"Generate working Python code for: {task}. Output ONLY code with no markdown fences."
                try:
                    resp = urllib.request.urlopen(urllib.request.Request(
                      f"{base_url}/chat/completions",
                      json.dumps({"model": "default", "messages": [{"role": "user", "content": prompt}]}).encode(),
                      headers={"Content-Type": "application/json", "Authorization": f"Bearer {api_key}"}))
                    data = json.loads(resp.read().decode())
                    code = data["choices"][0]["message"]["content"].strip()
                    if code.startswith("```"): code = "\n".join(code.split("\n")[1:-1])
                    tok = data.get("usage", {}).get("total_tokens", 0)
                except Exception as e:
                    print(json.dumps({"task_id": task_id, "error": f"LLM call failed: {e}"})); sys.exit(1)

                try:
                    result = subprocess.run(["python3", "-c", code], capture_output=True, text=True, timeout=30)
                    success = result.returncode == 0
                    output, error = result.stdout, result.stderr
                except Exception as e:
                    success, output, error = False, "", str(e)

                attempts.append({"attempt_number": attempt, "code": code, "success": success, "error": error[:500], "tokens": tok})
                total_tokens += tok
                if success: break

            print(json.dumps({
                "task_id": task_id, "language": "python", "model": "m1",
                "task_description": task, "attempts": attempts,
                "final_result": {"success": success, "total_attempts": len(attempts), "total_tokens": total_tokens},
                "execution_output": output[:2000], "execution_error": "" if success else error,
                "duration_ms": int((time.time()-start)*1000),
                "correctness": "pass" if success else "fail",
                "pass@k": {"k": 5, "value": 1.0 if success else 0.0},
                "first_success_attempt": next((a["attempt_number"] for a in attempts if a["success"]), None),
                "total_prompt_tokens": total_tokens,
                "total_generated_tokens": sum(a.get("tokens", 0) for a in attempts),
                "timestamp": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime())
            }))
      resources:
        requests:
          cpu: 500m
          memory: 512Mi
        limits:
          cpu: 1000m
          memory: 1Gi

