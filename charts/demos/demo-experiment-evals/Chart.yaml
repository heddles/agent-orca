apiVersion: v2
name: demo-experiment-evals
description: |
  LLM Code Generation Evaluations — declarative AgentWorkflow CRDs for benchmarking
  Laguna XS.2 vs M.1 models across Python, Go, Fortran, and JavaScript.

  Unlike demo-llm-research, this chart uses AgentWorkflow CRDs to define evaluations
  declaratively rather than relying on agent tool calls. This provides deterministic
  execution where all 8 evaluation steps run in parallel as defined in a single YAML file.

  Requires: agent-orc operator with poolside models deployed (via model-providers chart)
  and ollama-embeddings ModelSelector available.
type: application
version: 0.1.0
appVersion: "0.1.0"
keywords:
  - demo
  - agents
  - evaluation
  - benchmark
  - llm
dependencies:
  - name: agent-orc-resources
    version: "0.2.0"
    repository: "file://../../agent-orc-resources"