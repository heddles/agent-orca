---
# HTB OpenVPN configuration Secret.
#
# SAFETY: this only ever holds an HTB lab .ovpn (no real infra creds). The pwnbox
# pod mounts it read-only at /etc/htb via the Agent's runtime.secretRefs.
{{ if .Values.openvpn.createSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: htb-ovpn
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "demo.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep   # never delete/stale the user's real ovpn on upgrade
type: Opaque
stringData:
  {{ .Values.openvpn.fileName | default "htbea.ovpn" | quote }}: |
{{ .Values.openvpn.ovpnConfig | indent 4 }}
{{- else }}
# openvpn.createSecret=false: manage the Secret yourself so credentials aren't in
# values. The Agent's runtime.secretRefs still mount it at /etc/htb:
#   kubectl -n {{ .Release.Namespace }} create secret generic htb-ovpn \
#     --from-file=htbea.ovpn=/path/to/your/htb.ovpn
{{- end }}
