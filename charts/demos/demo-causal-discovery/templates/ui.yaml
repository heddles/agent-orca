---
# ServiceAccount for the causal discovery proxy
apiVersion: v1
kind: ServiceAccount
metadata:
  name: causal-discovery-proxy
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "demo.labels" . | nindent 4 }}

---
# Service for the causal discovery UI
apiVersion: v1
kind: Service
metadata:
  name: causal-discovery-ui
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "demo.labels" . | nindent 4 }}
spec:
  selector:
    app: causal-discovery-ui
  ports:
    - port: 80
      targetPort: 8080

---
# Deployment for the causal discovery UI proxy
# Note: This uses the agent-orc/causal-discovery-ui image which is built
# automatically by skaffold when running `skaffold run -p demo-causal-discovery`
apiVersion: apps/v1
kind: Deployment
metadata:
  name: causal-discovery-ui
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "demo.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: causal-discovery-ui
  template:
    metadata:
      labels:
        app: causal-discovery-ui
        {{- include "demo.labels" . | nindent 8 }}
    spec:
      serviceAccountName: causal-discovery-proxy
      containers:
        - name: ui
          image: "{{ .Values.ui.image.repository }}:{{ .Values.ui.image.tag }}"
          imagePullPolicy: {{ .Values.ui.image.pullPolicy }}
          ports:
            - containerPort: 8080
          env:
            - name: MCP_SERVER
              value: "http://causal-mcp-server.{{ .Release.Namespace }}.svc.cluster.local:8080"
          resources:
            {{- toYaml .Values.ui.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5