---
# UI ConfigMap - serves the React SPA
# Note: The UI is embedded at build time into the proxy image
# This ConfigMap is a placeholder for future dynamic UI configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: causal-discovery-ui-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "demo.labels" . | nindent 4 }}
data:
  config.json: |
    {
      "apiBase": "/api",
      "demoName": "causal-discovery"
    }