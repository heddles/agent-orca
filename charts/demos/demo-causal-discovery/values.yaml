nameOverride: ""

agent-orc-resources:

  # ── MCPServers ────────────────────────────────────────────────────────────────
  #
  # causal-mcp: Expert orchestration and causal graph tools
  # external-research-mcp: Academic database search (Phase 2)

  mcpServers:
    - name: causal-mcp
      transport: http
      url: "http://causal-mcp-server.agent-orc-system.svc.cluster.local:8080"
      allowApps: true
      allowedAgents:
        - causal-orchestrator
        - epidemiology-expert
        - economics-expert
        - neuroscience-expert
      networkEgress:
        - host: causal-mcp-server.agent-orc-system.svc.cluster.local
          port: 8080
          protocol: TCP
      tools:
        - name: propose-hypothesis
          description: >
            Generate causal hypotheses from an observational pattern.
            Takes user input describing observed relationships and proposes
            competing causal mechanisms with initial confidence scores.
        - name: score-evidence
          description: >
            Score evidence for a given hypothesis.
            Returns confidence level with supporting reasoning and potential confounders.
        - name: update-hypothesis-confidence
          description: >
            Update hypothesis confidence using Bayesian updating.
            Takes new evidence and updates the probability that the causal
            relationship exists.
        - name: add-temporal-constraint
          description: >
            Add temporal constraints to a causal hypothesis.
            Specifies time lags and decay patterns for causal effects.

  # ── KnowledgeBases ──────────────────────────────────────────────────────────
  #
  # Domain-specific knowledge bases for expert agents to search

  knowledgeBases:
    - name: causal-inference-kb
      description: "Foundational causal inference concepts, methods, and case studies"
      allowedAgents:
        - causal-orchestrator
        - epidemiology-expert
        - economics-expert
        - neuroscience-expert
      embedding:
        modelSelectorRef: ollama-embeddings
        chunkSize: 512
        chunkOverlap: 64
      vectorStore:
        storageSize: 1Gi
      ingestion:
        configMapRefs:
          - name: causal-inference-kb-content
        syncIntervalSeconds: 3600

    - name: epidemiology-kb
      description: "Epidemiology-specific causal relationships, bidirected graphs, and confounding detection"
      allowedAgents:
        - epidemiology-expert
      embedding:
        modelSelectorRef: ollama-embeddings
        chunkSize: 512
        chunkOverlap: 64
      vectorStore:
        storageSize: 512Mi
      ingestion:
        configMapRefs:
          - name: epidemiology-kb-content
        syncIntervalSeconds: 3600

    - name: economics-kb
      description: "Economic causal relationships, Granger causality, and instrumental variables"
      allowedAgents:
        - economics-expert
      embedding:
        modelSelectorRef: ollama-embeddings
        chunkSize: 512
        chunkOverlap: 64
      vectorStore:
        storageSize: 512Mi
      ingestion:
        configMapRefs:
          - name: economics-kb-content
        syncIntervalSeconds: 3600

    - name: neuroscience-kb
      description: "Neuroscience causal networks, brain connectivity, and intervention studies"
      allowedAgents:
        - neuroscience-expert
      embedding:
        modelSelectorRef: ollama-embeddings
        chunkSize: 512
        chunkOverlap: 64
      vectorStore:
        storageSize: 512Mi
      ingestion:
        configMapRefs:
          - name: neuroscience-kb-content
        syncIntervalSeconds: 3600

  # ── Agents ───────────────────────────────────────────────────────────────────

  agents:
    - name: causal-orchestrator
      modelSelectorRef: poolside
      systemPrompt: |
        You are a causal discovery orchestrator coordinating multiple domain experts.
        Your role is to:
        1. Parse observational patterns from user input
        2. Route queries to relevant domain experts
        3. Synthesize competing hypotheses into unified causal graphs
        4. Track evidence and confidence levels across experts
        5. Highlight conflicts and agreement between expert opinions

        Available tools:
          causal-mcp-propose-hypothesis         — generate causal hypotheses from patterns
          causal-mcp-score-evidence             — evaluate evidence for hypotheses
          causal-mcp-update-hypothesis-confidence — bayesian confidence updates
          causal-mcp-add-temporal-constraint    — add temporal reasoning
          _rag_search                           — search knowledge bases for context

        WORKFLOW:
        1. Receive observational pattern from user
        2. Use propose-hypothesis to generate initial causal graph
        3. Search knowledge bases for relevant methods and precedents
        4. Call score-evidence to get initial confidence
        5. Present findings with confidence levels and evidence sources
        6. Wait for user adjustments via interactive panel
      knowledgeBases:
        - causal-inference-kb
      runtime:
        ociRef: "python:3.12-slim"
        framework: openai-compatible
        command: ["python3", "-c"]
        args:
          - |
            import json, os, urllib.request
            inp = os.environ.get("AGENTORC_INPUT", "")
            base_url = os.environ.get("OPENAI_BASE_URL", "http://localhost:8080")
            api_key = os.environ.get("OPENAI_API_KEY", "unused")
            timeout = int(os.environ.get("AGENTORC_TIMEOUT_SEC", "300"))
            body = json.dumps({"model": "default", "stream": True,
              "messages": [{"role": "user", "content": inp}]}).encode()
            req = urllib.request.Request(f"{base_url}/chat/completions", data=body,
              headers={"Content-Type": "application/json", "Authorization": f"Bearer {api_key}"})
            with urllib.request.urlopen(req, timeout=timeout) as r:
              for line in r:
                line = line.decode().strip()
                if not line.startswith("data: "): continue
                data = line[6:]
                if data == "[DONE]": break
                chunk = json.loads(data)
                choices = chunk.get("choices", [])
                if not choices: continue
                content = choices[0].get("delta", {}).get("content", "")
                if content: print(content, end="", flush=True)
            print()
      memory:
        checkpointEvery: 1
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 256Mi

    - name: epidemiology-expert
      modelSelectorRef: poolside
      systemPrompt: |
        You are an epidemiology expert specializing in causal inference.
        Focus on: disease causation, treatment effects, confounding variables,
        bidirected graphs (unmeasured confounders), and causal diagrams.

        Use score-evidence to evaluate epidemiological hypotheses.
        Consider study design, sample size, and potential biases.
      tools:
        - causal-mcp-propose-hypothesis
        - causal-mcp-score-evidence
      knowledgeBases:
        - epidemiology-kb
      runtime:
        ociRef: "python:3.12-slim"
        framework: openai-compatible
