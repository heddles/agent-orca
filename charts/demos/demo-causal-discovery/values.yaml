            with urllib.request.urlopen(req, timeout=timeout) as r:
              for line in r:
                line = line.decode().strip()
                if not line.startswith("data: "): continue
                data = line[6:]
                if data == "[DONE]": break
                chunk = json.loads(data)
                choices = chunk.get("choices", [])
                if not choices: continue
                content = choices[0].get("delta", {}).get("content", "")
                if content: print(content, end="", flush=True)
            print()
      memory:
        checkpointEvery: 1
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 256Mi

    - name: economics-expert
      modelSelectorRef: poolside
      systemPrompt: |
        You are an economics expert specializing in causal inference.
        Focus on: Granger causality, instrumental variables, natural experiments,
        regression discontinuity, and policy effect estimation.

        Consider endogeneity, omitted variable bias, and reverse causality.
      tools:
        - causal-mcp-propose-hypothesis
        - causal-mcp-score-evidence
      knowledgeBases:
