  # ── AgentDeployments ─────────────────────────────────────────────────────────

  agentDeployments:
    - name: causal-discovery-chat
      agentRef: causal-orchestrator
      inputSource:
        type: chat

  # ── MCP Server Deployments ──────────────────────────────────────────────────
  #
  # The causal MCP server is deployed as a standalone pod with the Python
  # script mounted from a ConfigMap. The library chart handles the Deployment,
  # Service, and ConfigMap creation.

  mcpServerDeployments:
    - name: causal-mcp-server
      fileName: causal-server.py
      image: "python:3.12-slim"
      port: 8080
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 256Mi

  # ── Knowledge Base Content ConfigMaps ───────────────────────────────────────

  kbContentConfigMaps:
    - name: causal-inference-kb-content
      files:
        - src: causal-inference-primer.txt
          target: causal-inference-primer.txt
        - src: bidirected-graphs-explained.txt
          target: bidirected-graphs-explained.txt
        - src: confounding-variable-detection.txt
          target: confounding-variable-detection.txt

    - name: epidemiology-kb-content
      files:
        - src: epidemiology-causal-patterns.txt
          target: epidemiology-causal-patterns.txt
        - src: study-design-basics.txt
          target: study-design-basics.txt

    - name: economics-kb-content
      files:
        - src: granger-causality-101.txt
          target: granger-causality-101.txt
        - src: instrumental-variables-guide.txt
          target: instrumental-variables-guide.txt

    - name: neuroscience-kb-content
      files:
        - src: effective-connectivity.txt
          target: effective-connectivity.txt
        - src: neural-intervention-design.txt
          target: neural-intervention-design.txt

# ── UI Configuration (top-level) ─────────────────────────────────────────────

ui:
  image:
    repository: agent-orc/causal-discovery-ui
    tag: latest
    pullPolicy: Never
  operatorUrl: "http://agent-orc-operator.agent-orc-system.svc.cluster.local:8083"
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi