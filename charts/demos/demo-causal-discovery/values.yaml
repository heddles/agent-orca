                choices = chunk.get("choices", [])
                if not choices: continue
                content = choices[0].get("delta", {}).get("content", "")
                if content: print(content, end="", flush=True)
            print()
      memory:
        checkpointEvery: 1
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 256Mi

    - name: neuroscience-expert
      modelSelectorRef: poolside
      systemPrompt: |
        You are a neuroscience expert specializing in causal brain networks.
        Focus on: effective connectivity, Granger causality in neural signals,
        intervention experiments, and brain stimulation studies.

        Consider neural plasticity, feedback loops, and distributed processing.
      tools:
        - causal-mcp-propose-hypothesis
        - causal-mcp-score-evidence
      knowledgeBases:
        - neuroscience-kb
      runtime:
        ociRef: "python:3.12-slim"
