apiVersion: v2
name: demo-causal-discovery
description: |
  Causal Discovery Microscope - Interactive AI system for real-time causal hypothesis
  generation and testing using Mixture of Experts architecture with live research
  integration and dynamic evidence visualization.

  Features:
    - Multi-domain expert agents (epidemiology, economics, neuroscience, etc.)
    - Causal graph visualization with Cytoscape.js
    - Real-time evidence scoring and confidence updates
    - Academic database integration (Semantic Scholar, arXiv, PubMed)
    - Interactive expert panel with toggleable weights

type: application
version: 0.2.0
appVersion: "0.2.0"
dependencies:
  - name: agent-orc-resources
    version: "0.2.0"
    repository: "file://../../agent-orc-resources"
keywords:
  - demo
  - causal-discovery
  - mixture-of-experts
  - mcp
  - knowledgebase
  - interactive
  - research