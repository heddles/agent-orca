---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: modelproviders.agentorc.agentorc.io
spec:
  group: agentorc.agentorc.io
  names:
    kind: ModelProvider
    listKind: ModelProviderList
    plural: modelproviders
    singular: modelprovider
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.litellmModel
      name: Model
      type: string
    - jsonPath: .status.ready
      name: Ready
      type: boolean
    - jsonPath: .spec.latencyProfile
      name: Latency
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ModelProvider registers an LLM endpoint for use by agents.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ModelProviderSpec defines a connection to an LLM endpoint
              via a LiteLLM model string.
            properties:
              baseURL:
                description: |-
                  BaseURL overrides the default API endpoint derived from the LiteLLM model prefix.
                  Use this for self-hosted models (e.g. "http://ollama.default.svc:11434")
                  or when the provider endpoint differs from the default.
                type: string
              capabilities:
                description: |-
                  Capabilities tags this model's strengths, used by the rule-based router.
                  Known values: reasoning, code, vision, fast, long-context, cheap
                items:
                  type: string
                type: array
              constraints:
                description: Constraints describes the model's resource limits and
                  pricing.
                properties:
                  contextWindow:
                    description: ContextWindow is the maximum number of tokens the
                      model accepts.
                    type: integer
                  costPerMillionInputTokens:
                    description: |-
                      CostPerMillionInputTokens is the USD cost per million input tokens as a decimal string.
                      Example: "3.00" (i.e. $3 per million input tokens)
                    type: string
                  costPerMillionOutputTokens:
                    description: |-
                      CostPerMillionOutputTokens is the USD cost per million output tokens as a decimal string.
                      Example: "15.00" (i.e. $15 per million output tokens)
                    type: string
                  maxOutputTokens:
                    description: MaxOutputTokens is the maximum number of tokens the
                      model can generate.
                    type: integer
                  maxRequestTokens:
                    description: |-
                      MaxRequestTokens is the effective per-request token limit for this provider.
                      When set, the router will not route requests whose estimated token count
                      exceeds this value to this provider. Use this when the provider's account-level
                      rate limit (e.g. TPM) is lower than the model's ContextWindow.
                      0 means no per-request limit (ContextWindow is used for sizing decisions).
                    type: integer
                type: object
              credentialsRef:
                description: |-
                  CredentialsRef points to the Secret containing the provider API key.
                  The model-router sidecar mounts this secret directly; the operator never reads it.
                properties:
                  key:
                    description: Key within the Secret.
                    type: string
                  name:
                    description: Name of the Secret.
                    type: string
                  namespace:
                    description: Namespace of the Secret. Defaults to the same namespace
                      as the referencing resource.
                    type: string
                required:
                - key
                - name
                type: object
              docPrompt:
                description: |-
                  DocPrompt is an optional prefix prepended to document chunks before embedding.
                  Required by some open-source embedding models (e.g. nomic-embed-text via
                  Ollama) that need task-specific instructions to produce retrieval-quality
                  vectors. When set, this prefix is applied to _rag_ingest document embeddings.
                  Example: "search_document: "
                type: string
              latencyProfile:
                default: medium
                description: LatencyProfile is a coarse latency classification used
                  by the router.
                enum:
                - fast
                - medium
                - slow
                type: string
              litellmModel:
                description: |-
                  LiteLLMModel is the LiteLLM model identifier used to dispatch requests.
                  Examples:
                    "anthropic/claude-sonnet-4-6"
                    "gemini/gemini-2.0-flash"
                    "ollama/llama3.2"
                    "bedrock/anthropic.claude-3-5-sonnet-20241022-v2:0"
                    "openai/gpt-4o"
                minLength: 1
                type: string
              queryPrompt:
                description: |-
                  QueryPrompt is an optional prefix prepended to query text before embedding.
                  Required by some open-source embedding models (e.g. nomic-embed-text via
                  Ollama) that need task-specific instructions to produce retrieval-quality
                  vectors. When set, this prefix is applied to _rag_search query embeddings.
                  Example: "search_query: "
                type: string
            required:
            - credentialsRef
            - litellmModel
            type: object
          status:
            description: ModelProviderStatus defines the observed state of a ModelProvider.
            properties:
              conditions:
                description: Conditions holds standard Kubernetes conditions.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastChecked:
                description: LastChecked is the last time the provider was health-checked.
                format: date-time
                type: string
              message:
                description: Message contains a human-readable status message.
                type: string
              ready:
                description: Ready indicates the provider endpoint is reachable and
                  credentials are valid.
                type: boolean
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
