                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              dynamicStepStatuses:
                description: DynamicStepStatuses holds execution state for dynamic
                  steps.
                items:
                  description: WorkflowStepStatus holds runtime state for a single
                    step.
                  properties:
                    agentRunRef:
                      description: AgentRunRef is the name of the AgentRun created
                        for this step.
                      type: string
                    completionTime:
                      description: CompletionTime is when the step reached a terminal
                        phase.
                      format: date-time
                      type: string
                    failureReason:
                      description: FailureReason is a human-readable explanation when
                        Phase is Failed.
                      type: string
                    name:
                      description: Name matches a step name in spec.steps.
                      type: string
                    output:
                      description: |-
                        Output is the AgentRun output for this step, truncated to 10 KB.
                        Available to downstream steps via {{steps.<name>.output}}.
                      type: string
                    phase:
                      description: Phase is the current lifecycle state of this step.
                      enum:
                      - Pending
                      - Running
                      - Succeeded
                      - Failed
                      - Skipped
                      - WaitingForInput
                      type: string
                    source:
                      description: |-
                        Source indicates whether this step was defined statically in spec.steps
                        or added dynamically via a _propose_step call. Values: "static", "dynamic".
                      enum:
                      - static
                      - dynamic
                      type: string
                    spendUSD:
                      description: SpendUSD is the USD spend recorded on the step's
                        AgentRun.
                      type: string
                    startTime:
                      description: StartTime is when the step's AgentRun was created.
                      format: date-time
                      type: string
                  required:
                  - name
                  - phase
                  type: object
                type: array
              dynamicSteps:
                description: |-
                  DynamicSteps holds steps added at runtime by agent proposals.
                  These are reconciled by the controller using the same scheduling logic as spec.steps.
                items:
                  description: WorkflowStep defines a single node in the workflow
                    DAG.
                  properties:
                    agentRef:
                      description: AgentRef is the name of the Agent CRD to run for
                        this step.
                      type: string
                    callbacks:
                      description: Callbacks fires webhooks when this step completes
                        or fails.
                      properties:
                        onComplete:
                          description: OnComplete is a URL that receives a POST when
                            the run succeeds.
                          type: string
                        onFailed:
                          description: OnFailed is a URL that receives a POST when
                            the run fails.
                          type: string
                      type: object
                    condition:
                      description: |-
                        Condition is a CEL expression evaluated before this step starts.
                        The expression has access to a "steps" variable: map of step name →
                        {phase: string, output: string}. If the expression evaluates to false
                        the step is marked Skipped rather than started.
                        Example: 'steps["gather"].phase == "Succeeded"'
                      type: string
                    dependsOn:
                      description: |-
                        DependsOn lists step names that must reach a terminal phase (Succeeded or Skipped)
                        before this step is eligible to start.
                      items:
                        type: string
                      type: array
                    input:
                      description: |-
                        Input is the task string passed to the agent as AGENTORC_INPUT.
                        Supports template variables:
                          {{steps.<name>.output}}  — the Output of a named predecessor step
                      type: string
                    name:
                      description: |-
                        Name is a unique identifier for this step within the workflow.
                        Used in DependsOn references and template variables.
                      pattern: ^[a-z0-9][a-z0-9\-]*$
                      type: string
                    timeout:
                      description: Timeout overrides the workflow-level timeout for
                        this specific step.
                      type: string
                  required:
                  - agentRef
                  - input
                  - name
                  type: object
                type: array
              phase:
                description: Phase is the overall workflow lifecycle state.
                enum:
                - Pending
                - Running
                - Succeeded
                - Failed
                - Cancelled
                - Template
                type: string
              proposalLog:
                description: ProposalLog records all proposals (approved and rejected)
                  for auditability.
                items:
                  description: StepProposal records a dynamic step proposal from an
                    agent, for auditability.
                  properties:
                    approved:
                      description: Approved indicates whether the proposal was accepted.
                      type: boolean
                    pendingHumanApproval:
                      description: |-
                        PendingHumanApproval is true when the proposal requires human review.
                        The proposing step is paused (WaitingForInput) until a human responds.
                      type: boolean
                    proposedStep:
                      description: ProposedStep is the step definition that was proposed.
                      properties:
                        agentRef:
                          description: AgentRef is the name of the Agent CRD to run
                            for this step.
                          type: string
                        callbacks:
                          description: Callbacks fires webhooks when this step completes
                            or fails.
                          properties:
                            onComplete:
                              description: OnComplete is a URL that receives a POST
                                when the run succeeds.
                              type: string
                            onFailed:
                              description: OnFailed is a URL that receives a POST
                                when the run fails.
                              type: string
                          type: object
                        condition:
                          description: |-
                            Condition is a CEL expression evaluated before this step starts.
                            The expression has access to a "steps" variable: map of step name →
                            {phase: string, output: string}. If the expression evaluates to false
                            the step is marked Skipped rather than started.
                            Example: 'steps["gather"].phase == "Succeeded"'
                          type: string
                        dependsOn:
                          description: |-
                            DependsOn lists step names that must reach a terminal phase (Succeeded or Skipped)
                            before this step is eligible to start.
                          items:
                            type: string
                          type: array
                        input:
                          description: |-
                            Input is the task string passed to the agent as AGENTORC_INPUT.
                            Supports template variables:
                              {{steps.<name>.output}}  — the Output of a named predecessor step
                          type: string
                        name:
                          description: |-
                            Name is a unique identifier for this step within the workflow.
                            Used in DependsOn references and template variables.
                          pattern: ^[a-z0-9][a-z0-9\-]*$
                          type: string
                        timeout:
                          description: Timeout overrides the workflow-level timeout
                            for this specific step.
                          type: string
                      required:
                      - agentRef
                      - input
                      - name
                      type: object
                    proposingStep:
                      description: ProposingStep is the name of the workflow step
                        whose agent made the proposal.
                      type: string
                    reason:
                      description: Reason explains why the proposal was approved or
                        rejected.
                      type: string
                    timestamp:
                      description: Timestamp is when the proposal was evaluated.
                      format: date-time
                      type: string
                  required:
                  - approved
                  - proposedStep
                  - proposingStep
                  - timestamp
                  type: object
                type: array
              startTime:
                description: StartTime is when the first step was launched.
                format: date-time
                type: string
              steps:
                description: Steps holds per-step execution state, one entry per spec.steps
                  entry.
                items:
                  description: WorkflowStepStatus holds runtime state for a single
                    step.
                  properties:
                    agentRunRef:
                      description: AgentRunRef is the name of the AgentRun created
                        for this step.
                      type: string
                    completionTime:
                      description: CompletionTime is when the step reached a terminal
                        phase.
                      format: date-time
                      type: string
                    failureReason:
                      description: FailureReason is a human-readable explanation when
                        Phase is Failed.
                      type: string
                    name:
                      description: Name matches a step name in spec.steps.
                      type: string
                    output:
                      description: |-
                        Output is the AgentRun output for this step, truncated to 10 KB.
                        Available to downstream steps via {{steps.<name>.output}}.
                      type: string
                    phase:
                      description: Phase is the current lifecycle state of this step.
                      enum:
                      - Pending
                      - Running
                      - Succeeded
                      - Failed
                      - Skipped
                      - WaitingForInput
                      type: string
                    source:
                      description: |-
                        Source indicates whether this step was defined statically in spec.steps
                        or added dynamically via a _propose_step call. Values: "static", "dynamic".
                      enum:
                      - static
                      - dynamic
                      type: string
                    spendUSD:
                      description: SpendUSD is the USD spend recorded on the step's
                        AgentRun.
                      type: string
                    startTime:
                      description: StartTime is when the step's AgentRun was created.
                      format: date-time
                      type: string
                  required:
                  - name
                  - phase
                  type: object
                type: array
              template:
                description: Template records the template this workflow was built
                  from (fromTemplate).
                properties:
                  generation:
                    description: Generation of the template when the instance was
                      built from it.
                    format: int64
                    type: integer
                  name:
                    description: Name of the template.
                    type: string
                required:
                - generation
                - name
                type: object
              totalSpendUSD:
                description: TotalSpendUSD is the sum of SpendUSD across all step
                  AgentRuns.
                type: string
            type: object
