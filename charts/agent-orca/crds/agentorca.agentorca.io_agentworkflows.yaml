    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          AgentWorkflow is a declarative DAG of agent steps. The operator controller
          sequences steps, threads outputs between them, and enforces budget caps —
          without requiring the LLM to coordinate execution.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              AgentWorkflowSpec defines a declarative DAG of agent steps.
              The controller — not the LLM — determines step ordering, threads outputs between steps,
              and enforces workflow-level budget caps. This is the deterministic complement to the
              dynamic agent-as-tool pattern.
            properties:
              adaptivePolicy:
                description: |-
                  AdaptivePolicy enables agents to propose new steps at runtime.
                  If nil, all _propose_step calls are rejected.
                properties:
                  allowLoops:
                    description: AllowLoops permits re-running a step with refined
                      input.
                    type: boolean
                  allowedAgentRefs:
                    description: |-
                      AllowedAgentRefs restricts which Agent CRDs can be proposed.
                      If empty, any agent in the namespace may be proposed.
                    items:
                      type: string
                    type: array
                  maxDynamicSteps:
                    description: MaxDynamicSteps caps the total number of dynamically-added
                      steps.
                    minimum: 1
                    type: integer
                  maxLoopIterations:
                    default: 3
                    description: MaxLoopIterations caps loop retries per step. Defaults
                      to 3.
                    type: integer
                  requireApprovalForUnlisted:
                    description: |-
                      RequireApprovalForUnlisted pauses the workflow and requests human approval
                      when an agent proposes a step using an agent not in AllowedAgentRefs.
                      If false, such proposals are auto-rejected.
                    type: boolean
                required:
                - maxDynamicSteps
                type: object
              budgetCap:
                description: BudgetCap limits total USD spend across all steps combined.
                properties:
                  total:
                    description: |-
                      Total is the maximum USD spend across all AgentRuns in the workflow.
                      When exceeded, the currently-running step is failed and the workflow is Failed.
                    type: string
                required:
                - total
                type: object
              description:
                description: Description is an optional human-readable summary of
                  the workflow's purpose.
                type: string
              fromTemplate:
                description: |-
                  FromTemplate creates this workflow from a template in the same namespace:
                  on its first reconcile the controller fills in the steps (and any of
                  description, timeout, budgetCap, onStepFailure and adaptivePolicy not set here)
                  from the template, with the parameters substituted into the step inputs.
                properties:
                  name:
                    description: Name of the AgentWorkflow template, in the same namespace.
                    minLength: 1
                    type: string
                  parameters:
                    additionalProperties:
                      type: string
                    description: |-
                      Parameters sets the template's parameters by name. Values are strings;
                      integer and boolean parameters take "42" and "true".
                    type: object
                required:
                - name
                type: object
              mode:
                default: workflow
                description: |-
                  Mode is "workflow" (default): the workflow runs. In "template" mode the
                  workflow is a definition that is validated but never run; workflows are
                  created from it with spec.fromTemplate.
                enum:
                - workflow
                - template
                type: string
              onStepFailure:
                description: |-
                  OnStepFailure controls what happens when a step fails.
                  "stop" (default): mark the workflow Failed and do not start new steps.
                  "continue": mark the failed step Skipped and continue with dependents.
                enum:
                - stop
                - continue
                type: string
              parameters:
                description: |-
                  Parameters declares the typed inputs of a template. Steps refer to them as
                  {{params.<name>}} in their input. Only for mode: template.
                items:
                  description: WorkflowParameter is a typed input of a workflow template.
                  properties:
                    default:
                      description: Default is used when the instance does not set
                        the parameter.
                      type: string
                    description:
                      description: Description tells a person or a connector what
                        the parameter is for.
                      type: string
                    enum:
                      description: Enum restricts the value to one of these.
                      items:
                        type: string
                      type: array
                    maxLength:
                      description: MaxLength caps the value's length in bytes. Defaults
                        to 8192.
                      minimum: 1
                      type: integer
                    name:
                      description: 'Name is how steps refer to the parameter: {{params.<name>}}.'
                      pattern: ^[a-zA-Z][a-zA-Z0-9_]*$
                      type: string
                    pattern:
                      description: Pattern is a regular expression a string value
                        must match in full.
                      type: string
                    required:
                      description: Required makes the parameter mandatory unless it
                        has a default.
                      type: boolean
                    type:
                      default: string
                      description: Type is string (default), integer or boolean.
                      enum:
                      - string
                      - integer
                      - boolean
                      type: string
                  required:
                  - name
                  type: object
                maxItems: 50
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              steps:
                description: |-
                  Steps defines the DAG of agent executions. Each step names its dependencies via
                  DependsOn; steps with no dependencies run immediately when the workflow starts.
                  Required unless fromTemplate is set.
                items:
                  description: WorkflowStep defines a single node in the workflow
                    DAG.
                  properties:
                    agentRef:
                      description: AgentRef is the name of the Agent CRD to run for
                        this step.
                      type: string
                    callbacks:
                      description: Callbacks fires webhooks when this step completes
                        or fails.
                      properties:
                        onComplete:
                          description: OnComplete is a URL that receives a POST when
                            the run succeeds.
                          type: string
                        onFailed:
                          description: OnFailed is a URL that receives a POST when
                            the run fails.
                          type: string
                      type: object
                    condition:
                      description: |-
                        Condition is a CEL expression evaluated before this step starts.
                        The expression has access to a "steps" variable: map of step name →
                        {phase: string, output: string}. If the expression evaluates to false
                        the step is marked Skipped rather than started.
                        Example: 'steps["gather"].phase == "Succeeded"'
                      type: string
                    dependsOn:
                      description: |-
                        DependsOn lists step names that must reach a terminal phase (Succeeded or Skipped)
                        before this step is eligible to start.
                      items:
                        type: string
                      type: array
                    input:
                      description: |-
                        Input is the task string passed to the agent as AGENTORC_INPUT.
                        Supports template variables:
                          {{steps.<name>.output}}  — the Output of a named predecessor step
                      type: string
                    name:
                      description: |-
                        Name is a unique identifier for this step within the workflow.
                        Used in DependsOn references and template variables.
                      pattern: ^[a-z0-9][a-z0-9\-]*$
                      type: string
                    timeout:
                      description: Timeout overrides the workflow-level timeout for
                        this specific step.
                      type: string
                  required:
                  - agentRef
                  - input
                  - name
                  type: object
                type: array
              timeout:
                description: |-
                  Timeout is the wall-clock limit for the entire workflow.
                  Steps still running when this expires are failed.
                type: string
            type: object
            x-kubernetes-validations:
            - message: spec.steps is required unless spec.fromTemplate is set
              rule: has(self.fromTemplate) || (has(self.steps) && size(self.steps)
                > 0)
            - message: a template cannot be created from another template
              rule: '!has(self.fromTemplate) || !has(self.mode) || self.mode != ''template'''
            - message: 'spec.parameters is only for mode: template'
              rule: '!has(self.parameters) || (has(self.mode) && self.mode == ''template'')'
          status:
            description: AgentWorkflowStatus holds observed state for an AgentWorkflow.
