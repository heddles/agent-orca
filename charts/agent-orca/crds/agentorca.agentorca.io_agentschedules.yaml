---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: agentschedules.agentorca.agentorca.io
spec:
  group: agentorca.agentorca.io
  names:
    kind: AgentSchedule
    listKind: AgentScheduleList
    plural: agentschedules
    shortNames:
    - asched
    singular: agentschedule
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.schedule
      name: Schedule
      type: string
    - jsonPath: .spec.timeZone
      name: Zone
      type: string
    - jsonPath: .spec.suspend
      name: Suspend
      type: boolean
    - jsonPath: .status.lastScheduleTime
      name: Last
      type: date
    - jsonPath: .status.nextScheduleTime
      name: Next
      type: date
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          AgentSchedule starts an agent (or a workflow made from a template) on a clock,
          like a CronJob starts a Job. Each tick creates an ordinary AgentRun (or
          AgentWorkflow) attributed to the schedule, not to a person.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: AgentScheduleSpec defines when and what an AgentSchedule
              runs.
            properties:
              agentRef:
                description: |-
                  AgentRef is the Agent to run, in the schedule's namespace. Set exactly one
                  of agentRef and workflowTemplateRef.
                type: string
              budget:
                description: |-
                  Budget caps each run's model spend. Copied onto every created AgentRun.
                  An unattended run has nobody to approve a raise, so onExceeded defaults to
                  fail and pause is refused.
                properties:
                  approverGroups:
                    description: |-
                      ApproverGroups are the identity-provider groups whose members may decide a
                      raise. Empty lets any user with access to the run's namespace decide.
                    items:
                      type: string
                    type: array
                  maxUSD:
                    description: 'MaxUSD is the spend, in USD, at which the run fails
                      or pauses. Example: "2.50".'
                    pattern: ^[0-9]+(\.[0-9]+)?$
                    type: string
                  onExceeded:
                    default: fail
                    description: |-
                      OnExceeded is what happens at the cap: "fail" (default) halts the run;
                      "pause" holds it until an approver raises the cap or the pause times out.
                      Pausing needs PostgreSQL (approvals are stored there); without it a run that
                      reaches its cap fails.
                    enum:
                    - fail
                    - pause
                    type: string
                  pauseTimeout:
                    description: |-
                      PauseTimeout is how long a paused run waits for a decision before it fails.
                      Default 24h.
                    type: string
                  raiseByUSD:
                    description: RaiseByUSD is how much one approval adds to the cap.
                      Defaults to MaxUSD.
                    pattern: ^[0-9]+(\.[0-9]+)?$
                    type: string
                  warnAtPercent:
                    default: 80
                    description: |-
                      WarnAtPercent is the share of the cap at which a warning is emitted (a
                      trace event and a Kubernetes event). Default 80.
                    maximum: 99
                    minimum: 1
                    type: integer
                required:
                - maxUSD
                type: object
              concurrencyPolicy:
                default: Forbid
                description: ConcurrencyPolicy is Allow, Forbid (default) or Replace.
                enum:
                - Allow
                - Forbid
                - Replace
                type: string
              failedRunsHistoryLimit:
                description: |-
                  FailedRunsHistoryLimit is how many failed runs (or workflows) are kept.
                  Default 7.
                format: int32
                minimum: 0
                type: integer
              input:
                description: |-
                  Input is the run's input. Only {{schedule.time}}, {{schedule.date}} and
                  {{schedule.name}} are substituted; nothing else in it is interpreted.
                maxLength: 65536
                type: string
              parameters:
                additionalProperties:
                  type: string
                description: |-
                  Parameters are the workflow template's parameters. The same three
                  placeholders are substituted in the values.
                type: object
              result:
                description: |-
                  Result says where each run's result goes besides the run itself, which is
                  always visible in the UI.
                properties:
                  callbacks:
                    description: Callbacks are URLs that receive a POST when a run
                      succeeds or fails.
                    properties:
                      onComplete:
                        description: OnComplete is a URL that receives a POST when
                          the run succeeds.
                        type: string
                      onFailed:
                        description: OnFailed is a URL that receives a POST when the
                          run fails.
                        type: string
                    type: object
                  egress:
                    description: Egress publishes each run's result to a Kafka, Pub/Sub
                      or Redis sink.
                    properties:
                      address:
                        description: |-
                          Address is the Redis connection address (redis only).
                          Example: "redis-master:6379"
                        type: string
                      brokers:
                        description: |-
                          Brokers is the list of broker addresses (kafka only).
                          Example: ["kafka:9092"]
                        items:
                          type: string
                        type: array
                      key:
                        description: |-
                          Key is the partition key for the published message (kafka only).
                          If empty, the run ID is used as the key.
                        type: string
                      projectID:
                        description: ProjectID is the GCP project ID (pubsub only).
                        type: string
                      secretRef:
                        description: |-
                          SecretRef references a Secret containing connection credentials.
                          The Secret must be in the same namespace as the AgentRun.
                          For Kafka: key "sasl-username" and "sasl-password" (or "tls-cert"/"tls-key").
                          For Pub/Sub: key "credentials" containing a service-account JSON blob.
                          For Redis: key "password".
                        properties:
                          key:
                            description: Key within the Secret.
                            type: string
                          name:
                            description: Name of the Secret.
                            type: string
                          namespace:
                            description: Namespace of the Secret. Defaults to the
                              same namespace as the referencing resource.
                            type: string
                        required:
                        - key
                        - name
                        type: object
                      topic:
                        description: |-
                          Topic is the destination topic/queue/stream name.
                          For Kafka: the topic name. For Pub/Sub: the topic name. For Redis: the stream name.
                        minLength: 1
                        type: string
                      type:
                        allOf:
                        - enum:
                          - kafka
                          - pubsub
                          - redis
                        - enum:
                          - kafka
                          - pubsub
                          - redis
                        description: 'Type is the sink type: kafka, pubsub, or redis.'
                        type: string
                    required:
                    - topic
                    - type
                    type: object
                type: object
              safeguards:
                description: Safeguards are copied onto every created AgentRun.
                properties:
                  maxConsecutiveNoopTurns:
                    description: |-
                      MaxConsecutiveNoopTurns halts the run if the LLM produces this many consecutive
                      turns with no tool calls and fewer than MinSubstantiveTokens output tokens.
                      Not applied to chat (http input) runs. Unset uses the default of 15; a
                      negative value disables the check.
                    type: integer
                  maxRepeatedToolCalls:
                    description: |-
                      MaxRepeatedToolCalls halts the run if the same tool is called with identical
                      arguments this many times within the run. Unset uses the default of 50; a
                      negative value disables the check.
                    type: integer
                  minSubstantiveTokens:
                    default: 20
                    description: |-
                      MinSubstantiveTokens is the minimum number of output tokens required for a turn
                      to count as substantive. Only evaluated when MaxConsecutiveNoopTurns > 0.
                    type: integer
                  toolExecutionTimeoutSec:
                    default: 60
                    description: |-
                      ToolExecutionTimeoutSec is the maximum number of seconds a single tool call may
                      take before it is cancelled and a structured error is returned to the LLM.
                      This prevents a hanging tool (e.g. blocking I/O, deadlock) from stalling the
                      entire run. Defaults to 60. 0 means use the default.
                    type: integer
                  toolFrequencyCap:
                    description: |-
                      ToolFrequencyCap halts the run if any single tool is called more than this many
                      times in total across the run. Unset (the default) or a negative value
                      disables the check.
                    type: integer
                type: object
              schedule:
                description: |-
                  Schedule is a five-field cron expression (minute hour day-of-month month
                  day-of-week) or one of @hourly, @daily, @weekly, @monthly. It is read in
                  timeZone.
                maxLength: 128
                minLength: 1
                type: string
              spend:
                description: Spend caps the schedule as a whole over a day and a month.
                properties:
                  maxUSDPerDay:
                    description: MaxUSDPerDay caps the spend of the runs a schedule
                      starts in a UTC day.
                    pattern: ^[0-9]+(\.[0-9]+)?$
                    type: string
                  maxUSDPerMonth:
                    description: MaxUSDPerMonth caps the spend of the runs a schedule
                      starts in a UTC month.
                    pattern: ^[0-9]+(\.[0-9]+)?$
                    type: string
                  onExceeded:
                    default: Skip
                    description: |-
                      OnExceeded is what happens at a cap. Only Skip exists: ticks are skipped
                      until the window rolls over. It never rewrites spec.suspend.
                    enum:
                    - Skip
                    type: string
                type: object
              startingDeadlineSeconds:
                description: |-
                  StartingDeadlineSeconds is how late a missed tick may still start.
                  Default 3600.
                format: int64
                minimum: 0
                type: integer
              successfulRunsHistoryLimit:
                description: |-
                  SuccessfulRunsHistoryLimit is how many finished successful runs (or
                  workflows) are kept. Default 7.
                format: int32
                minimum: 0
                type: integer
              suspend:
                description: Suspend stops new runs. Runs in flight are untouched.
                type: boolean
              timeZone:
                default: UTC
                description: |-
                  TimeZone is an IANA time zone name such as Europe/Berlin. Default UTC. A
                  wall-clock time that does not exist (a daylight-saving gap) is skipped; one
                  that occurs twice (an overlap) fires once, at its first occurrence.
                maxLength: 64
                type: string
              timeout:
                description: Timeout is copied onto every created AgentRun.
                type: string
              workflowTemplateRef:
                description: |-
                  WorkflowTemplateRef is an AgentWorkflow with spec.mode: template, in the
                  schedule's namespace. Each tick creates a workflow from it.
                type: string
            required:
            - schedule
            type: object
            x-kubernetes-validations:
            - message: set exactly one of agentRef and workflowTemplateRef
              rule: has(self.agentRef) != has(self.workflowTemplateRef)
            - message: 'a workflowTemplateRef schedule takes parameters, not input,
                timeout, budget, safeguards or result: those belong to the template'
              rule: '!has(self.workflowTemplateRef) || (!has(self.input) && !has(self.timeout)
                && !has(self.budget) && !has(self.safeguards) && !has(self.result))'
            - message: parameters apply to workflowTemplateRef only
              rule: '!has(self.agentRef) || !has(self.parameters)'
            - message: an agentRef schedule needs an input
              rule: '!has(self.agentRef) || (has(self.input) && size(self.input) >
                0)'
          status:
            description: AgentScheduleStatus is the observed state of an AgentSchedule.
            properties:
              active:
                description: Active lists the runs (or workflows) still going.
                items:
                  description: ObjectReference contains enough information to let
                    you inspect or modify the referred object.
                  properties:
                    apiVersion:
                      description: API version of the referent.
                      type: string
                    fieldPath:
                      description: |-
                        If referring to a piece of an object instead of an entire object, this string
                        should contain a valid JSON/Go field access statement, such as desiredState.manifest.containers[2].
                        For example, if the object reference is to a container within a pod, this would take on a value like:
                        "spec.containers{name}" (where "name" refers to the name of the container that triggered
                        the event) or if no container name is specified "spec.containers[2]" (container with
                        index 2 in this pod). This syntax is chosen only to have some well-defined way of
                        referencing a part of an object.
                      type: string
                    kind:
                      description: |-
                        Kind of the referent.
                        More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
                      type: string
                    name:
                      description: |-
                        Name of the referent.
                        More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                      type: string
                    namespace:
                      description: |-
                        Namespace of the referent.
                        More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/namespaces/
                      type: string
                    resourceVersion:
                      description: |-
                        Specific resourceVersion to which this reference is made, if any.
                        More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#concurrency-control-and-consistency
                      type: string
                    uid:
                      description: |-
                        UID of the referent.
                        More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#uids
                      type: string
                  type: object
                  x-kubernetes-map-type: atomic
                type: array
              conditions:
                description: 'Conditions: Ready, Suspended, BudgetExhausted, TargetMissing,
                  Degraded.'
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              consecutiveFailures:
                description: |-
                  ConsecutiveFailures counts finished runs that failed since the last
                  success. At the operator's limit the schedule becomes Degraded.
                format: int32
                type: integer
              cursorTime:
                description: |-
                  CursorTime is where tick evaluation starts: ticks before it are never
                  started. It moves to the current time whenever the spec changes (and when
                  ticks were missed), so nothing fires retroactively.
                format: date-time
                type: string
              lastScheduleTime:
                description: |-
                  LastScheduleTime is the scheduled instant of the last tick handled,
                  whether it started a run or was skipped.
                format: date-time
                type: string
              lastSuccessfulTime:
                description: LastSuccessfulTime is when the last successful run finished.
                format: date-time
                type: string
              ledger:
                description: Ledger is the spend of finished runs, kept across history
                  pruning.
                properties:
                  day:
                    description: Day is the UTC day (YYYY-MM-DD) DayUSD belongs to.
                    type: string
                  dayUSD:
                    description: DayUSD is the finished runs' spend in Day.
                    type: string
                  month:
                    description: Month is the UTC month (YYYY-MM) MonthUSD belongs
                      to.
                    type: string
                  monthUSD:
                    description: MonthUSD is the finished runs' spend in Month.
                    type: string
                type: object
              nextScheduleTime:
                description: NextScheduleTime is the next tick, in absolute time.
                format: date-time
                type: string
              observedGeneration:
                description: |-
                  ObservedGeneration is the spec generation the status describes. A change
                  of spec resets the cursor to now: nothing fires retroactively.
                format: int64
                type: integer
              recentSkips:
                description: RecentSkips is the last ten ticks that started nothing.
                items:
                  description: ScheduleSkip records a tick that did not start a run.
                  properties:
                    message:
                      description: Message says why, in plain words.
                      type: string
                    reason:
                      description: |-
                        Reason is one of MissedSchedule, SkippedConcurrency, SkippedQuota,
                        SkippedBudget, SkippedTargetMissing, SkippedInvalid.
                      type: string
                    time:
                      description: Time is the scheduled instant that was skipped.
                      format: date-time
                      type: string
                  required:
                  - reason
                  - time
                  type: object
                type: array
              spentMonthUSD:
                description: SpentMonthUSD is what the schedule's runs spent this
                  month (UTC).
                type: string
              spentTodayUSD:
                description: SpentTodayUSD is what the schedule's runs spent today
                  (UTC).
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
