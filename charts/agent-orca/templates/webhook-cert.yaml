{{- if .Values.webhook.certManager }}
---
# Self-signed issuer scoped to this namespace — issues the webhook serving cert.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ include "agent-orca.fullname" . }}-selfsigned
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agent-orca.labels" . | nindent 4 }}
spec:
  selfSigned: {}
---
# Certificate for the webhook server. cert-manager writes the TLS key+cert into
# the Secret named below; the Deployment mounts it at the path the controller-
# runtime webhook server expects.
#
# The ValidatingWebhookConfiguration carries the annotation
#   cert-manager.io/inject-ca-from: <namespace>/<name>
# which tells cert-manager to also patch the webhook's caBundle field so the
# API server trusts the self-signed cert.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "agent-orca.fullname" . }}-webhook-cert
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agent-orca.labels" . | nindent 4 }}
spec:
  secretName: {{ .Values.webhook.tlsSecretName | default (printf "%s-webhook-tls" (include "agent-orca.fullname" .)) }}
  dnsNames:
    - {{ include "agent-orca.fullname" . }}-webhook.{{ .Release.Namespace }}.svc
    - {{ include "agent-orca.fullname" . }}-webhook.{{ .Release.Namespace }}.svc.cluster.local
  issuerRef:
    name: {{ include "agent-orca.fullname" . }}-selfsigned
    kind: Issuer
{{- end }}
