{{- if and .Values.hindsight.enabled (not (and .Values.hindsight.existingSecret .Values.hindsight.fullnameOverride)) }}
{{- fail "hindsight.existingSecret and hindsight.fullnameOverride are empty. This happens when upgrading an existing release with --reuse-values, which skips the chart's new defaults. Use --reset-then-reuse-values, or set hindsight.enabled=false and hindsight.url to keep an external Hindsight." }}
{{- end }}
{{- if and .Values.hindsight.enabled (dig "auth" "manageSecret" true (.Values.hindsight | default dict)) }}
{{- /*
Generated once, then preserved: every key already in the live Secret is copied
back so a rotated key or a provider key added out of band survives helm upgrade.
*/}}
{{- $name := .Values.hindsight.existingSecret }}
{{- $existing := dict }}
{{- with (lookup "v1" "Secret" .Release.Namespace $name) }}
{{- $existing = .data | default dict }}
{{- end }}
{{- $tenant := index $existing "HINDSIGHT_API_TENANT_API_KEY" | default (randAlphaNum 48 | b64enc) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "agent-orca.labels" . | nindent 4 }}
    app.kubernetes.io/component: hindsight
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
{{- $managed := list "HINDSIGHT_API_TENANT_API_KEY" "HINDSIGHT_CP_DATAPLANE_API_KEY" "HINDSIGHT_CP_ACCESS_KEY" }}
{{- range $k, $v := $existing }}
{{- if not (has $k $managed) }}
  {{ $k }}: {{ $v | quote }}
{{- end }}
{{- end }}
  HINDSIGHT_API_TENANT_API_KEY: {{ $tenant | quote }}
  HINDSIGHT_CP_DATAPLANE_API_KEY: {{ index $existing "HINDSIGHT_CP_DATAPLANE_API_KEY" | default $tenant | quote }}
  HINDSIGHT_CP_ACCESS_KEY: {{ index $existing "HINDSIGHT_CP_ACCESS_KEY" | default (randAlphaNum 32 | b64enc) | quote }}
{{- end }}
