apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agent-orca.fullname" . }}-operator
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agent-orca.labels" . | nindent 4 }}
    app.kubernetes.io/component: operator
spec:
  replicas: {{ .Values.operator.replicas }}
  selector:
    matchLabels:
      {{- include "agent-orca.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: operator
  template:
    metadata:
      labels:
        {{- include "agent-orca.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: operator
      {{- with .Values.metrics.enabled }}
      annotations:
        # Legacy K8s-native scrape annotations for Prometheus (pod discovery)
        # and Datadog auto-discovery, in addition to the ServiceMonitor above.
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
      {{- end }}
    spec:
      serviceAccountName: {{ include "agent-orca.fullname" . }}-operator
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: operator
          image: "{{ .Values.global.imageRegistry }}{{ .Values.operator.image.repository }}:{{ .Values.operator.image.tag }}"
          imagePullPolicy: {{ .Values.operator.image.pullPolicy }}
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: MODEL_ROUTER_IMAGE
              value: "{{ .Values.global.imageRegistry }}{{ .Values.modelRouter.image.repository }}:{{ .Values.modelRouter.image.tag }}"
            - name: MCP_INGESTER_IMAGE
              value: "{{ .Values.global.imageRegistry }}{{ .Values.mcpIngester.image.repository }}:{{ .Values.mcpIngester.image.tag }}"
            {{- if .Values.qdrant.image.tag }}
            - name: QDRANT_IMAGE
              value: "{{ .Values.global.imageRegistry }}{{ .Values.qdrant.image.repository }}:{{ .Values.qdrant.image.tag }}"
            {{- end }}
            - name: TOKEN_REVIEWER_CLUSTER_ROLE
              value: {{ include "agent-orca.fullname" . }}-token-reviewer
            - name: OPERATOR_API_URL
              value: "http://{{ include "agent-orca.fullname" . }}-internal-api.{{ .Release.Namespace }}.svc.cluster.local:8082"
            - name: LLM_REQUEST_TIMEOUT
              value: {{ .Values.modelRouter.llmRequestTimeout | default "1h" | quote }}
            - name: CONTEXT_COMPACTION_RATIO
              value: {{ .Values.modelRouter.contextCompactionRatio | default 0.5 | quote }}
            {{- if .Values.operator.allowedRegistries }}
            - name: ALLOWED_REGISTRIES
              value: {{ .Values.operator.allowedRegistries | quote }}
            {{- end }}
            {{- if .Values.cloudProvider }}
            - name: CLOUD_PROVIDER_OVERRIDE
              value: {{ .Values.cloudProvider | quote }}
            {{- end }}
            {{- if .Values.redis.enabled }}
            - name: STATE_BACKEND
              value: "redis"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.redis.auth.existingSecret | default (printf "%s-redis" (include "agent-orca.fullname" .)) }}
                  key: {{ .Values.redis.auth.existingSecretPasswordKey | default "redis-password" }}
            - name: REDIS_URL
              value: "redis://:$(REDIS_PASSWORD)@{{ include "agent-orca.fullname" . }}-redis-master.{{ .Release.Namespace }}.svc.cluster.local:6379"
            {{- else }}
            {{- if .Values.agentState.backend }}
            - name: STATE_BACKEND
              value: {{ .Values.agentState.backend | quote }}
            {{- end }}
            {{- if .Values.agentState.redis.url }}
            - name: REDIS_URL
              value: {{ .Values.agentState.redis.url | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.database.enabled }}
            # POSTGRES_PASSWORD must be declared BEFORE POSTGRES_DSN — Kubernetes
            # only expands $(VAR) references for variables declared earlier in the
            # same container's env list.
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.passwordSecret.name | quote }}
                  key: {{ .Values.database.passwordSecret.key | quote }}
            - name: POSTGRES_DSN
              value: {{ .Values.database.dsn | quote }}
            {{- end }}
            {{- if .Values.systemStatus }}
            {{- if .Values.systemStatus.alertWebhookURL }}
            - name: ALERT_WEBHOOK_URL
              value: {{ .Values.systemStatus.alertWebhookURL | quote }}
            - name: ALERT_HMAC_SECRET
              value: {{ .Values.systemStatus.alertHmacSecret | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.operator.oidc.enabled }}
            - name: OIDC_LOGIN_ENABLED
              value: "true"
            - name: OIDC_COOKIE_SECURE
              value: {{ .Values.operator.oidc.cookieSecure | quote }}
            {{- end }}
          args:
            - --leader-elect={{ .Values.operator.leaderElection }}
            - --health-probe-bind-address=:8081
            - --metrics-secure=false
            - --metrics-bind-address=:8080
            - --ui-auth-enabled=true
            {{- range .Values.operator.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          ports:
            - name: metrics
              containerPort: 8080
              protocol: TCP
            - name: health
              containerPort: 8081
              protocol: TCP
            - name: internal-api
              containerPort: 8082
              protocol: TCP
            - name: ui-api
              containerPort: 8083
              protocol: TCP
            {{- if .Values.externalAPI.enabled }}
            - name: external-api
              containerPort: {{ .Values.externalAPI.port | default 8084 }}
              protocol: TCP
            {{- end }}
            - name: acp-api
              containerPort: 8000
              protocol: TCP
            - name: webhook
              containerPort: 9443
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 45
            periodSeconds: 15
          resources:
            {{- toYaml .Values.operator.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: webhook-tls
              mountPath: /tmp/k8s-webhook-server/serving-certs
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
        - name: webhook-tls
          secret:
            secretName: {{ .Values.webhook.tlsSecretName | default (printf "%s-webhook-tls" (include "agent-orca.fullname" .)) }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
