apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agent-orca.fullname" . }}-operator
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agent-orca.labels" . | nindent 4 }}
    app.kubernetes.io/component: operator
spec:
  replicas: {{ .Values.operator.replicas }}
  selector:
    matchLabels:
      {{- include "agent-orca.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: operator
  template:
    metadata:
      labels:
        {{- include "agent-orca.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: operator
        # Platform peer: tenant NetworkPolicies select it by this label.
        agentorca.io/scope: platform
      {{- with .Values.metrics.enabled }}
      annotations:
        # Legacy K8s-native scrape annotations for Prometheus (pod discovery)
        # and Datadog auto-discovery, in addition to the ServiceMonitor above.
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
      {{- end }}
    spec:
      serviceAccountName: {{ include "agent-orca.fullname" . }}-operator
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: operator
          image: "{{ .Values.global.imageRegistry }}{{ .Values.operator.image.repository }}:{{ .Values.operator.image.tag }}"
          imagePullPolicy: {{ .Values.operator.image.pullPolicy }}
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: MODEL_ROUTER_IMAGE
              value: "{{ .Values.global.imageRegistry }}{{ .Values.modelRouter.image.repository }}:{{ .Values.modelRouter.image.tag }}"
            - name: MCP_INGESTER_IMAGE
              value: "{{ .Values.global.imageRegistry }}{{ .Values.mcpIngester.image.repository }}:{{ .Values.mcpIngester.image.tag }}"
            {{- if .Values.qdrant.image.tag }}
            - name: QDRANT_IMAGE
              value: "{{ .Values.global.imageRegistry }}{{ .Values.qdrant.image.repository }}:{{ .Values.qdrant.image.tag }}"
            {{- end }}
            - name: TOKEN_REVIEWER_CLUSTER_ROLE
              value: {{ include "agent-orca.fullname" . }}-token-reviewer
            - name: OPERATOR_API_URL
              value: "http://{{ include "agent-orca.fullname" . }}-internal-api.{{ .Release.Namespace }}.svc.cluster.local:8082"
            - name: LLM_REQUEST_TIMEOUT
              value: {{ .Values.modelRouter.llmRequestTimeout | default "1h" | quote }}
            - name: CONTEXT_COMPACTION_THRESHOLD
              value: {{ .Values.modelRouter.contextCompactionThreshold | default 0.8 | quote }}
            - name: CONTEXT_COMPACTION_MODE
              value: {{ .Values.modelRouter.contextCompactionMode | default "summary" | quote }}
            - name: CONTEXT_COMPACTION_RATIO
              value: {{ .Values.modelRouter.contextCompactionRatio | default 0.5 | quote }}
            {{- if .Values.operator.allowedRegistries }}
            - name: ALLOWED_REGISTRIES
              value: {{ .Values.operator.allowedRegistries | quote }}
            {{- end }}
            {{- if .Values.operator.tenantAdminGroup }}
            - name: TENANT_ADMIN_GROUP
              value: {{ .Values.operator.tenantAdminGroup | quote }}
            {{- end }}
            - name: POD_SERVICE_ACCOUNT
              valueFrom:
                fieldRef:
                  fieldPath: spec.serviceAccountName
            - name: OWNERSHIP_GITOPS_SERVICE_ACCOUNTS
              value: {{ join "," (dig "gitopsWriters" "serviceAccounts" (list) (.Values.ownership | default dict)) | quote }}
            - name: OWNERSHIP_GITOPS_FIELD_MANAGERS
              value: {{ join "," (dig "gitopsWriters" "fieldManagers" (list) (.Values.ownership | default dict)) | quote }}
            - name: OWNERSHIP_ARGO_LABEL_TRACKING
              value: {{ dig "argoLabelTracking" false (.Values.ownership | default dict) | toString | quote }}
            - name: OWNERSHIP_ARGO_TRACKING_LABEL
              value: {{ dig "argoTrackingLabel" "" (.Values.ownership | default dict) | quote }}
            - name: OWNERSHIP_HANDOFF_TTL
              value: {{ dig "handoffTTL" "" (.Values.ownership | default dict) | quote }}
            - name: REVISIONS_KEEP
              value: {{ dig "keep" 50 (.Values.revisions | default dict) | toString | quote }}
            - name: TENANT_ISOLATION_MODE
              value: {{ .Values.operator.tenantIsolationMode | default "audit" | quote }}
            - name: PLATFORM_NAMESPACES
              value: {{ join "," (.Values.operator.platformNamespaces | default (list .Release.Namespace)) | quote }}
            - name: ALLOW_LEGACY_TENANT_TOKENS
              value: {{ .Values.operator.allowLegacyTenantTokens | toString | quote }}
            - name: MACHINE_DEFAULT_ROLE
              value: {{ .Values.operator.machineDefaultRole | default "runner" | quote }}
            - name: AGENTORCA_STATE_TENANT_PREFIX
              value: {{ .Values.operator.stateTenantPrefix | toString | quote }}
            - name: EVALS_MAX_CASES_PER_DATASET
              value: {{ dig "maxCasesPerDataset" 2000 (.Values.operator.evals | default dict) | toString | quote }}
            - name: EVALS_MAX_CASE_BYTES
              value: {{ dig "maxCaseBytes" 65536 (.Values.operator.evals | default dict) | toString | quote }}
            - name: EVALS_ALLOW_UNREDACTED_CASES
              value: {{ dig "allowUnredactedCases" true (.Values.operator.evals | default dict) | toString | quote }}
            - name: EVALS_ENABLED
              value: {{ dig "enabled" true (.Values.operator.evals | default dict) | toString | quote }}
            - name: EVALS_MAX_BUDGET_PER_EXPERIMENT_USD
              value: {{ dig "maxBudgetPerExperimentUSD" 25 (.Values.operator.evals | default dict) | toString | quote }}
            - name: EVALS_MAX_CASES_PER_EXPERIMENT
              value: {{ dig "maxCasesPerExperiment" 500 (.Values.operator.evals | default dict) | toString | quote }}
            - name: EVALS_MAX_ACTIVE_EXPERIMENTS_PER_TENANT
              value: {{ dig "maxActiveExperimentsPerTenant" 2 (.Values.operator.evals | default dict) | toString | quote }}
            - name: EVALS_RUNNER_INTERVAL_SECONDS
              value: {{ dig "runnerIntervalSeconds" 5 (.Values.operator.evals | default dict) | toString | quote }}
            - name: EVALS_REQUIRE_INDEPENDENT_REVIEW
              value: {{ dig "requireIndependentReview" false (.Values.operator.evals | default dict) | toString | quote }}
            - name: EVALS_RESULT_RETENTION_DAYS
              value: {{ dig "resultRetentionDays" 90 (.Values.operator.evals | default dict) | toString | quote }}
            - name: EVALS_ALLOW_GATE_OVERRIDE
              value: {{ dig "allowGateOverride" true (.Values.operator.evals | default dict) | toString | quote }}
            - name: BUILDER_CHECK_DEFAULT_BUDGET_USD
              value: {{ dig "checkDefaultBudgetUSD" 0.25 (.Values.operator.builder | default dict) | toString | quote }}
            - name: BUILDER_CHECK_MAX_BUDGET_USD
              value: {{ dig "checkMaxBudgetUSD" 2 (.Values.operator.builder | default dict) | toString | quote }}
            - name: BUILDER_CHECK_MAX_CASES
              value: {{ dig "checkMaxCases" 25 (.Values.operator.builder | default dict) | toString | quote }}
            - name: BUILDER_CHECK_MAX_CONCURRENCY
              value: {{ dig "checkMaxConcurrency" 2 (.Values.operator.builder | default dict) | toString | quote }}
            - name: BUILDER_CHECK_PER_USER_PER_HOUR
              value: {{ dig "checkPerUserPerHour" 12 (.Values.operator.builder | default dict) | toString | quote }}
            - name: BUILDER_DRAFT_PROVIDER
              value: {{ dig "draftProvider" "" (.Values.operator.builder | default dict) | toString | quote }}
            - name: BUILDER_DRAFT_PER_USER_PER_HOUR
              value: {{ dig "draftPerUserPerHour" 10 (.Values.operator.builder | default dict) | toString | quote }}
            - name: BUILDER_DRAFT_MAX_COST_USD
              value: {{ dig "draftMaxCostUSD" 0.05 (.Values.operator.builder | default dict) | toString | quote }}
            - name: BUILDER_DRAFT_DAILY_USD_PER_USER
              value: {{ dig "draftDailyUSDPerUser" 1 (.Values.operator.builder | default dict) | toString | quote }}
            {{- if .Values.cloudProvider }}
            - name: CLOUD_PROVIDER_OVERRIDE
              value: {{ .Values.cloudProvider | quote }}
            {{- end }}
            {{- if .Values.redis.enabled }}
            - name: STATE_BACKEND
              value: "redis"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.redis.auth.existingSecret | default (printf "%s-redis" (include "agent-orca.fullname" .)) }}
                  key: {{ .Values.redis.auth.existingSecretPasswordKey | default "redis-password" }}
            - name: REDIS_URL
              value: "redis://:$(REDIS_PASSWORD)@{{ include "agent-orca.fullname" . }}-redis-master.{{ .Release.Namespace }}.svc.cluster.local:6379"
            {{- else }}
            {{- if .Values.agentState.backend }}
            - name: STATE_BACKEND
              value: {{ .Values.agentState.backend | quote }}
            {{- end }}
            {{- if .Values.agentState.redis.url }}
            - name: REDIS_URL
              value: {{ .Values.agentState.redis.url | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.database.enabled }}
            # POSTGRES_PASSWORD must be declared BEFORE POSTGRES_DSN — Kubernetes
            # only expands $(VAR) references for variables declared earlier in the
            # same container's env list.
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.passwordSecret.name | quote }}
                  key: {{ .Values.database.passwordSecret.key | quote }}
            - name: POSTGRES_DSN
              value: {{ .Values.database.dsn | quote }}
            - name: ARCHIVED_RUNS_RETENTION_DAYS
              value: {{ .Values.database.archivedRunsRetentionDays | default 0 | toString | quote }}
            {{- end }}
            {{- if .Values.systemStatus }}
            {{- if .Values.systemStatus.alertWebhookURL }}
            - name: ALERT_WEBHOOK_URL
              value: {{ .Values.systemStatus.alertWebhookURL | quote }}
            - name: ALERT_HMAC_SECRET
              value: {{ .Values.systemStatus.alertHmacSecret | quote }}
            {{- end }}
            {{- end }}
            {{- if and .Values.database.enabled .Values.database.connectionKeySecret }}
            - name: CONNECTION_KEY_DIR
              value: /etc/agentorca/connection-keys
            - name: CONNECTION_REDIRECT_URI
              value: {{ .Values.operator.connections.redirectURI | quote }}
            - name: CONNECTION_IDLE_EXPIRY_DAYS
              value: {{ .Values.operator.connections.idleExpiryDays | default 0 | quote }}
            {{- if .Values.operator.connections.allowInsecureOAuth }}
            - name: CONNECTION_ALLOW_INSECURE_OAUTH
              value: "true"
            {{- end }}
            {{- end }}
            {{- if .Values.operator.oidc.enabled }}
            - name: OIDC_LOGIN_ENABLED
              value: "true"
            - name: OIDC_COOKIE_SECURE
              value: {{ .Values.operator.oidc.cookieSecure | quote }}
            {{- end }}
            - name: HINDSIGHT_URL
              value: {{ .Values.hindsight.url | quote }}
            {{- if .Values.hindsight.apiKeySecret.name }}
            - name: HINDSIGHT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.hindsight.apiKeySecret.name | quote }}
                  key: {{ .Values.hindsight.apiKeySecret.key | default "api-key" | quote }}
            {{- end }}
            - name: CLUSTER_DOMAIN
              value: {{ .Values.clusterDomain | default "cluster.local" | quote }}
            {{- with .Values.approvals }}
            {{- if .notifyWebhookSecret.name }}
            - name: APPROVALS_NOTIFY_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .notifyWebhookSecret.name | quote }}
                  key: {{ .notifyWebhookSecret.key | default "url" | quote }}
            {{- end }}
            {{- with .uiURL }}
            - name: APPROVALS_UI_URL
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.github.app.secretName }}
            - name: GITHUB_APP_DIR
              value: /etc/github-app
            {{- with .Values.github.app.apiURL }}
            - name: GITHUB_API_URL
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.openshell.enabled }}
            - name: OPENSHELL_GATEWAY_ADDRESS
              value: {{ include "agent-orca.openshell.gatewayAddress" . | quote }}
            - name: OPENSHELL_WORKSPACE
              value: {{ .Values.openshell.workspace | quote }}
            - name: OPENSHELL_SANDBOX_NAMESPACE
              value: {{ .Values.openshell.sandboxNamespace | default .Release.Namespace | quote }}
            {{- with .Values.openshell.placement }}
            {{- if or .nodeSelector .tolerations .runtimeClassName .priorityClassName }}
            {{- /* Label values are strings; --set turns "true" into a bool. */}}
            {{- $selector := dict }}
            {{- range $k, $v := .nodeSelector }}{{ $_ := set $selector $k (toString $v) }}{{ end }}
            - name: OPENSHELL_SANDBOX_PLACEMENT
              value: {{ toJson (dict "nodeSelector" $selector "tolerations" .tolerations "runtimeClassName" .runtimeClassName "priorityClassName" .priorityClassName) | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.openshell.tls.secretName }}
            - name: OPENSHELL_TLS_CERT_FILE
              value: /etc/openshell/tls/tls.crt
            - name: OPENSHELL_TLS_KEY_FILE
              value: /etc/openshell/tls/tls.key
            - name: OPENSHELL_TLS_CA_FILE
              value: /etc/openshell/tls/ca.crt
            {{- end }}
            {{- if .Values.openshell.tls.insecure }}
            - name: OPENSHELL_TLS_INSECURE
              value: "true"
            {{- end }}
            {{- if .Values.openshell.tokenSecret.name }}
            - name: OPENSHELL_TOKEN_FILE
              value: /etc/openshell/token/{{ .Values.openshell.tokenSecret.key }}
            {{- end }}
            {{- end }}
          args:
            - --leader-elect={{ .Values.operator.leaderElection }}
            - --health-probe-bind-address=:8081
            - --metrics-secure=false
            - --metrics-bind-address=:8080
            - --ui-auth-enabled=true
            - --schedule-min-interval={{ dig "schedule" "minInterval" "5m" .Values.operator }}
            - --schedule-max-consecutive-failures={{ dig "schedule" "maxConsecutiveFailures" 5 .Values.operator | int }}
            {{- range .Values.operator.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          ports:
            - name: metrics
              containerPort: 8080
              protocol: TCP
            - name: health
              containerPort: 8081
              protocol: TCP
            - name: internal-api
              containerPort: 8082
              protocol: TCP
            - name: ui-api
              containerPort: 8083
              protocol: TCP
            {{- if .Values.externalAPI.enabled }}
            - name: external-api
              containerPort: {{ .Values.externalAPI.port | default 8084 }}
              protocol: TCP
            {{- end }}
            - name: acp-api
              containerPort: 8000
              protocol: TCP
            - name: webhook
              containerPort: 9443
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          startupProbe:
            httpGet:
              path: /readyz
              port: health
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 1
            periodSeconds: 15
          resources:
            {{- toYaml .Values.operator.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: webhook-tls
              mountPath: /tmp/k8s-webhook-server/serving-certs
              readOnly: true
            {{- if and .Values.openshell.enabled .Values.openshell.tls.secretName }}
            - name: openshell-tls
              mountPath: /etc/openshell/tls
              readOnly: true
            {{- end }}
            {{- if and .Values.openshell.enabled .Values.openshell.tokenSecret.name }}
            - name: openshell-token
              mountPath: /etc/openshell/token
              readOnly: true
            {{- end }}
            {{- if .Values.github.app.secretName }}
            - name: github-app
              mountPath: /etc/github-app
              readOnly: true
            {{- end }}
            {{- if and .Values.database.enabled .Values.database.connectionKeySecret }}
            - name: connection-keys
              mountPath: /etc/agentorca/connection-keys
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
        - name: webhook-tls
          secret:
            secretName: {{ .Values.webhook.tlsSecretName | default (printf "%s-webhook-tls" (include "agent-orca.fullname" .)) }}
        {{- if and .Values.openshell.enabled .Values.openshell.tls.secretName }}
        - name: openshell-tls
          secret:
            secretName: {{ .Values.openshell.tls.secretName }}
        {{- end }}
        {{- if and .Values.openshell.enabled .Values.openshell.tokenSecret.name }}
        - name: openshell-token
          secret:
            secretName: {{ .Values.openshell.tokenSecret.name }}
        {{- end }}
        {{- if .Values.github.app.secretName }}
        - name: github-app
          secret:
            secretName: {{ .Values.github.app.secretName }}
        {{- end }}
        {{- if and .Values.database.enabled .Values.database.connectionKeySecret }}
        - name: connection-keys
          secret:
            secretName: {{ .Values.database.connectionKeySecret }}
            defaultMode: 0400
        {{- end }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
