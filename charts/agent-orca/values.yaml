# Default values for agent-orca.

global:
  # imageRegistry is prepended to all image references.
  # Set to your internal mirror: "registry.internal.company.com/"
  imageRegistry: ""
  imagePullSecrets: []

operator:
  image:
    repository: ghcr.io/heddles/agent-orca/operator
    tag: "latest"
    pullPolicy: IfNotPresent
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  leaderElection: true
  # Comma-separated list of allowed OCI registry prefixes.
  # Empty = allow all registries.
  allowedRegistries: ""
  # extraArgs are appended to the operator container args. Use this to enable
  # optional features such as OIDC login, e.g.:
  #   extraArgs:
  #     - --oidc-login-enabled=true
  #     - --oidc-issuer-url=https://dex.example.com
  #     - --oidc-client-id=agent-orca
  #     - --oidc-client-secret=$(OIDC_CLIENT_SECRET)
  #     - --oidc-redirect-uri=https://app.example.com/oauth/callback
  #     - --oidc-cookie-secure=true
  extraArgs: []
  # OIDC interactive login (authorization-code flow). When enabled the UI API
  # (:8083) serves /oauth/login, /oauth/callback, /oauth/logout. Login is
  # tenant-driven: each federated TenantConfig carries its own IdP config
  # (issuer/client/secret/redirect/claim mappings) — see config/samples/dev-tenant-google.yaml.
  # The per-tenant client secret lives on the TenantConfig (spec.federated.clientSecretRef,
  # in the tenant's first allowed namespace), never in these values.
  oidc:
    enabled: false
    cookieSecure: true          # set false for plain-HTTP local dev

  # operator.networkPolicy controls the NetworkPolicy applied to the operator pod.
  # oidcEgress grants the operator egress so it can reach its OIDC IdP(s) for JWKS
  # discovery and token introspection (the operator must reach the issuer URL). K8s
  # NetworkPolicy is CIDR-only (no URL/hostname egress), so supply the IdP host's
  # CIDR; 0.0.0.0/0 is the dev default. Enable only when the pod can't already reach
  # the IdP (e.g. a cluster default-deny egress). Broaden with care in production.
  networkPolicy:
    oidcEgress:
      enabled: false
      cidrs: ["0.0.0.0/0"]

modelRouter:
  image:
    repository: ghcr.io/heddles/agent-orca/model-router
    tag: "latest"
    pullPolicy: IfNotPresent
  # LLM request timeout (Go duration). The max time the model-router waits for a single
  # LLM provider response. 60s/120s is too short for long reasoning/tool-augmented calls;
  # 1h is the default. Operators can override per deploy (e.g. "30m", "2h").
  llmRequestTimeout: "1h"
  # Context compaction (#47). When a request would carry more than
  # contextCompactionThreshold of the selected provider's window, the router
  # compacts the conversation once and keeps the result:
  #   summary  - the model replaces the history with a structured summary (the
  #              original task and, mid tool loop, the current turn stay verbatim)
  #   truncate - rollback switch: drop the oldest messages down to
  #              contextCompactionRatio of the window
  contextCompactionThreshold: 0.8
  contextCompactionMode: summary
  # Deprecated: only used by the truncate mode and when a summary cannot be
  # produced (fallback). Summary compaction has no fixed target.
  contextCompactionRatio: 0.3

mcpIngester:
  image:
    repository: ghcr.io/heddles/agent-orca/mcp-ingester
    tag: "latest"

qdrant:
  image:
    repository: qdrant/qdrant
    # tag defaults to the version of the compiled Qdrant Go client, ensuring
    # the operator and new KnowledgeBase instances are always compatible.
    # Only newly created KnowledgeBases use this tag; existing instances keep
    # the Qdrant version they were created with. This means incremental
    # operator upgrades are safe — upgrading agent-orca will never force-roll
    # a running Qdrant StatefulSet to a newer version. Qdrant only guarantees
    # seamless storage migration between consecutive minor versions, so if you
    # need to upgrade an existing KnowledgeBase's Qdrant, step through each
    # minor release sequentially (e.g. v1.12 → v1.13 → v1.14 → ...).
    # Override only if you manage Qdrant versions independently; doing so may
    # cause client/server incompatibilities that are your responsibility.
    # tag: "v1.17.1"

# Cloud provider detection override. Auto-detected from node labels if empty.
# Valid values: gcp, aws, azure, none
cloudProvider: ""

# Agent state persistence configuration.
agentState:
  backend: "" # "redis" | "" (disabled — no checkpointing). Auto-set to "redis" when redis.enabled=true.
  redis:
    # url is used when redis.enabled=false and you want to point at an external Redis.
    # Include credentials in the URL if needed: redis://:password@host:6379
    url: ""
    ttlBuffer: 3600
  checkpointEvery: 1
  resumeWindow: 3600
  archiveOnCompletion: false

# Bundled Redis instance (Bitnami subchart).
# Set redis.enabled=true to deploy Redis alongside the operator.
# Auth is enabled by default; a random password is generated if redis.auth.password is empty.
redis:
  enabled: true
  image:
    repository: redis
    tag: "7-alpine"
    pullPolicy: IfNotPresent
  auth:
    # Set a static password. If empty, a random password is generated on first install.
    # For production, prefer existingSecret.
    password: ""
    # Reference an existing Secret containing the Redis password.
    # If set, auth.password is ignored.
    existingSecret: ""
    existingSecretPasswordKey: "redis-password"
  persistence:
    enabled: true
    size: 8Gi
    storageClass: ""
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Tetragon eBPF enforcement (optional). Set to false if Tetragon is not installed.
tetragon:
  enabled: false

# NVIDIA OpenShell sandboxes (optional). Agents with spec.runtime.sandbox run
# their agent process in an OpenShell sandbox: a shell the agent can exec and
# install tools in, confined by Landlock, seccomp and per-host egress policy.
#
# Setting openshell.enabled=true installs, as part of this release:
#   - the NVIDIA OpenShell gateway Helm chart (dependency alias
#     "openshell-gateway" in Chart.yaml, configured under the openshell-gateway
#     key below), and
#   - the Kubernetes SIG agent-sandbox CRDs and controller its Kubernetes
#     compute driver needs (templates/openshell-agent-sandbox.yaml, pinned to
#     agent-sandbox v1.0.8; disable with openshell.agentSandbox.install=false
#     if the cluster already runs them).
#
# The bundled gateway installs into THIS release's namespace, so the operator
# defaults below (gateway.address/namespace, sandboxNamespace) derive from
# .Release.Namespace. To run against an externally managed gateway instead
# (e.g. installed per the OpenShell docs into the "openshell" namespace), set
# openshell.gateway.address and openshell.sandboxNamespace explicitly.
openshell:
  enabled: false
  fullnameOverride: openshell
  server:
    telemetryEnabled: false
    drivers:
      kubernetes:
        # Required for openshell.placement (nodeSelector/tolerations) to work:
        # a gateway without it rejects every sandbox that sets driver config.
        allowDriverConfig: true
  # The agent-sandbox CRDs are applied by this chart in the same release, so
  # the gateway's live-cluster API preflight would race them on a fresh
  # install (it renders before anything is applied). Re-enable only when
  # openshell.agentSandbox.install=false and the cluster already has them.
  agentSandbox:
    install: true
    preflight:
      enabled: false
  gateway:
    # gRPC address of the OpenShell gateway Service. Empty derives
    # "openshell.<namespace>.svc.cluster.local:<port>" where <namespace> is
    # gateway.namespace (default: this release's namespace, where the bundled
    # gateway chart installs). Set explicitly for an external gateway, e.g.
    # "openshell.openshell.svc.cluster.local:8080".
    address: ""
    # Namespace the gateway runs in, for the operator's egress NetworkPolicy.
    # Empty = this release's namespace (where the bundled gateway installs).
    namespace: ""
    port: 8080
  # Gateway workspace sandboxes are created in.
  workspace: default
  # Namespace the gateway creates sandbox pods in (the gateway chart's
  # server.sandboxNamespace, which defaults to its release namespace).
  # Empty = this release's namespace.
  sandboxNamespace: ""
  tls:
    # Secret holding the operator's gateway client certificate (tls.crt,
    # tls.key) and the gateway CA (ca.crt). Empty uses a plaintext connection,
    # for gateways installed with server.disableTls behind a TLS-terminating
    # proxy. The bundled gateway enables mTLS by default and generates the
    # client bundle as the "openshell-client-tls" Secret in its namespace —
    # set this to "openshell-client-tls" when using it.
    secretName: ""
    # Skip gateway certificate verification. Development only.
    insecure: false
  # Optional bearer token for OIDC-enabled gateways.
  tokenSecret:
    name: ""
    key: token
  # Nodes sandbox pods run on, for every sandboxed agent. Requires the gateway
  # chart's server.drivers.kubernetes.allowDriverConfig=true; a gateway without
  # it rejects every sandbox while this is set. Example:
  #   nodeSelector: {agentorca.io/sandbox: "true"}
  #   tolerations:
  #     - {key: agentorca.io/sandbox, operator: Exists, effect: NoSchedule}
  placement:
    nodeSelector: {}
    tolerations: []
    runtimeClassName: ""
    priorityClassName: ""

# GitHub App the operator uses to give sandboxed agents short-lived git
# credentials (spec.runtime.sandbox.github, docs/openshell-sandbox.md). The
# Secret holds app-id, installation-id and private-key (PEM); it is mounted into
# the operator only. Restrict which branches the App may push with a repository
# ruleset.
github:
  app:
    secretName: ""
    # REST API base URL; empty is GitHub.com. GitHub Enterprise Server:
    # https://<host>/api/v3
    apiURL: ""

# Egress approvals (SandboxClass spec.approval; needs PostgreSQL).
approvals:
  # Secret holding an incoming-webhook URL (e.g. Slack) that gets a message for
  # each request waiting for a person. Empty: no notifications.
  notifyWebhookSecret:
    name: ""
    key: url
  # Public base URL of the UI, for links to the approvals inbox in messages.
  uiURL: ""

# Cluster DNS domain. Sandboxed agents reach their router by its fully
# qualified Service name.
clusterDomain: cluster.local

# Webhook TLS configuration. cert-manager is recommended for production.
webhook:
  certManager: false
  # If certManager is false, provide a pre-created TLS secret name.
  tlsSecretName: ""

# External API server for enterprise integrations.
# Exposes a REST API (port 8084) for external task submission, polling, and SSE streaming.
# Authenticated via TenantConfig CRDs (OAuth2 client_credentials or federated OIDC).
externalAPI:
  enabled: true
  port: 8084

# UI proxy deployment configuration.
# The ui-proxy binary serves the React SPA and authenticates API calls to the
# operator using a projected Kubernetes SA token (audience: agentorca/ui).
ui:
  image:
    repository: ghcr.io/heddles/agent-orca/ui-proxy
    tag: "latest"
    pullPolicy: IfNotPresent
  replicas: 1
  service:
    type: ClusterIP
    port: 80
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

ingress:
  enabled: false
  ingressClassName: ""  # e.g., "nginx"
  annotations: {}
  # annotations:
  #   cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts: []
  # - host: agent-orca.example.com
  #   path: /
  #   pathType: Prefix
  tls: []
  # - secretName: agent-orca-ui-tls
  #   hosts:
  #     - agent-orca.example.com

# PostgreSQL archival store (optional).
# When enabled, completed AgentRuns are snapshotted here for long-term
# retention and historical querying by the UI's Past Runs page.
#
# The PostgreSQL instance is deployed SEPARATELY (e.g., via the cloudnative-pg
# operator chart + cluster chart as separate Skaffold/Helm releases). This
# section only configures the agent-orca operator's connection to the database
# and the env vars injected into the operator pod.
#
# For Skaffold dev deployments, the cloudnative-pg-operator and
# cloudnative-pg-cluster releases are installed automatically (see skaffold.yaml).
database:
  enabled: true
  dsn: "postgresql://agentorca:$(POSTGRES_PASSWORD)@postgres-rw.agent-orca-system.svc.cluster.local:5432/agentorca?sslmode=disable"
  passwordSecret:
    name: "postgres-app"
    key: "password"

# System status alerting configuration.
# When alertWebhookURL is set, the operator fires webhook notifications on
# subsystem health transitions (up→down, down→up). The HMAC key is
# base64-decoded from alertHmacSecret and used to sign webhook payloads
# with an X-Agentorc-Signature: sha256=<hex> header.
systemStatus:
  alertWebhookURL: ""
  alertHmacSecret: ""

# Metrics & observability configuration.
# The operator exposes Prometheus-format metrics on every HTTP surface:
#   - controller-runtime manager metrics : :8080 (insecure, --metrics-secure=false)
#   - external API + ACP API metrics    : :8084 / :8000/metrics (dedicated registry)
#   - model-router sidecar metrics      : :9091/metrics (per agent-run pod)
#
# A dedicated Kubernetes Service exposing :8080 is always created when
# `metrics.enabled=true`. Scraping it (in-cluster Prometheus via the
# ServiceMonitor below, or an external scraper like Datadog) is what makes the
# metrics available to consumers — the operator does not push anywhere.
metrics:
  enabled: true
  # Dedicated Service fronting the operator metrics port. Used by the
  # ServiceMonitor and by external scrapers (e.g. Datadog OpenMetricsCheck).
  service:
    type: ClusterIP
    annotations: {}
  # Prometheus Operator ServiceMonitor for the operator (controller-runtime)
  # metrics. Requires the monitoring.coreos.com/v1 ServiceMonitor CRD, which
  # the project's cluster/cloudnative-pg charts already depend on.
  serviceMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    relabelings: []
    metricRelabelings: []
    additionalLabels: {}
  modelRouter:
    # Prometheus Operator PodMonitor for the model-router sidecar metrics
    # (:9091). Requires the monitoring.coreos.com/v1 PodMonitor CRD.
    podMonitor:
      enabled: false
      interval: 30s
      scrapeTimeout: 10s
      relabelings: []
      metricRelabelings: []
      additionalLabels: {}

# Hindsight memory system integration (self-hosted POC)
hindsight:
  enabled: true
  # url is the hindsight API endpoint. When set, the operator resolves the
  # hostname to IP(s) and injects ipBlock egress rules into the per-run
  # NetworkPolicies so agent-orca pods can reach hindsight even when the
  # cluster has a default-deny egress policy.
  # Example: "http://hindsight.local"
  url: "http://hindsight-api.hindsight.svc.cluster.local:8888"
  namespace: agent-orca-system
  port: 8888
  # apiKeySecret references an existing Secret holding the hindsight tenant API
  # key (the value hindsight runs with as HINDSIGHT_API_TENANT_API_KEY when
  # HINDSIGHT_API_TENANT_EXTENSION=hindsight_api.extensions.builtin.tenant:ApiKeyTenantExtension).
  # When set, the operator reads the key, mirrors it into each run namespace and
  # injects it into model-router containers only (never the agent container),
  # which send it as "Authorization: Bearer <key>". Leave name empty when
  # hindsight does not require authentication. Keep the key in a Secret, not in
  # inline Helm values. Rotation: update the Secret, restart the operator, then
  # recycle warm pods (pods read the key at start).
  apiKeySecret:
    name: ""
    key: api-key
  # networkPolicy.cidrs is an optional manual override for the egress CIDR
  # allowlist. Use this when the operator cannot resolve the hindsight URL
  # (e.g. DNS is not yet available at policy-creation time). Each entry is
  # a CIDR in ipBlock format, e.g. "10.244.1.42/32".
  networkPolicy:
    cidrs: []
  # Bank ID template for tenant isolation
  bankIdTemplate: "{namespace}--{agent-name}"
  # Recall budget per LLM turn
  recallBudget: 5
  # Retain conversation after every turn
  retainOnEveryTurn: true
