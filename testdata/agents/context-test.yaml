# Context-awareness test for AgentDeployments.
#
# Tests that the model-router sidecar correctly injects prior conversation
# turns into the LLM context across multiple AgentRuns within one session.
#
# Requires shared.yaml to be applied first (ModelProvider + ModelSelector).
#
# Apply:
#   kubectl apply -f testdata/agents/shared.yaml
#   kubectl apply -f testdata/agents/context-test.yaml
#
# Then open the UI, go to Deployments, select "test-context-agent-deployment",
# and run the multi-turn script below in the Chat tab:
#
#   Turn 1: "My name is Alice and my secret number is 42."
#   Turn 2: "What is my name?"          → must include "Alice"
#   Turn 3: "What is my secret number?" → must include "42"
#   Turn 4: "List everything I have told you so far."
#
# If the agent answers correctly across all turns, context injection is working.
# If it says "I don't know" on turn 2+, the checkpoint store is not reaching
# the model-router (check STATE_BACKEND / REDIS_URL on the operator).

---
apiVersion: agentorc.agentorc.io/v1alpha1
kind: Agent
metadata:
  name: test-context-agent
  namespace: default
spec:
  modelSelectorRef: test-router
  systemPrompt: |
    You are a memory-test assistant. Your only job is to recall facts the user
    has told you in this conversation.

    Rules:
    - When asked for a fact (name, number, colour, etc.), answer with ONLY the
      fact and the turn number when it was stated, e.g. "Alice (stated in turn 1)".
    - If you genuinely cannot find the fact in the conversation history, say
      exactly: "I have no record of that."
    - Never make up facts. Never infer. Only report what was explicitly stated.

    This strict behaviour makes it easy to detect context injection failures.
  runtime:
    ociRef: "python:3.12-slim"
    framework: openai-compatible
    command: ["python3", "-c"]
    args:
      - |
        import json, os, urllib.request
        inp = os.environ.get("AGENTORC_INPUT", "Hello")
        base_url = os.environ.get("OPENAI_BASE_URL", "http://localhost:8080")
        api_key  = os.environ.get("OPENAI_API_KEY", "unused")
        body = json.dumps({
          "model": "default",
          "stream": True,
          "messages": [{"role": "user", "content": inp}],
        }).encode()
        req = urllib.request.Request(
          f"{base_url}/v1/chat/completions",
          data=body,
          headers={"Content-Type": "application/json", "Authorization": f"Bearer {api_key}"},
        )
        with urllib.request.urlopen(req, timeout=120) as r:
          for line in r:
            line = line.decode().strip()
            if not line.startswith("data: "):
              continue
            data = line[len("data: "):]
            if data == "[DONE]":
              break
            chunk = json.loads(data)
            choices = chunk.get("choices", [])
            if not choices:
              continue
            content = choices[0].get("delta", {}).get("content", "")
            if content:
              print(content, end="", flush=True)
        print()
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

---
apiVersion: agentorc.agentorc.io/v1alpha1
kind: AgentDeployment
metadata:
  name: test-context-agent-deployment
  namespace: default
spec:
  agentRef: test-context-agent
  inputSource:
    type: chat
  replicas: 1
  restartPolicy:
    minBackoffSeconds: 5
    maxBackoffSeconds: 60
    maxConsecutiveFailures: 3
