name: Release Drafter

# Automatically drafts a release on every push to main, assembling changelog
# entries from Merged PR titles (Conventional Commits / "feat:", "fix:", etc.
# are grouped automatically). A maintainer publishes the draft as a real release
# and tags it; GitHub Actions then picks up the `release` event to build
# artifacts (binaries + PyPI package). This file does NOT cut a release by itself.

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: release-drafter/release-drafter@v7
        with:
          # Keep the working version ahead of the last tag so the draft is
          # always editable before publish.
          version-resolver:
            tag-prefix: v
            fallback-version: 0.1.0
