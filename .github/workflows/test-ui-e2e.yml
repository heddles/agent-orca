name: UI E2E Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies and Playwright
        working-directory: ui
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Create Kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: agent-orc-ui-e2e

      - name: Build and load images
        run: |
          make docker-build IMG=agent-orc:e2e
          docker build -t agent-orc-ui:e2e ui/
          kind load docker-image agent-orc:e2e agent-orc-ui:e2e --name agent-orc-ui-e2e

      - name: Deploy with Helm
        run: |
          make install
          helm upgrade --install agent-orc ./charts/agent-orc \
            --set operator.image.repository=agent-orc \
            --set operator.image.tag=e2e \
            --set ui.image.repository=agent-orc-ui \
            --set ui.image.tag=e2e \
            --wait --timeout 120s

      - name: Port-forward UI
        run: |
          kubectl port-forward svc/agent-orc-ui 8080:8080 &
          sleep 3

      - name: Run Playwright tests
        working-directory: ui
        run: npx playwright test
        env:
          BASE_URL: http://localhost:8080

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: ui/test-results/
