name: Govulncheck

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly scan so advisories published after the last PR still surface.
    - cron: "0 6 * * 1"

jobs:
  govulncheck:
    name: Govulncheck
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v7

      # Floating "1.26", like the golang:1.26 image the release Dockerfile
      # builds with, so the scan sees the same standard library the shipped
      # binaries were compiled against — including security patches. Pinning
      # to go-version-file (go 1.26.0) made the first run fail with 44
      # reachable stdlib findings, mostly x509 fixed in go1.26.1.
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
