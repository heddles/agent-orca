name: Build & Publish Reference Agent Image

# Builds and publishes the reference OpenAI-compatible agent image
# (ghcr.io/agentorca/agent-orca/openai-reference) alongside GitHub Releases.
#
# Release Drafter drafts a release on push to main; a maintainer publishes it,
# which fires `release: published` and builds the image for that tag.
# `workflow_dispatch` lets a maintainer re-publish a specific tag manually.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag name to publish (e.g. v0.4.0)"
        required: false
        default: ""

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/agentorca/agent-orca/openai-reference

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine publish tag
        id: meta
        run: |
          if [ "$GITHUB_EVENT_NAME" = "release" ]; then
            TAG="${GITHUB_REF_NAME#refs/tags/}"
          elif [ -n "${{ inputs.ref }}" ]; then
            TAG="${{ inputs.ref }}"
          else
            echo "::error::No tag available (trigger a Release or pass 'ref' via workflow_dispatch)"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "tags=${{ env.IMAGE_NAME }}:$TAG
          ${{ env.IMAGE_NAME }}:latest" >> "$GITHUB_OUTPUT"

      - name: Build and push multi-arch reference image
        # Build context is the repository root — the Dockerfile copies from
        # ./pkg/python/agentorca and ./examples/agent-sdk-template.
        uses: docker/build-push-action@v6
        with:
          context: .
          file: examples/agent-sdk-template/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          attestation: false

      - name: Image digest
        run: echo "Published ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }} (+ :latest)"
