name: UI Tests

# No path filter: UI Tests is a required check, and a path-filtered required
# check never reports on PRs outside ui/, leaving them blocked.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: UI Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
