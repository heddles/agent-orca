openapi: 3.1.0
info:
  title: agent-orca UI API
  description: |
    REST API consumed by the agent-orca React UI. Served by the operator on port
    8083 behind the UIProxy BFF (which injects a projected Kubernetes SA token
    with audience "agentorca/ui"). OIDC tenant JWTs are also accepted when
    externalAuth is configured, enabling per-tenant resource scoping.
  version: "1.0.0"
  contact:
    name: agent-orca
  license:
    name: Apache-2.0
servers:
  - url: http://localhost:8083
    description: cluster-internal
tags:
  - name: health
    description: Liveness, readiness, version probes (public)
  - name: runs
    description: AgentRun listing, detail, streaming, history
  - name: resources
    description: Generic CRUD for all CRD types (agents, tools, mcpservers, modelproviders, knowledgebases, modelselectors, agentdeployments, agentworkflows, agentschedules)
  - name: schedules
    description: Scheduled runs (AgentSchedule). Plain CRUD is /api/resources/agentschedules; these are the summary, preview, history and run controls
  - name: deployments
    description: AgentDeployment chat execution, history, streaming
  - name: workflows
    description: AgentWorkflow listing and detail
  - name: costs
    description: Spend aggregation across runs
  - name: system
    description: System status, metrics, and alerts
  - name: agents
    description: Agent CRD listing and creation
  - name: modelselectors
    description: ModelSelector listing
  - name: audit
    description: Audit trail of changes (admin)
  - name: evals
    description: Evaluation datasets and cases (PostgreSQL store; 503 without it)
  - name: connections
    description: Per-user OAuth connections to MCP servers (PostgreSQL store and a connection key; 503 without them). Responses never carry a token, a client secret or an authorization code
  - name: triggers
    description: Webhook triggers that start a run of an agent from outside (PostgreSQL store; 503 without it)
  - name: widget
    description: Chat widget keys, and the public endpoints a page's widget calls (PostgreSQL store; 503 or 404 without it)
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: "K8s-SA-token or OIDC-tenant-JWT"
  schemas:
    DryRunResult:
      type: object
      description: The answer of a write with dryRun=true.
      required: [valid]
      properties:
        valid: { type: boolean }
        object: { type: object, description: The object as it would be stored (valid is true). }
        errors:
          type: array
          items: { type: string }
          description: Validation, webhook, ownership or conflict messages (valid is false).
        currentResourceVersion: { type: string, description: Set on a stale-version conflict. }
    BuilderOption:
      type: object
      required: [name, namespace]
      properties:
        name: { type: string }
        namespace: { type: string }
        description: { type: string }
    BuilderOptions:
      type: object
      required: [modelSelectors, tools, mcpServers, knowledgeBases, guardrailPolicies]
      properties:
        modelSelectors: { type: array, items: { $ref: '#/components/schemas/BuilderOption' } }
        tools: { type: array, items: { $ref: '#/components/schemas/BuilderOption' } }
        mcpServers: { type: array, items: { $ref: '#/components/schemas/BuilderOption' } }
        knowledgeBases: { type: array, items: { $ref: '#/components/schemas/BuilderOption' } }
        guardrailPolicies: { type: array, items: { $ref: '#/components/schemas/BuilderOption' } }
    BuilderCheckRequest:
      type: object
      required: [agent, datasetId]
      properties:
        agent: { type: object, description: 'The draft Agent object, saved or not. It is validated by the dry-run write and never stored.' }
        datasetId: { type: integer, description: 'A dataset in the same workspace as the draft.' }
        budgetUsd: { type: number, description: 'The spending limit. Default operator.builder.checkDefaultBudgetUSD (0.25), at most operator.builder.checkMaxBudgetUSD (2).' }
        compareWithPublished: { type: boolean, description: 'Default true: when the agent has an AgentDeployment, the live agent runs as the baseline arm.' }
    BuilderCheckResponse:
      type: object
      required: [valid, experiment, comparedWithPublished, capped]
      properties:
        valid: { type: boolean }
        experiment: { $ref: '#/components/schemas/EvalExperiment' }
        comparedWithPublished: { type: boolean, description: 'True when the arms are "published" (baseline) then "draft"; otherwise only "draft".' }
        capped: { type: boolean, description: 'True when only the first cases of the dataset run.' }
    CreatedRef:
      type: object
      required: [kind, namespace, name]
      properties:
        kind: { type: string }
        namespace: { type: string }
        name: { type: string }
    UseTemplateResult:
      type: object
      required: [agent, created]
      properties:
        agent: { type: object, description: The new Agent, with an ownership field. }
        created:
          type: array
          items: { $ref: '#/components/schemas/CreatedRef' }
          description: Every object made, in creation order.
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
    SubSystemStatus:
      type: object
      properties:
        name: { type: string }
        status: { type: string, enum: [up, down, degraded] }
        message: { type: string }
        latencyMS: { type: integer }
    ProviderHealth:
      type: object
      properties:
        name: { type: string }
        namespace: { type: string }
        ready: { type: boolean }
        latencyMS: { type: integer }
        message: { type: string }
    SystemMetrics:
      type: object
      properties:
        requestCount24h: { type: integer }
        p50LatencyMs: { type: number }
        p95LatencyMs: { type: number }
        p99LatencyMs: { type: number }
        tokenThroughput: { type: number }
        egressPublished: { type: integer }
        egressFailed: { type: integer }
        samples:
          type: array
          items: { $ref: '#/components/schemas/MetricSample' }
    MetricSample:
      type: object
      properties:
        time: { type: integer, format: int64 }
        requestCount: { type: integer }
        p50LatencyMs: { type: number }
        p95LatencyMs: { type: number }
        p99LatencyMs: { type: number }
        egressPublished: { type: integer }
        egressFailed: { type: integer }
        tokenThroughput: { type: number }
    SystemStatus:
      type: object
      properties:
        stateConfigured: { type: boolean }
        runHistoryConfigured: { type: boolean }
        version: { type: string }
        subsystems:
          type: array
          items: { $ref: '#/components/schemas/SubSystemStatus' }
        modelProviders:
          type: array
          items: { $ref: '#/components/schemas/ProviderHealth' }
        metrics: { $ref: '#/components/schemas/SystemMetrics' }
    AlertEntry:
      type: object
      properties:
        id: { type: string }
        subsystem: { type: string }
        state: { type: string, enum: [firing, resolved] }
        message: { type: string }
        firstSeen: { type: string, format: date-time }
        lastSeen: { type: string, format: date-time }
        resolvedAt: { type: string, format: date-time, nullable: true }
    RunHistorySummary:
      type: object
      properties:
        name: { type: string }
        namespace: { type: string }
        agentRef: { type: string }
        phase: { type: string }
        spendUSD: { type: string }
        startTime: { type: string, format: date-time, nullable: true }
        completionTime: { type: string, format: date-time, nullable: true }
        tenant: { type: string, nullable: true }
    RunHistoryResponse:
      type: object
      properties:
        runs:
          type: array
          items: { $ref: '#/components/schemas/RunHistorySummary' }
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }
    RunHistoryDetail:
      type: object
      properties:
        name: { type: string }
        namespace: { type: string }
        agentRef: { type: string }
        input: { type: string }
        output: { type: string }
        phase: { type: string }
        spendUSD: { type: string }
        restartCount: { type: integer }
        startTime: { type: string, format: date-time, nullable: true }
        completionTime: { type: string, format: date-time, nullable: true }
        contextUsedTokens: { type: integer }
        maxContextTokens: { type: integer }
        routingDecisions:
          type: array
          items: { $ref: '#/components/schemas/RoutingDecisionInfo' }
        childRunRefs: { type: array, items: { type: string } }
        tools: { type: array, items: { type: string } }
        mcps: { type: array, items: { type: string } }
        resolvedModel: { type: string }
        traceEntries:
          type: array
          description: >
            Archived execution trace entries (tokens, tool calls, tool results, etc.)
            read from the Redis stream at archival time. Enables the history view
            to render the same TraceAccordion UI as the live runs tab.
          items:
            type: object
            properties:
              id: { type: integer }
              event: { type: object, description: Discriminated trace event }
              ts: { type: string, format: date-time }
              childRunName: { type: string }
        payloadPrunedAt:
          type: string
          format: date-time
          description: >
            Set when archived-run retention (ARCHIVED_RUNS_RETENTION_DAYS) emptied this
            run's output and trace. Cost, status, tokens and times are kept.
    RoutingDecisionInfo:
      type: object
      properties:
        model: { type: string }
        provider: { type: string }
        strategy: { type: string }
        reason: { type: string }
        confidence: { type: string }
        timestamp: { type: string, format: date-time, nullable: true }
    Fleet:
      type: object
      properties:
        window: { type: string, enum: ['24h', '7d'] }
        since: { type: string, format: date-time }
        tenantSpendUSD: { type: number }
        tenantBudgetUSD: { type: number, nullable: true }
        agents:
          type: array
          items: { $ref: '#/components/schemas/FleetRow' }
    FleetRow:
      type: object
      properties:
        name: { type: string }
        namespace: { type: string }
        maintainer: { type: string }
        published: { type: boolean }
        deployment: { type: string }
        owner: { type: string, enum: [ui, git, unknown] }
        health:
          type: object
          properties:
            status: { type: string, enum: [healthy, degraded, failing, unknown] }
            reason: { type: string }
        runCount: { type: integer }
        errorRate: { type: number, nullable: true }
        p95DurationSeconds: { type: number, nullable: true }
        spend:
          type: object
          properties:
            usd: { type: number }
            agentBudgetUSD: { type: number, nullable: true }
            tenantBudgetUSD: { type: number, nullable: true }
        pendingApprovals: { type: integer }
        lastEvalScore: { type: number, nullable: true }
    CatalogEntry:
      type: object
      properties:
        name: { type: string }
        namespace: { type: string }
        description: { type: string }
        exampleInputs: { type: array, items: { type: string } }
        maintainer: { type: string }
        published: { type: boolean }
        deployment: { type: string }
        conversational: { type: boolean }
        template: { type: boolean }
        templateGroup: { type: string }
        tools: { type: array, items: { type: string } }
        modelSelector: { type: string }
        runCount: { type: integer }
        typicalCostUSD: { type: number, nullable: true }
        members:
          type: array
          items:
            type: object
            properties:
              kind: { type: string }
              name: { type: string }
    CurrentUser:
      type: object
      required: [userId, groups, tenant, workspaces, roles]
      properties:
        userId:
          type: string
          description: The IdP subject or email of the signed-in user. Empty for tenant-level (client credentials) callers.
        groups: { type: array, items: { type: string } }
        tenant:
          type: object
          nullable: true
          description: The caller's tenant. Null for a service-account session, which has no tenant.
          required: [id, name]
          properties:
            id: { type: string, description: 'Stable tenant ID ("tnt_" plus a UUIDv7). Authorization keys on this.' }
            name: { type: string, description: Display name; an operator can reuse it. }
        workspaces:
          type: array
          description: The namespaces the caller may use.
          items:
            type: object
            required: [name, namespace, primary]
            properties:
              name: { type: string }
              namespace: { type: string }
              primary: { type: boolean, description: The first allowed namespace, where new resources are created. }
        roles:
          type: array
          description: >
            Roles inside the tenant, cumulative and lowest first: an admin lists
            viewer, runner, builder and admin. Empty when the tenant's spec.roles
            give the caller no access. Without spec.roles every signed-in user is a
            runner; service-account and client-credentials callers get
            operator.machineDefaultRole.
          items: { type: string, enum: [viewer, runner, builder, admin] }
    AuditEvent:
      type: object
      properties:
        id: { type: integer, format: int64 }
        tenantId: { type: string }
        userId: { type: string }
        action: { type: string }
        kind: { type: string }
        namespace: { type: string }
        name: { type: string }
        resourceVersion: { type: string }
        summary: { type: string }
        createdAt: { type: string, format: date-time }
    AuditPage:
      type: object
      required: [events]
      properties:
        events:
          type: array
          items: { $ref: '#/components/schemas/AuditEvent' }
        nextCursor: { type: string, description: Pass as cursor for the next page; absent on the last. }
    Revision:
      type: object
      required: [revision, action, userId, createdAt, summary, resourceVersion]
      properties:
        revision: { type: integer, description: Number of the revision, counting up per object. }
        action: { type: string, enum: [create, update, restore, delete] }
        userId: { type: string }
        createdAt: { type: string, format: date-time }
        summary: { type: string }
        resourceVersion: { type: string, description: The resourceVersion the write produced (the one before the delete, for a delete). }
        restoredFrom: { type: integer, description: The revision a restore applied; only for action restore. }
    RevisionDetail:
      allOf:
        - $ref: '#/components/schemas/Revision'
        - type: object
          required: [object]
          properties:
            object:
              type: object
              description: >
                The object as stored after the write, without status, managedFields,
                resourceVersion, uid, generation and creationTimestamp, and without
                the owner, actor and handoff annotations.
    RevisionPage:
      type: object
      required: [revisions, next]
      properties:
        revisions:
          type: array
          items: { $ref: '#/components/schemas/Revision' }
        next: { type: string, description: Pass as before for the next (older) page; empty on the last. }
    Ownership:
      type: object
      description: >
        Who owns the object. Carried by every object the resource and catalog
        endpoints return. Git tracking metadata (Argo CD, Flux, Helm) wins over an
        agentorca.io/owner annotation.
      required: [owner, editable, handoff]
      properties:
        owner:
          type: string
          enum: [ui, git, unknown]
          description: >
            ui for an object created through the UI API; git for an object a GitOps
            tool tracks or that is annotated agentorca.io/owner=git; unknown for
            an object with neither (made by hand), which the UI does not edit.
        tool:
          type: string
          enum: [argocd, flux-kustomize, flux-helm, helm, git]
          description: The tool that manages a Git-owned object.
        app:
          type: string
          description: The Argo CD application, Flux Kustomization or HelmRelease (namespace/name), or Helm release.
        editable:
          type: boolean
          description: >
            True only for a UI-owned object of the caller's tenant when the caller
            holds the role that writes the kind (builder, or admin for tools,
            mcpservers, modelproviders and modelselectors).
        handoff:
          type: object
          required: [pending]
          properties:
            pending: { type: boolean, description: An export marked the object for handoff and the handoff has not expired. }
            expires: { type: string, format: date-time }
    WidgetKey:
      type: object
      required: [id, namespace, agent, name, allowedOrigins, rateLimitPerMin, budgetUsdPerDay, enabled, createdBy, createdAt]
      properties:
        id: { type: string, description: The public key in the embed snippet. It is not a secret. }
        tenantId: { type: string }
        namespace: { type: string }
        agent: { type: string }
        name: { type: string }
        allowedOrigins: { type: array, items: { type: string }, description: Exact page origins, https (http for localhost). }
        rateLimitPerMin: { type: integer }
        budgetUsdPerDay: { type: number }
        enabled: { type: boolean }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
    Trigger:
      type: object
      required: [id, namespace, agent, name, inputPath, rateLimitPerMin, enabled, createdBy, createdAt, fireCount]
      properties:
        id: { type: string }
        tenantId: { type: string }
        namespace: { type: string }
        agent: { type: string }
        name: { type: string }
        inputPath: { type: string }
        rateLimitPerMin: { type: integer }
        enabled: { type: boolean }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        lastFiredAt: { type: string, format: date-time }
        fireCount: { type: integer }
    EvalGate:
      type: object
      required: [id, namespace, agent, datasetId, baselineRevision, margin, minCases, budgetUsd, enabled, updatedBy]
      properties:
        id: { type: integer }
        namespace: { type: string }
        agent: { type: string }
        datasetId: { type: integer }
        baselineRevision: { type: integer }
        margin: { type: number }
        minCases: { type: integer }
        minPassRate: { type: number }
        maxRegressions: { type: integer }
        budgetUsd: { type: number }
        enabled: { type: boolean }
        updatedBy: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    GateDecision:
      type: object
      required: [status, required, reason]
      properties:
        status: { type: string, enum: [passed, failed, missing, stale] }
        reason: { type: string }
        experimentId: { type: integer }
        required:
          type: object
          properties:
            margin: { type: number }
            minCases: { type: integer }
            minPassRate: { type: number }
            maxRegressions: { type: integer }
        best:
          type: object
          description: What the latest gate experiment found.
          properties:
            cases: { type: integer }
            passRate: { type: number }
            baselinePassRate: { type: number }
            diffLo: { type: number }
            regressions: { type: integer }
            nonInferior: { type: boolean }
            unreviewed: { type: integer }
    EvalExperiment:
      type: object
      required: [id, namespace, datasetId, datasetVersion, status, arms, repeats, budgetUsd, spentUsd, resultsTotal]
      properties:
        id: { type: integer }
        namespace: { type: string }
        datasetId: { type: integer }
        datasetVersion: { type: integer, description: The dataset version the experiment runs, frozen at creation }
        name: { type: string }
        status: { type: string, enum: [queued, running, grading, awaiting_review, complete, cancelled, failed] }
        arms: { type: array, items: { type: object, description: 'label, agent, revision, hash (filled when it starts), modelProvider, and for a check the draft spec' } }
        purpose: { type: string, enum: [compare, gate, check] }
        maxCases: { type: integer, description: 'A check runs only the first maxCases cases.' }
        repeats: { type: integer }
        budgetUsd: { type: number }
        spentUsd: { type: number }
        runBudgetUsd: { type: number }
        timeoutSeconds: { type: integer }
        concurrency: { type: integer }
        cancelRequested: { type: boolean }
        cases: { type: integer }
        resultsDone: { type: integer }
        resultsTotal: { type: integer }
        summary: { type: object, description: 'stoppedBy, partial, results, skipped, spentUsd, the paired comparison, graders (per grader: graded, passed, notGraded, invalid, errors, pendingReview, inconsistent, judgeCostUsd), judgeSpentUsd and reviewPending' }
        warnings: { type: array, items: { type: string }, description: 'On create only: cautions, such as a judge that is also an arm.' }
        error: { type: string }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
    EvalReviewItem:
      type: object
      description: >
        One thing for a person to grade. It is blind: nothing names the arm, the
        repeat, the run, its cost or its tools, and its ID is the assignment's.
      required: [id, experimentId, caseId, grader, scale, input, output, status]
      properties:
        id: { type: integer, format: int64 }
        experimentId: { type: integer, format: int64 }
        caseId: { type: integer, format: int64 }
        grader: { type: string }
        scale: { type: string, enum: [passfail, 1to5] }
        instructions: { type: string }
        passAt: { type: number }
        input: { type: string }
        reference: { type: string }
        output: { type: string }
        status: { type: string, enum: [pending, done, closed] }
        reviewer: { type: string }
        labelledAt: { type: string, format: date-time }
        score: { type: number }
        pass: { type: boolean }
        comment: { type: string }
    EvalReviewLabel:
      type: object
      description: Pass for a passfail grader, stars for a 1to5 one.
      properties:
        pass: { type: boolean }
        stars: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: string, maxLength: 2048 }
    EvalCalibration:
      type: object
      required: [llmGrader, humanGrader, minPairs, tooFewPairs, report]
      properties:
        llmGrader: { type: string }
        humanGrader: { type: string }
        minPairs: { type: integer, description: 'The fewest results graded by both for a report (20).' }
        tooFewPairs: { type: boolean }
        report:
          type: object
          properties:
            pairs: { type: integer }
            agreement: { type: number, description: Share of results the judge and the human agree on. }
            kappa: { type: number, description: Cohen's kappa. }
            kappaDefined: { type: boolean, description: False when one side gave the same verdict throughout. }
            trustworthy: { type: boolean, description: 'False under kappa 0.4: the judge cannot be part of a gate unless an admin accepts it.' }
            confusion:
              type: object
              properties:
                bothPass: { type: integer }
                bothFail: { type: integer }
                llmPassHumanFail: { type: integer }
                llmFailHumanPass: { type: integer }
            disagreements: { type: array, items: { type: object } }
            disagreementsCut: { type: boolean }
    EvalDataset:
      type: object
      description: >
        A named, versioned set of evaluation cases in one workspace. version
        starts at 1 and goes up by one for each add call (a bulk add counts
        once), each edit that changes a field, and each removal of a case.
        Changing the description or agent does not change it.
      required: [id, namespace, name, version, caseCount, createdBy, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int64 }
        tenantId: { type: string }
        namespace: { type: string, description: The workspace the dataset belongs to. }
        name: { type: string, description: A DNS label, unique per workspace. }
        description: { type: string, maxLength: 2000 }
        agent: { type: string, description: Optional name of the Agent the dataset is meant for. }
        version: { type: integer }
        caseCount: { type: integer, description: Live (not removed) cases. }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    EvalDatasetCreate:
      type: object
      required: [name]
      properties:
        namespace: { type: string, description: Defaults to the caller's first workspace. }
        name: { type: string }
        description: { type: string }
        agent: { type: string }
    EvalDatasetPatch:
      type: object
      description: Only the fields present change.
      properties:
        description: { type: string }
        agent: { type: string }
    EvalCase:
      type: object
      required: [id, datasetId, addedIn, input, referenceKind, tags, weight, redacted, createdAt]
      properties:
        id: { type: integer, format: int64 }
        datasetId: { type: integer, format: int64 }
        namespace: { type: string }
        datasetName: { type: string }
        addedIn: { type: integer, description: The dataset version that added the case. }
        removedIn: { type: integer, description: The version that removed it; absent while live. }
        input: { type: string }
        reference: { type: string }
        referenceKind: { type: string, enum: [none, exact, example, rubric] }
        tags: { type: array, items: { type: string } }
        weight: { type: number, exclusiveMinimum: 0 }
        sourceRunNamespace: { type: string }
        sourceRun: { type: string, description: The run the case was copied from. A pointer only; the run may be gone. }
        sourceUser: { type: string }
        redacted: { type: boolean, description: The text went through redaction on capture. }
        createdAt: { type: string, format: date-time }
    EvalCaseInput:
      type: object
      description: >
        One case, as a JSON body or as one line of JSON lines. Give expected or
        reference, not both. A reference with no referenceKind is exact.
      required: [input]
      properties:
        input: { type: string }
        expected: { type: string }
        reference: { type: string }
        referenceKind: { type: string, enum: [none, exact, example, rubric] }
        tags: { type: array, items: { type: string }, maxItems: 20 }
        weight: { type: number, exclusiveMinimum: 0 }
    EvalCasePatch:
      type: object
      description: Only the fields present change.
      properties:
        input: { type: string }
        reference: { type: string }
        referenceKind: { type: string, enum: [none, exact, example, rubric] }
        tags: { type: array, items: { type: string } }
        weight: { type: number }
    EvalCasePage:
      type: object
      required: [cases, datasetVersion]
      properties:
        cases: { type: array, items: { $ref: '#/components/schemas/EvalCase' } }
        nextCursor: { type: string, description: Pass as cursor for the next page; absent on the last. }
        datasetVersion: { type: integer }
    EvalCasesAdded:
      type: object
      required: [added, datasetVersion, cases]
      properties:
        added: { type: integer }
        datasetVersion: { type: integer, description: The version after the add (one bump for the whole call). }
        cases: { type: array, items: { $ref: '#/components/schemas/EvalCase' } }
    EvalCaseChanged:
      type: object
      required: [case, datasetVersion]
      properties:
        case: { $ref: '#/components/schemas/EvalCase' }
        datasetVersion: { type: integer }
    EvalGraderInput:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [exact, contains, not_contains, regex, json_schema, json_field_equals, tool_called, tool_not_called, max_cost, max_latency, llm, human]
        config:
          type: object
          description: >
            Per kind. exact {normalize?: [trim, collapseWhitespace, lowercase], value?};
            contains and not_contains {value, caseInsensitive?}; regex {pattern, mustMatch?}
            (RE2, at most 1 KiB); json_schema {schema} (at most 64 KiB, no remote $ref);
            json_field_equals {path, value}; tool_called and tool_not_called {tool};
            max_cost {usd}; max_latency {ms}. llm {providerRef, rubric (at most 4000
            characters), mode?: rubric (default), reference or pairwise, passAt? (default 0.7),
            maxTokens? (16 to 2048, default 512), judgeRepeats? (1 to 3, median)}: a
            ModelProvider of the workspace or the platform catalog judges, in an experiment
            only. human {scale?: passfail (default) or 1to5, instructions?, passAt? (default
            0.75), sample? (cases to review, 0 for all)}: a person labels, in an experiment's
            review queue only. Neither grades a result sent to the grade endpoint; they
            come back not graded.
          additionalProperties: true
        weight: { type: number, minimum: 0, exclusiveMinimum: true, default: 1 }
        required: { type: boolean, default: false, description: A failing required grader fails the case. }
    EvalGrader:
      allOf:
        - $ref: '#/components/schemas/EvalGraderInput'
        - type: object
          required: [id, datasetId, name, config, weight, required, createdBy, createdAt, updatedAt]
          properties:
            id: { type: integer, format: int64 }
            datasetId: { type: integer, format: int64 }
            name: { type: string }
            createdBy: { type: string }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    EvalGradeRequest:
      type: object
      required: [output]
      properties:
        caseId: { type: integer, format: int64, description: A live case of the dataset; its reference is used. }
        reference: { type: string, description: The reference to grade against when there is no case. }
        arm: { type: string, maxLength: 128, description: A free label, such as a model or a revision. }
        output: { type: string, description: 'The agent output, at most 262144 bytes.' }
        toolCalls: { type: array, items: { type: string }, maxItems: 1000, description: Names of the tools the run called. }
        costUsd: { type: number, minimum: 0 }
        latencyMs: { type: integer, format: int64, minimum: 0 }
    EvalGrade:
      type: object
      required: [graderId, grader, score, pass, detail]
      properties:
        graderId: { type: integer, format: int64 }
        grader: { type: string }
        kind: { type: string }
        score: { type: number, minimum: 0, maximum: 1 }
        pass: { type: boolean }
        notGraded: { type: boolean, description: The grader needed a reference the case lacks. It is not a pass. }
        detail: { type: string, description: 'Why, in at most 1 KiB (4 KiB for a judge or a reviewer); never the output. Plain text: show it escaped, never as Markdown.' }
        status:
          type: string
          enum: [ok, error, invalid, pending_review]
          description: >
            ok counts. error: the grader could not run (no trace, no judge, no budget);
            invalid: a judge reply that was not usable, counted as failed; pending_review:
            waiting for a human, left out of the comparison and never a pass.
        judgeCostUsd: { type: number, description: What the judge call cost, part of the experiment's spend. }
        gradedBy: { type: string, description: Who labelled a human grade. }
        inconsistent: { type: boolean, description: A pairwise judge whose two orderings disagreed; the grade is a tie. }
    EvalResult:
      type: object
      required: [id, datasetId, output, toolCalls, costUsd, latencyMs, casePass, createdBy, createdAt, grades]
      properties:
        id: { type: integer, format: int64 }
        datasetId: { type: integer, format: int64 }
        caseId: { type: integer, format: int64 }
        arm: { type: string }
        output: { type: string }
        toolCalls: { type: array, items: { type: string } }
        costUSD: { type: number }
        latencyMs: { type: integer, format: int64 }
        casePass: { type: boolean }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        grades: { type: array, items: { $ref: '#/components/schemas/EvalGrade' } }
    EvalCapture:
      type: object
      required: [datasetId]
      properties:
        datasetId: { type: integer, format: int64 }
        reference: { type: string, description: The expected answer, written by the person. }
        referenceKind: { type: string, enum: [none, exact, example, rubric], description: Default exact when a reference is given. }
        useOutput: { type: boolean, description: Take the run's output as the reference, kind example. Never the default. }
        redact: { type: boolean, default: true, description: false keeps the original text; refused with 403 when the operator forbids it. }
        tags: { type: array, items: { type: string } }
        preview: { type: boolean, description: Return what would be stored, with the original, and store nothing. }
    EvalCaptured:
      type: object
      required: [case, redaction]
      properties:
        case: { $ref: '#/components/schemas/EvalCase' }
        datasetVersion: { type: integer }
        redaction:
          type: object
          description: What redaction did to "input" and "reference". Rule names only, never text.
          additionalProperties:
            type: object
            properties:
              replacements: { type: integer }
              rules: { type: array, items: { type: string } }
        preview: { type: boolean }
        original: { type: object, additionalProperties: { type: string }, description: The text before redaction. Only in a preview. }
    ResourceKind:
      type: string
      enum: [agents, tools, mcpservers, modelproviders, knowledgebases, modelselectors, agentdeployments, agentworkflows, agentschedules]
security:
  - BearerAuth: []
paths:
  /api/catalog:
    get:
      tags: [agents]
      summary: Agent catalog
      description: >
        Every agent the caller may read, with its description, example inputs,
        maintainer, whether it is published (has an AgentDeployment), template
        membership, and the median cost of its finished runs.
      parameters:
        - in: query
          name: namespace
          schema: { type: string }
      responses:
        '200':
          description: catalog entries
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CatalogEntry' }
  /api/fleet:
    get:
      tags: [agents]
      summary: Fleet overview
      description: >
        One row per agent the caller may read: owner, health (from the agent's
        and its deployment's conditions), and over the window the run count,
        error rate (failed over finished runs), p95 duration and spend against
        the agent's and the tenant's daily budget (scaled to the window), plus
        pending approvals. lastEvalScore is null until evaluations exist.
        Needs the viewer role.
      parameters:
        - in: query
          name: window
          schema: { type: string, enum: ['24h', '7d'], default: '24h' }
        - in: query
          name: namespace
          schema: { type: string }
      responses:
        '200':
          description: the fleet
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Fleet' }
        '400':
          description: unknown window
  /api/my/runs:
    get:
      tags: [runs]
      summary: The signed-in user's recent runs
      description: >
        Up to 20 recent runs started by the signed-in user (recorded in the
        agentorca.io/created-by annotation, set for runs started through the UI
        or ACP API). When the user has none, the tenant's recent runs are
        returned and scope is "tenant".
      parameters:
        - in: query
          name: namespace
          schema: { type: string }
      responses:
        '200':
          description: recent runs
          content:
            application/json:
              schema:
                type: object
                properties:
                  scope: { type: string, enum: [user, tenant] }
                  userId: { type: string }
                  runs:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        namespace: { type: string }
                        agentRef: { type: string }
                        phase: { type: string }
                        spendUSD: { type: string }
                        input: { type: string }
                        output: { type: string }
                        clarifyQuestion: { type: string }
                        createdBy: { type: string }
                        createdAt: { type: string, format: date-time }
                        completionTime: { type: string, format: date-time }
  /api/agents/{namespace}/{name}/manifest:
    get:
      tags: [agents]
      summary: Agent manifest with the run-form input schema
      description: >
        Same manifest as the ACP GET /agents/{name}. Returns 404 for an agent
        outside the caller's tenant.
      parameters:
        - { in: path, name: namespace, required: true, schema: { type: string } }
        - { in: path, name: name, required: true, schema: { type: string } }
      responses:
        '200':
          description: agent manifest
          content:
            application/json: { schema: { type: object } }
        '404': { description: not found, or not in the caller's tenant }
  /api/agents/{namespace}/{name}/run:
    post:
      tags: [agents]
      summary: Start a run of an agent
      description: >
        Same behaviour as the ACP POST /agents/{name}/run. The run is stamped
        with the caller's tenant and records the user in the
        agentorca.io/created-by annotation. Returns 404 for an agent outside
        the caller's tenant.
      parameters:
        - { in: path, name: namespace, required: true, schema: { type: string } }
        - { in: path, name: name, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [input]
              properties:
                session_id: { type: string }
                input:
                  type: array
                  items:
                    type: object
                    properties:
                      role: { type: string }
                      parts:
                        type: array
                        items:
                          type: object
                          properties:
                            content_type: { type: string }
                            content: { type: string }
      responses:
        '201':
          description: run created
          content:
            application/json: { schema: { type: object } }
        '404': { description: not found, or not in the caller's tenant }
        '429': { description: tenant quota exceeded }
  /healthz:
    get:
      tags: [health]
      summary: Liveness probe
      security: []
      responses:
        '200': { description: ok, content: { application/json: { schema: { type: object, properties: { status: { type: string } } } } } }
  /readyz:
    get:
      tags: [health]
      summary: Readiness probe
      security: []
      responses: { '200': { description: ready }, '503': { description: unready } }
  /version:
    get:
      tags: [health]
      summary: Build version
      security: []
      responses:
        '200': { description: ok, content: { application/json: { schema: { type: object, properties: { version: { type: string } } } } } }
  /api/system/status:
    get:
      tags: [system]
      summary: Aggregated system health, model-provider reachability, and Prometheus metrics
      parameters:
        - in: query
          name: range
          schema: { type: string, enum: [1h, 6h, 24h, 7d], default: 24h }
          description: Time window for the returned metric samples.
      responses:
        '200':
          description: System status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemStatus' }
  /api/system/alerts:
    get:
      tags: [system]
      summary: Recent alert history from the alert manager
      responses:
        '200':
          description: Alert list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AlertEntry' }
  /api/runs/history:
    get:
      tags: [runs]
      summary: Paginated, filterable list of archived (historical) AgentRuns from PostgreSQL
      parameters:
        - in: query
          name: limit
          schema: { type: integer, default: 50, maximum: 200 }
        - in: query
          name: offset
          schema: { type: integer, default: 0 }
        - in: query
          name: phase
          schema: { type: string }
          description: Filter by phase (Succeeded, Failed, etc.)
        - in: query
          name: agentRef
          schema: { type: string }
          description: Filter by agent name
        - in: query
          name: search
          schema: { type: string }
          description: Case-insensitive substring match on run name
        - in: query
          name: namespace
          schema: { type: string }
          description: Namespace filter (ignored when tenant-scoped)
      responses:
        '200':
          content:
            application/json: { schema: { $ref: '#/components/schemas/RunHistoryResponse' } }
        '503':
          description: Run archival not configured
  /api/runs/history/{namespace}/{name}:
    get:
      tags: [runs]
      summary: Get full detail of a single archived AgentRun from PostgreSQL
      parameters:
        - in: path
          name: namespace
          required: true
          schema: { type: string }
        - in: path
          name: name
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Archived run detail (cost, output, tools, context)
          content:
            application/json: { schema: { $ref: '#/components/schemas/RunHistoryDetail' } }
        '503':
          description: Run archival not configured
        '404': { $ref: '#/components/responses/NotFound' }
  /api/resources/{kind}:
    get:
      tags: [resources]
      summary: List CRDs of the given kind
      parameters:
        - in: path
          name: kind
          required: true
          schema: { $ref: '#/components/schemas/ResourceKind' }
        - in: query
          name: namespace
          schema: { type: string }
      responses:
        '200':
          description: >
            list of resources; every item carries an ownership field
            (see Ownership)
    post:
      tags: [resources]
      summary: Create a new CRD of the given kind
      description: >
        Needs the builder role, or admin for tools, mcpservers, modelproviders and
        modelselectors. The object is applied server-side as field manager
        agent-orca-ui and annotated agentorca.io/owner=ui, last-modified-by and
        last-modified-at; any owner annotation in the body is dropped, and
        app.kubernetes.io/managed-by is not touched. Status is ignored. Every
        write adds a row to the audit trail; if that row cannot be written the
        write still succeeds and the response carries X-Audit-Status: failed.
      parameters:
        - in: path
          name: kind
          required: true
          schema: { $ref: '#/components/schemas/ResourceKind' }
        - in: query
          name: dryRun
          description: >
            true runs the whole write (tenant, role, ownership, label stamping,
            server-side apply, both webhooks) with dryRun=All and stores nothing:
            no audit row, no last-modified side effects. The answer is 200
            {valid:true, object} on success, else the status a real write gives
            with {valid:false, errors}. See DryRunResult.
          schema: { type: boolean }
      requestBody:
        required: true
        content:
          application/json: { schema: { type: object } }
      responses:
        '201': { description: resource created (200 with a DryRunResult when dryRun=true) }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/resources/{kind}/{namespace}/{name}:
    get:
      tags: [resources]
      summary: Get a single CRD
      parameters:
        - in: path
          name: kind
          required: true
          schema: { $ref: '#/components/schemas/ResourceKind' }
        - in: path
          name: namespace
          required: true
          schema: { type: string }
        - in: path
          name: name
          required: true
          schema: { type: string }
      responses:
        '200':
          description: the resource, with an ownership field (see Ownership)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ownership: { $ref: '#/components/schemas/Ownership' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [resources]
      summary: Update a UI-owned CRD (status is always read-only / controller-managed)
      description: >
        Needs the builder role (admin for tools, mcpservers, modelproviders and
        modelselectors). The body must carry metadata.resourceVersion as read. A
        stale version is a 409 whose body names currentResourceVersion. An object
        the UI does not own is a 409 too: a Git-owned object (tracked by Argo CD,
        Flux or Helm, or agentorca.io/owner=git) points at Duplicate, and so does
        an object with no owner. A pending handoff survives an edit.
        Applied server-side as field manager agent-orca-ui; admission webhooks run.
      parameters:
        - in: path
          name: kind
          required: true
          schema: { $ref: '#/components/schemas/ResourceKind' }
        - in: path
          name: namespace
          required: true
          schema: { type: string }
        - in: path
          name: name
          required: true
          schema: { type: string }
        - in: query
          name: dryRun
          description: >
            true runs the whole write (tenant, role, ownership, label stamping,
            server-side apply, both webhooks) with dryRun=All and stores nothing:
            no audit row, no last-modified side effects. The answer is 200
            {valid:true, object} on success, else the status a real write gives
            with {valid:false, errors}. See DryRunResult.
          schema: { type: boolean }
      requestBody:
        required: true
        content:
          application/json: { schema: { type: object } }
      responses:
        '200':
          description: updated resource, or a DryRunResult when dryRun=true
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/ResourceConflict' }
        '428': { description: metadata.resourceVersion is missing from the body }
    delete:
      tags: [resources]
      summary: Delete a CRD (only objects owned by the UI)
      description: >
        Needs the builder role (admin for tools, mcpservers, modelproviders and
        modelselectors). Only UI-owned objects can be deleted; a Git-owned object
        or one with no owner is a 403.
      parameters:
        - in: path
          name: kind
          required: true
          schema: { $ref: '#/components/schemas/ResourceKind' }
        - in: path
          name: namespace
          required: true
          schema: { type: string }
        - in: path
          name: name
          required: true
          schema: { type: string }
      responses:
        '200': { description: { status: "deleted" } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/resources/{kind}/{namespace}/{name}/export:
    post:
      tags: [resources]
      summary: Export a UI-owned object as a manifest to commit to Git
      description: >
        Needs the builder role (admin for tools, mcpservers, modelproviders and
        modelselectors). Returns a clean manifest as YAML: no status,
        managedFields, resourceVersion, uid, creationTimestamp, generation,
        finalizers, and no owner, actor or handoff annotations. It sets
        agentorca.io/owner=git, keeps the labels (agentorca.io/tenant-id
        included) and other annotations, among them agentorca.io/maintainer.
        Unless handoff=false the live object is also annotated
        agentorca.io/handoff=pending until now plus the handoff lifetime (Helm
        ownership.handoffTTL, default 7 days), so the GitOps tool the manifest is
        committed to may adopt it; ownership flips to Git once it has. Only a
        UI-owned object can be exported (409 otherwise). The UI never writes to
        Git: a person commits the manifest. Audited.
      parameters:
        - in: path
          name: kind
          required: true
          schema: { $ref: '#/components/schemas/ResourceKind' }
        - in: path
          name: namespace
          required: true
          schema: { type: string }
        - in: path
          name: name
          required: true
          schema: { type: string }
        - in: query
          name: handoff
          description: Set to false to export without marking the object for handoff.
          schema: { type: string, enum: ['false'] }
      responses:
        '200':
          description: the manifest
          content:
            application/yaml: { schema: { type: string } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/ResourceConflict' }
  /api/resources/{kind}/{namespace}/{name}/handoff:
    delete:
      tags: [resources]
      summary: Cancel a pending handoff
      description: >
        Needs the builder role (admin for tools, mcpservers, modelproviders and
        modelselectors). Removes the handoff annotations, so GitOps writes to the
        object are blocked again. 409 when there is no handoff. Audited.
      parameters:
        - in: path
          name: kind
          required: true
          schema: { $ref: '#/components/schemas/ResourceKind' }
        - in: path
          name: namespace
          required: true
          schema: { type: string }
        - in: path
          name: name
          required: true
          schema: { type: string }
      responses:
        '200': { description: '{"status": "cancelled"}' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/ResourceConflict' }
  /api/resources/{kind}/{namespace}/{name}/duplicate:
    post:
      tags: [resources]
      summary: Make a UI-owned copy of a Git-owned or UI-owned object
      description: >
        Needs the builder role (admin for tools, mcpservers, modelproviders and
        modelselectors). Creates a copy under the new name in the caller's
        workspace namespace, with the same atomic create as POST
        /api/resources/{kind} (an existing name is a 409). The source may be
        Git-owned, UI-owned, without an owner, or platform-shared (a template); it
        must be readable by the caller. The copy is UI-owned and stamped with the
        caller's tenant ID; the source's Git tracking metadata, owner and handoff
        annotations, status and server-owned metadata are dropped. Audited.
      parameters:
        - in: path
          name: kind
          required: true
          schema: { $ref: '#/components/schemas/ResourceKind' }
        - in: path
          name: namespace
          required: true
          schema: { type: string }
        - in: path
          name: name
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, description: Name of the copy. }
      responses:
        '201':
          description: the copy, with an ownership field (see Ownership)
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/ResourceConflict' }
  /api/resources/{kind}/{namespace}/{name}/revisions:
    get:
      tags: [resources]
      summary: Revision history of an object the UI wrote
      description: >
        Needs the viewer role, and the live object must be readable by the
        caller. For a deleted object the caller must be a builder; the history
        shown is that of the caller's own tenant. Every UI create, update,
        restore and delete adds a revision; a save that changes nothing does not.
        Newest first. Without PostgreSQL the answer is 501.
      parameters:
        - in: path
          name: kind
          required: true
          schema: { $ref: '#/components/schemas/ResourceKind' }
        - in: path
          name: namespace
          required: true
          schema: { type: string }
        - in: path
          name: name
          required: true
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - in: query
          name: before
          description: The next value of the previous page.
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: a page of revisions
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RevisionPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '501': { description: revision history needs PostgreSQL }
  /api/resources/{kind}/{namespace}/{name}/revisions/{n}:
    get:
      tags: [resources]
      summary: One revision with its object
      description: Same access as the list.
      parameters:
        - in: path
          name: kind
          required: true
          schema: { $ref: '#/components/schemas/ResourceKind' }
        - in: path
          name: namespace
          required: true
          schema: { type: string }
        - in: path
          name: name
          required: true
          schema: { type: string }
        - in: path
          name: n
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: the revision and its object
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RevisionDetail' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '501': { description: revision history needs PostgreSQL }
  /api/resources/{kind}/{namespace}/{name}/revisions/{n}/restore:
    post:
      tags: [resources]
      summary: Apply an earlier revision again
      description: >
        Needs the builder role (admin for tools, mcpservers, modelproviders and
        modelselectors). Applies revision n's object to the live UI-owned object
        through the same server-side apply, webhooks and audit as an update, and
        stores a new revision with action restore and restoredFrom n. If the
        object was deleted and the name is free it is created again with the
        atomic create. A Git-owned object cannot be restored (409). The optional
        resourceVersion is checked against the live object; a different one is a
        409. Supports dryRun=true.
      parameters:
        - in: path
          name: kind
          required: true
          schema: { $ref: '#/components/schemas/ResourceKind' }
        - in: path
          name: namespace
          required: true
          schema: { type: string }
        - in: path
          name: name
          required: true
          schema: { type: string }
        - in: path
          name: n
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                resourceVersion: { type: string, description: The version of the live object the caller last read. }
      responses:
        '200':
          description: the restored object, with an ownership field (see Ownership)
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/ResourceConflict' }
        '501': { description: revision history needs PostgreSQL }
  /api/builder/options:
    get:
      tags: [builder]
      summary: What the agent builder form can pick from
      description: >
        Model selectors, tools, MCP servers, knowledge bases and guardrail
        policies in the caller's own namespaces, plus the platform-scoped ones.
        Needs the viewer role.
      responses:
        '200':
          description: the options
          content:
            application/json: { schema: { $ref: '#/components/schemas/BuilderOptions' } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/builder/check:
    post:
      tags: [builder]
      summary: Check a draft agent against a dataset of test cases
      description: >
        Needs the builder role; audited (create, kind EvalExperiment, a
        "builder check of a draft" summary with counts and no text). The draft
        goes through the same dry-run write as ?dryRun=true (CRD schema,
        webhooks, ownership, tenant checks) and is never stored; if it is
        invalid the answer is that of a failed dry run, 4xx
        {valid:false, errors:[...]}, and nothing is queued. A valid draft runs
        as an arm of an experiment of purpose "check", on the existing
        experiment runner, graders and budget caps. The budget, the number of
        cases (the first N), the concurrency and the checks per user per hour
        are capped by operator.builder.*. A check is hidden from the experiment
        list and never counts for a publish gate; follow it with
        GET /api/evals/experiments/{id}, /results and /summary. Git-owned
        agents are refused (409), as they cannot be saved here.
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/BuilderCheckRequest' } }
      responses:
        '201':
          description: the check was queued
          content:
            application/json: { schema: { $ref: '#/components/schemas/BuilderCheckResponse' } }
        '400': { description: 'The draft is invalid (valid:false with errors), the budget is over the cap, or the dataset is in another workspace' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: The dataset is not found for the caller }
        '409': { description: 'The dataset has no graders, too many experiments are running, or the agent is Git-owned' }
        '422': { description: The draft names things the workspace does not have }
        '429': { description: The user started too many checks this hour }
        '503': { description: Needs the PostgreSQL store and operator.evals.enabled }
  /api/builder/draft:
    post:
      tags: [builder]
      summary: Draft an agent from a plain-English description
      description: >
        Needs the builder role. The model named by operator.builder.draftProvider
        (a ModelProvider found in the caller's workspace, then the platform
        catalog, as a judge's is) writes the fields; the answer is a draft for a
        person to review and no object is written. The model's reply is
        untrusted: one strict JSON object, unknown fields dropped, each field
        type-checked and size-capped, references kept only when the workspace has
        an object of that name the caller may read, secret-like text redacted,
        and the assembled agent checked by the dry-run write (valid, errors).
        The description is redacted before it is sent, and never logged or
        audited (only its size). Limits per user: drafts an hour, a cost cap per
        call and a daily spend cap. One audit row (request, Agent) with sizes and
        cost.
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/BuilderDraftRequest' } }
      responses:
        '200':
          description: the draft
          content:
            application/json: { schema: { $ref: '#/components/schemas/BuilderDraft' } }
        '400': { description: The description is too short, or the body is not valid }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: 'No model is set up for drafting (code draft_unavailable)' }
        '413': { description: The description is too long, or the call would cost more than one draft may }
        '429': { description: The user asked for too many drafts, or used the daily allowance }
        '502': { description: The model could not be reached, or its answer was not usable }
  /api/templates/{namespace}/{name}/use:
    post:
      tags: [builder]
      summary: Copy a platform template into the caller's workspace
      description: >
        Needs the builder role; audited. The source is an Agent labelled
        agentorca.io/template=true and agentorca.io/scope=platform in a platform
        namespace. The agent and everything sharing its agentorca.io/template-group
        label (deployment, tools, guardrail policy) are copied into the namespace
        named in the body when the tenant may use it, else the tenant's first
        allowed namespace. The agent gets exactly the requested name; the others
        get a suffix (-deploy, -tool, -guardrail, numbered when there are
        several). References between the copies are rewritten; references to
        other objects (a shared ModelSelector) stay. Copies are UI-owned and
        stamped with the caller's tenant ID; the template, scope and
        template-group labels and the owner, handoff and actor annotations are
        dropped, the maintainer, description and example-input annotations are
        kept. All or nothing: a failure removes what was already created.
        Before anything is created, every same-namespace reference of the copies
        (ModelSelector, Tool, KnowledgeBase, GuardrailPolicy, ...) must be another
        copy or an object of the target namespace the caller may read; if not, the
        answer is 422 and nothing is created.
      parameters:
        - in: path
          name: namespace
          required: true
          schema: { type: string }
        - in: path
          name: name
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, description: Name of the new agent (a DNS label of at most 40 characters). }
                namespace: { type: string }
                replace:
                  type: object
                  additionalProperties: { type: string }
                  description: >
                    Points references of the template at objects of the target
                    namespace, keyed Kind/name, for example
                    {"ModelSelector/default": "my-selector"}. Applied to the
                    copies before the reference check.
      responses:
        '201':
          description: the copies
          content:
            application/json: { schema: { $ref: '#/components/schemas/UseTemplateResult' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422':
          description: >
            references that do not resolve in the target namespace, one
            plain-language message each (with the namespace's own objects of that
            kind as alternatives)
          content:
            application/json:
              schema:
                type: object
                required: [message, errors, missing]
                properties:
                  message: { type: string, description: One plain sentence naming the workspace and how many things are missing. }
                  errors: { type: array, items: { type: string } }
                  missing:
                    type: array
                    items:
                      type: object
                      required: [kind, name, namespace, alternatives, replaceKey]
                      properties:
                        kind: { type: string }
                        name: { type: string }
                        namespace: { type: string }
                        alternatives:
                          type: array
                          items: { type: string }
                          description: Sorted names of readable objects of that kind in the namespace; [] when none.
                        replaceKey: { type: string, description: The exact key to send in replace. }
  /api/agents/{namespace}/{name}/publish:
    post:
      tags: [builder]
      summary: Publish an agent (create or update its AgentDeployment)
      description: >
        Needs the builder role; audited. The agent must be UI-owned and in the
        caller's tenant; a Git-owned agent, or a Git-owned deployment, is a 409.
        Creates the minimal deployment (agentRef, chat input, one replica; the
        rest comes from the agent and its model selector), stamped and annotated
        like any UI-created object, or updates the one that already runs the agent.
        When the agent has an enabled publish gate (PUT /api/evals/gates/{namespace}/{agent})
        the latest gate experiment must pass first, else the answer is 409 with
        the gate's state; a workspace with no gate publishes as before. An admin
        may publish past a failing gate with overrideGate and a reason, which is
        audited (action override); anyone else who sends overrideGate gets 403.
      parameters:
        - in: path
          name: namespace
          required: true
          schema: { type: string }
        - in: path
          name: name
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, description: Deployment name. Default is the agent's existing deployment, else the agent's name. }
                chat: { type: boolean, default: true, description: Take chat input. false leaves inputSource unchanged or unset. }
                overrideGate:
                  type: object
                  required: [reason]
                  description: Publish past a failing evaluation gate. Admin only; audited.
                  properties:
                    reason: { type: string, minLength: 10, maxLength: 500 }
      responses:
        '200':
          description: an existing deployment was updated
          content:
            application/json:
              schema: { type: object, properties: { deployment: { type: object } } }
        '201':
          description: the deployment was created
          content:
            application/json:
              schema: { type: object, properties: { deployment: { type: object } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { description: The caller lacks the builder role, sent overrideGate without the admin role, or overrides are turned off (operator.evals.allowGateOverride) }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: >
            A Git-owned agent or deployment, or the publish gate has not passed.
            A gate answer has gate.status failed, missing or stale with the bar
            (required), what the latest experiment found (best), its id and a reason.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                  gate: { $ref: '#/components/schemas/GateDecision' }
        '503': { description: The publish gate could not be read, so nothing was published }
    delete:
      tags: [builder]
      summary: Unpublish an agent (delete its AgentDeployment)
      description: >
        Needs the builder role; audited. Deletes the deployment that runs the
        agent (?deployment= is needed only when several do; without it that is a 409), under the ownership guard
        of a deployment delete: a deployment the UI does not own is a 403.
      parameters:
        - in: path
          name: namespace
          required: true
          schema: { type: string }
        - in: path
          name: name
          required: true
          schema: { type: string }
        - { in: query, name: deployment, schema: { type: string } }
      responses:
        '200': { description: deleted }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/routing-events:
    get:
      tags: [runs]
      summary: Routing decisions across the caller's runs
      description: >
        LLM calls the model-router made, newest first, limited to the caller's
        tenant (tenant_id filter with row-level security underneath) and, without
        a namespace, to the namespaces the tenant may use. Needs the viewer role.
        Shadow (counterfactual) calls are left out unless shadow=true.
      parameters:
        - { in: query, name: namespace, schema: { type: string } }
        - { in: query, name: agent, schema: { type: string } }
        - { in: query, name: selector, schema: { type: string } }
        - { in: query, name: outcome, description: ok is neither error nor fallback, schema: { type: string, enum: [ok, error, fallback] } }
        - { in: query, name: shadow, schema: { type: boolean, default: false } }
        - { in: query, name: since, description: Inclusive lower bound on the call time (RFC 3339), schema: { type: string, format: date-time } }
        - { in: query, name: until, description: Exclusive upper bound (RFC 3339), schema: { type: string, format: date-time } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
      responses:
        '200':
          description: events, newest first
          content:
            application/json:
              schema:
                type: object
                required: [events]
                properties:
                  events:
                    type: array
                    items:
                      type: object
                      required: [decisionID, provider, namespace, run]
                      properties:
                        decisionID: { type: string }
                        parentDecisionID: { type: string }
                        namespace: { type: string }
                        run: { type: string }
                        agent: { type: string }
                        selector: { type: string }
                        provider: { type: string }
                        model: { type: string }
                        path: { type: string }
                        stage: { type: string }
                        isShadow: { type: boolean }
                        promptTokens: { type: integer }
                        completionTokens: { type: integer }
                        costUSD: { type: number }
                        latencyMS: { type: integer }
                        finishReason: { type: string }
                        fallbackFrom: { type: string }
                        errorClass: { type: string }
                        createdAt: { type: string, format: date-time }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { description: Routing history needs the PostgreSQL store }
  /api/audit:
    get:
      tags: [audit]
      summary: The tenant's audit trail (admin only)
      description: >
        Changes made through the UI API and approval decisions, newest first,
        scoped to the caller's tenant and namespaces. Also the conversation
        actions of signed-in users: chat (a turn sent to a deployment), answer
        (an answer to a run's clarification question) and feedback (a rating of
        a run). Those rows carry ids and sizes only, never the message, answer
        or comment text.
      parameters:
        - { in: query, name: kind, schema: { type: string } }
        - { in: query, name: namespace, schema: { type: string } }
        - { in: query, name: name, schema: { type: string } }
        - { in: query, name: user, schema: { type: string } }
        - { in: query, name: action, schema: { type: string, enum: [create, update, delete, cancel, request, approve, reject, chat, answer, feedback] } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
        - { in: query, name: cursor, description: nextCursor of the previous page, schema: { type: string } }
      responses:
        '200':
          description: a page of events
          content:
            application/json: { schema: { $ref: '#/components/schemas/AuditPage' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { description: The audit trail needs the PostgreSQL store }
  /api/evals/datasets:
    get:
      tags: [evals]
      summary: List evaluation datasets
      description: >
        The datasets in the caller's tenant and in the workspaces the caller may
        use. Needs the viewer role. Every evaluation endpoint answers 503 without
        the PostgreSQL store.
      parameters:
        - { in: query, name: namespace, schema: { type: string } }
        - { in: query, name: agent, schema: { type: string } }
      responses:
        '200':
          description: datasets, ordered by workspace and name
          content:
            application/json:
              schema:
                type: object
                required: [datasets]
                properties:
                  datasets: { type: array, items: { $ref: '#/components/schemas/EvalDataset' } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { description: Evaluations need the PostgreSQL store }
    post:
      tags: [evals]
      summary: Create an evaluation dataset
      description: Needs the builder role. Audited (create, kind EvalDataset). The dataset starts at version 1.
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/EvalDatasetCreate' } }
      responses:
        '201':
          description: created
          content:
            application/json: { schema: { $ref: '#/components/schemas/EvalDataset' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: A dataset with that name exists in the workspace }
        '503': { description: Evaluations need the PostgreSQL store }
  /api/evals/experiments:
    get:
      tags: [evals]
      summary: List evaluation experiments
      description: >
        Experiments in the caller's tenant and usable workspaces, newest first.
        Needs the viewer role. 503 without PostgreSQL, or when
        operator.evals.enabled is false.
      parameters:
        - { in: query, name: namespace, schema: { type: string } }
        - { in: query, name: datasetId, schema: { type: integer } }
        - { in: query, name: status, schema: { type: string } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 200 } }
        - { in: query, name: cursor, schema: { type: string } }
      responses:
        '200':
          description: experiments, with the cursor of the next page
          content:
            application/json:
              schema:
                type: object
                required: [experiments]
                properties:
                  experiments: { type: array, items: { $ref: '#/components/schemas/EvalExperiment' } }
                  nextCursor: { type: string }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { description: Experiments need the PostgreSQL store and operator.evals.enabled }
    post:
      tags: [evals]
      summary: Queue an evaluation experiment
      description: >
        Runs 2 to 4 arms (an agent, optionally at a saved revision or on a
        different ModelProvider) over a dataset at its current version. Needs the
        builder role. Audited (create, kind EvalExperiment). The dataset needs at
        least one grader. An arm that names objects the workspace lacks is a 422
        with a missing list, the same payload as using a template. At most two
        experiments per tenant are queued or running (409).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [datasetId, arms, budgetUsd]
              properties:
                datasetId: { type: integer }
                name: { type: string }
                arms:
                  type: array
                  minItems: 2
                  maxItems: 4
                  items:
                    type: object
                    required: [agent]
                    properties:
                      label: { type: string, description: DNS label of at most 20 characters; defaults to arm1, arm2 }
                      agent: { type: string }
                      revision: { type: integer, description: A saved revision number; omitted runs the live agent }
                      hash: { type: string, description: Content hash the revision must still have }
                      modelProvider: { type: string }
                repeats: { type: integer, minimum: 1, maximum: 5 }
                budgetUsd: { type: number }
                runBudgetUsd: { type: number }
                timeoutSeconds: { type: integer }
                concurrency: { type: integer, minimum: 1, maximum: 16 }
      responses:
        '201':
          description: queued
          content:
            application/json: { schema: { $ref: '#/components/schemas/EvalExperiment' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: The dataset has no graders, or the tenant has too many active experiments }
        '422': { description: An arm names a missing agent, revision or object }
        '503': { description: Experiments need the PostgreSQL store and operator.evals.enabled }
  /api/evals/experiments/{id}:
    get:
      tags: [evals]
      summary: Get an evaluation experiment
      description: Needs the viewer role. Another tenant's experiment is a 404.
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        '200':
          description: the experiment, with progress and, once it ends, its summary
          content:
            application/json: { schema: { $ref: '#/components/schemas/EvalExperiment' } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { description: Experiments need the PostgreSQL store and operator.evals.enabled }
  /api/evals/experiments/{id}/results:
    get:
      tags: [evals]
      summary: List an experiment's results
      description: One result per case, arm and repeat, with grades. Needs the viewer role.
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
        - { in: query, name: arm, schema: { type: string } }
        - { in: query, name: caseId, schema: { type: integer } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 200 } }
        - { in: query, name: cursor, schema: { type: string } }
      responses:
        '200':
          description: results and the cursor of the next page
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results: { type: array, items: { type: object } }
                  nextCursor: { type: string }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { description: Experiments need the PostgreSQL store and operator.evals.enabled }
  /api/evals/experiments/{id}/summary:
    get:
      tags: [evals]
      summary: The comparison of an experiment
      description: >
        Needs the viewer role. Per arm: cases, pass rate with its Wilson interval,
        mean score, failure rate, cost and latency, stability under repeats, and
        the results left out because a grade was in error or pending review
        (excludedError, excludedPending). Per candidate arm against the first: the
        paired counts (improved, regressed, unchanged), the exact McNemar p-value,
        the pass-rate difference with its interval, score, cost and latency
        differences, and the verdict. A case passes by the stored case rule: every
        required grader passes and the weighted mean score of the others is at
        least 0.5. Once the experiment has ended this is the summary stored then;
        before that it is worked out from the results so far, with live and partial
        both true. partial is also true when an ended experiment stopped early.
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        '200':
          description: the summary
          content:
            application/json:
              schema:
                type: object
                required: [experimentId, status, live, partial, summary]
                properties:
                  experimentId: { type: integer }
                  status: { type: string }
                  live: { type: boolean }
                  partial: { type: boolean }
                  summary: { type: object, description: 'stoppedBy, partial, results, skipped, spentUsd, comparison (arms, comparisons, excludedError, excludedPending), graders' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: The experiment is queued, or failed before it had a summary }
        '503': { description: Experiments need the PostgreSQL store and operator.evals.enabled }
  /api/evals/experiments/{id}/cancel:
    post:
      tags: [evals]
      summary: Cancel an evaluation experiment
      description: >
        Needs the builder role. Audited. A queued experiment is cancelled at once;
        a running one is stopped by the runner, which deletes its runs and keeps
        the results so far. 409 when it has already ended.
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        '200':
          description: the experiment
          content:
            application/json: { schema: { $ref: '#/components/schemas/EvalExperiment' } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: The experiment has ended }
  /api/evals/experiments/{id}/review:
    get:
      tags: [evals]
      summary: The blind review queue of an experiment
      description: >
        Needs the viewer role. The items a human grader asks a person to label,
        in a random order, with the experiment's status and counts. An item shows
        the case, the output and the grader's instructions, never the arm.
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
        - { in: query, name: status, schema: { type: string, enum: [pending, done, closed] } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        '200':
          description: the queue
          content:
            application/json:
              schema:
                type: object
                required: [status, progress, items]
                properties:
                  status: { type: string }
                  progress:
                    type: object
                    properties:
                      pending: { type: integer }
                      done: { type: integer }
                      closed: { type: integer }
                  items: { type: array, items: { $ref: '#/components/schemas/EvalReviewItem' } }
        '400': { description: A bad status or limit }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { description: Experiments need the PostgreSQL store and operator.evals.enabled }
  /api/evals/experiments/{id}/review/close:
    post:
      tags: [evals]
      summary: Close an experiment's review
      description: >
        Needs the builder role. Audited. Closes every item still pending; their
        grades stay pending_review, so those results are left out of the comparison,
        never counted as passes. The runner then ends the experiment. 409 unless the
        experiment is awaiting_review.
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        '200':
          description: how many items were closed
          content:
            application/json:
              schema:
                type: object
                properties:
                  closed: { type: integer }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: The experiment is not awaiting review }
  /api/evals/gates/{namespace}/{agent}:
    parameters:
      - { in: path, name: namespace, required: true, schema: { type: string } }
      - { in: path, name: agent, required: true, schema: { type: string } }
    get:
      tags: [evals]
      summary: An agent's publish gate and where it stands
      description: >
        Needs the viewer role. gate is null when the agent has none. decision, for an
        enabled gate, is what a publish would be told now.
      responses:
        '200':
          description: the gate
          content:
            application/json:
              schema:
                type: object
                required: [gate, overrideAllowed]
                properties:
                  gate: { nullable: true, allOf: [ { $ref: '#/components/schemas/EvalGate' } ] }
                  decision: { $ref: '#/components/schemas/GateDecision' }
                  overrideAllowed: { type: boolean }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { description: Gates need the PostgreSQL store }
    put:
      tags: [evals]
      summary: Set or replace an agent's publish gate
      description: >
        Needs the admin role, so the person writing the agent does not also write
        the bar. Audited with the old and new numbers (kind EvalGate). The gate is
        off for agents that have none. A dataset with only llm graders is a 409:
        a judge can be swayed by the output it grades, so a gate needs a
        deterministic or human grader as well. The dataset a gate rests on cannot
        be deleted until the gate is changed or removed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [datasetId, baselineRevision]
              properties:
                datasetId: { type: integer }
                baselineRevision: { type: integer, minimum: 1, description: The saved revision of the agent the candidate is compared with. }
                margin: { type: number, exclusiveMinimum: 0, exclusiveMaximum: 1, default: 0.05, description: Non-inferiority margin on the pass rate. }
                minCases: { type: integer, minimum: 1, maximum: 2000, default: 30 }
                minPassRate: { type: number, minimum: 0, maximum: 1 }
                maxRegressions: { type: integer, minimum: 0 }
                budgetUsd: { type: number, default: 5, description: Budget of the experiment the evaluate action starts. }
                enabled: { type: boolean, default: true }
      responses:
        '200':
          description: the gate
          content:
            application/json: { schema: { $ref: '#/components/schemas/EvalGate' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: The dataset has only llm graders }
    delete:
      tags: [evals]
      summary: Remove an agent's publish gate
      description: Needs the admin role. Audited.
      responses:
        '204': { description: removed }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/agents/{namespace}/{name}/evaluate:
    post:
      tags: [evals]
      summary: Run the publish gate's evaluation
      description: >
        Needs the builder role. Audited. Queues the gate experiment: the agent as it
        is now (the candidate arm, pinned to the hash of its spec) against the
        baseline revision the gate names, on the gate's dataset at its current
        version. A pass counts for that agent version and that dataset version only:
        editing the agent, the dataset or its graders makes it stale. 409 when the
        agent has no gate.
      parameters:
        - { in: path, name: namespace, required: true, schema: { type: string } }
        - { in: path, name: name, required: true, schema: { type: string } }
      responses:
        '201':
          description: the queued experiment (purpose gate)
          content:
            application/json: { schema: { $ref: '#/components/schemas/EvalExperiment' } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: The agent has no gate, the dataset has no graders, or the tenant has too many active experiments }
        '422': { description: The baseline revision or an object the arms name is missing }
        '503': { description: Experiments need the PostgreSQL store and operator.evals.enabled }
  /api/evals/review/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer, format: int64 } }
    get:
      tags: [evals]
      summary: Get a review item
      description: Needs the viewer role. The ID is the assignment's, from the queue.
      responses:
        '200':
          description: the item
          content:
            application/json: { schema: { $ref: '#/components/schemas/EvalReviewItem' } }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [evals]
      summary: Label a review item
      description: >
        Needs the runner role. Audited by the grader's name and the experiment's ID,
        never the output or the comment. One label per item: the pending grade becomes
        an ok grade graded by the caller and the result's case verdict is worked out
        again. 403 for the person who started the experiment when
        operator.evals.requireIndependentReview is on.
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/EvalReviewLabel' } }
      responses:
        '200':
          description: the labelled item
          content:
            application/json: { schema: { $ref: '#/components/schemas/EvalReviewItem' } }
        '400': { description: The label does not fit the grader's scale }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: The item was labelled or closed already }
  /api/evals/datasets/{id}/calibration:
    get:
      tags: [evals]
      summary: Calibrate an llm grader against a human grader
      description: >
        Needs the viewer role. Over the results both graded (both grades ok): the share
        they agree on, Cohen's kappa, the confusion table and the disagreements. Under
        20 such results tooFewPairs is true. A kappa under 0.4 marks the judge not
        trustworthy.
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
        - { in: query, name: llm, required: true, schema: { type: string }, description: The name of an llm grader of the dataset. }
        - { in: query, name: human, required: true, schema: { type: string }, description: The name of a human grader of the dataset. }
        - { in: query, name: experimentId, schema: { type: integer }, description: Limit to one experiment. }
      responses:
        '200':
          description: the calibration
          content:
            application/json: { schema: { $ref: '#/components/schemas/EvalCalibration' } }
        '400': { description: A missing grader name or a bad experimentId }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { description: Evaluations need the PostgreSQL store }
  /api/evals/datasets/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer, format: int64 } }
    get:
      tags: [evals]
      summary: Get an evaluation dataset
      description: Needs the viewer role. A dataset of another tenant, or in a workspace the caller may not use, is a 404.
      responses:
        '200':
          description: the dataset
          content:
            application/json: { schema: { $ref: '#/components/schemas/EvalDataset' } }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { description: Evaluations need the PostgreSQL store }
    patch:
      tags: [evals]
      summary: Change a dataset's description or agent
      description: Needs the builder role. Audited. Does not change the version.
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/EvalDatasetPatch' } }
      responses:
        '200':
          description: the dataset
          content:
            application/json: { schema: { $ref: '#/components/schemas/EvalDataset' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { description: Evaluations need the PostgreSQL store }
    delete:
      tags: [evals]
      summary: Delete a dataset and its cases
      description: Needs the builder role. Audited, with the case count. Removed cases go with it.
      responses:
        '204': { description: deleted }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { description: Evaluations need the PostgreSQL store }
  /api/evals/datasets/{id}/cases:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer, format: int64 } }
    get:
      tags: [evals]
      summary: List a dataset's live cases
      description: Needs the viewer role. Ordered by ID, paged by cursor.
      parameters:
        - { in: query, name: tag, schema: { type: string } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { in: query, name: cursor, description: nextCursor of the previous page, schema: { type: string } }
      responses:
        '200':
          description: a page of cases
          content:
            application/json: { schema: { $ref: '#/components/schemas/EvalCasePage' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { description: Evaluations need the PostgreSQL store }
    post:
      tags: [evals]
      summary: Add one case, or up to 200 as JSON lines
      description: >
        Needs the builder role. Send one case as application/json, or up to 200
        as JSON lines (application/x-ndjson, one EvalCaseInput per line, blank
        lines skipped). The call is all or nothing, bumps the dataset version
        once, and is audited with the count, never the text. Each of input and
        reference is limited to operator.evals.maxCaseBytes (default and ceiling
        65536) and the dataset to operator.evals.maxCasesPerDataset live cases
        (default 2000).
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/EvalCaseInput' } }
          application/x-ndjson: { schema: { type: string, description: One EvalCaseInput per line } }
      responses:
        '201':
          description: added
          content:
            application/json: { schema: { $ref: '#/components/schemas/EvalCasesAdded' } }
        '400': { description: A bad case, or more than 200 lines; the message names the line }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: The dataset would pass its case limit }
        '413': { description: A field is over the size limit }
        '503': { description: Evaluations need the PostgreSQL store }
  /api/evals/cases/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer, format: int64 } }
    get:
      tags: [evals]
      summary: Get a case
      description: Needs the viewer role. A removed case is a 404.
      responses:
        '200':
          description: the case
          content:
            application/json: { schema: { $ref: '#/components/schemas/EvalCase' } }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { description: Evaluations need the PostgreSQL store }
    patch:
      tags: [evals]
      summary: Edit a case
      description: >
        Needs the builder role. Audited. Raises the dataset version by one when a
        field really changes; an edit that changes nothing does not. Changing
        the input or reference clears the redacted flag.
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/EvalCasePatch' } }
      responses:
        '200':
          description: the case and the dataset's version
          content:
            application/json: { schema: { $ref: '#/components/schemas/EvalCaseChanged' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { description: A field is over the size limit }
        '503': { description: Evaluations need the PostgreSQL store }
    delete:
      tags: [evals]
      summary: Remove a case
      description: >
        Needs the builder role. Audited. The case leaves the dataset (soft
        delete: its row stays, marked removed in the new version) and the version
        goes up by one.
      responses:
        '200':
          description: the dataset's new version
          content:
            application/json:
              schema:
                type: object
                required: [datasetVersion]
                properties:
                  datasetVersion: { type: integer }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { description: Evaluations need the PostgreSQL store }
  /api/evals/datasets/{id}/graders:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer, format: int64 } }
    get:
      tags: [evals]
      summary: List a dataset's graders
      description: Needs the viewer role.
      responses:
        '200':
          description: the graders, by name
          content:
            application/json:
              schema:
                type: object
                required: [graders]
                properties:
                  graders: { type: array, items: { $ref: '#/components/schemas/EvalGrader' } }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { description: Evaluations need the PostgreSQL store }
  /api/evals/datasets/{id}/graders/{name}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer, format: int64 } }
      - { in: path, name: name, required: true, schema: { type: string } }
    get:
      tags: [evals]
      summary: Get a grader
      description: Needs the viewer role.
      responses:
        '200':
          description: the grader
          content:
            application/json: { schema: { $ref: '#/components/schemas/EvalGrader' } }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { description: Evaluations need the PostgreSQL store }
    put:
      tags: [evals]
      summary: Create or replace a grader
      description: >
        Needs the builder role. Audited (kind EvalGrader, name dataset/grader).
        The config is checked for the kind and stored in canonical form; a
        pattern or schema that is invalid, too large, or not RE2 (or a schema
        that refers outside itself) is a 400. A dataset holds at most 50
        graders. Changing graders does not change the dataset's version.
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/EvalGraderInput' } }
      responses:
        '200':
          description: replaced
          content:
            application/json: { schema: { $ref: '#/components/schemas/EvalGrader' } }
        '201':
          description: created
          content:
            application/json: { schema: { $ref: '#/components/schemas/EvalGrader' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: The dataset holds the most graders it may }
        '413': { description: The body is too large }
        '503': { description: Evaluations need the PostgreSQL store }
    delete:
      tags: [evals]
      summary: Delete a grader
      description: Needs the builder role. Audited. Deletes the grader's grades too.
      responses:
        '204': { description: deleted }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { description: Evaluations need the PostgreSQL store }
  /api/evals/datasets/{id}/grade:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer, format: int64 } }
    post:
      tags: [evals]
      summary: Grade a supplied result
      description: >
        Needs the runner role. Runs every grader of the dataset on the output,
        without calling a model, and keeps the result and its grades. With a
        caseId the case's reference is used; without one, give reference.
        Audited with counts, never the output. The result passes when every
        required grader passes and the weighted mean of the others is at least
        0.5.
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/EvalGradeRequest' } }
      responses:
        '201':
          description: the stored result with one grade per grader
          content:
            application/json: { schema: { $ref: '#/components/schemas/EvalResult' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: No such dataset, or a caseId that is not a live case of it }
        '409': { description: The dataset has no graders, or keeps the most results it may }
        '413': { description: The output is over 262144 bytes }
        '503': { description: Evaluations need the PostgreSQL store }
  /api/evals/datasets/{id}/results:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer, format: int64 } }
    get:
      tags: [evals]
      summary: List a dataset's graded results
      description: Needs the viewer role. Ordered by ID, paged by cursor.
      parameters:
        - { in: query, name: caseId, schema: { type: integer, format: int64 } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { in: query, name: cursor, description: nextCursor of the previous page, schema: { type: string } }
      responses:
        '200':
          description: a page of results
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results: { type: array, items: { $ref: '#/components/schemas/EvalResult' } }
                  nextCursor: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { description: Evaluations need the PostgreSQL store }
  /api/evals/results/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer, format: int64 } }
    get:
      tags: [evals]
      summary: Get a graded result
      description: Needs the viewer role.
      responses:
        '200':
          description: the result with its grades
          content:
            application/json: { schema: { $ref: '#/components/schemas/EvalResult' } }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { description: Evaluations need the PostgreSQL store }
  /api/runs/{namespace}/{name}/dataset:
    post:
      tags: [evals, runs]
      summary: Add a run to a dataset
      description: >
        Copies the run's input into a dataset as a new case (live or archived
        run). It is a copy: the case keeps the run's namespace and name and
        nothing else, never the trace. The reference is empty unless the caller
        writes one or sets useOutput. Redaction is on by default: built-in rules
        (API keys, bearer tokens, private keys, e-mail addresses, card numbers)
        plus the patterns and keywords of the run's Agent's GuardrailPolicy
        (input filters for the input, output filters for the reference). Needs
        the builder role. A run of another tenant, or in a workspace the caller
        may not use, is a 404. Audited with the run name and the replacement
        count, never the text.
      parameters:
        - { in: path, name: namespace, required: true, schema: { type: string } }
        - { in: path, name: name, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/EvalCapture' } }
      responses:
        '201':
          description: the case was added
          content:
            application/json: { schema: { $ref: '#/components/schemas/EvalCaptured' } }
        '200':
          description: a preview; nothing was stored
          content:
            application/json: { schema: { $ref: '#/components/schemas/EvalCaptured' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { description: Missing role, or redact false while the operator forbids unredacted cases }
        '404': { description: No such run or dataset in the caller's tenant }
        '409': { description: The dataset is full, or the run has no output for useOutput }
        '413': { description: The run's input or reference is over the size limit }
        '503': { description: Evaluations need the PostgreSQL store }
  /api/openapi.json:
    get:
      tags: [health]
      summary: OpenAPI contract for the UI API
      security: []
      responses:
        '200':
          description: OpenAPI JSON
          content:
            application/json: { schema: { type: object } }
  /api/me:
    get:
      tags: [identity]
      summary: Who the caller is
      description: >
        Returns the signed-in user, groups, tenant (name and ID), the namespaces
        the user may use (as workspaces) and roles inside the tenant.
      responses:
        '200':
          description: current user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentUser' }
  /api/schedules:
    get:
      tags: [schedules]
      summary: List schedules with state, next run (absolute and in the schedule's zone), last result, spend and ownership
      parameters:
        - in: query
          name: namespace
          schema: { type: string }
      responses:
        '200': { description: "array of schedule summaries; state is one of active, suspended, degraded, budgetExhausted, targetMissing, invalid" }
  /api/schedules/preview:
    get:
      tags: [schedules]
      summary: The next firings of a cron expression in a time zone
      parameters:
        - { in: query, name: cron, required: true, schema: { type: string } }
        - { in: query, name: tz, schema: { type: string, default: UTC } }
        - { in: query, name: count, schema: { type: integer, default: 5, maximum: 20 } }
      responses:
        '200': { description: "nextRuns (utc and local), minInterval, shortestGap and tooFrequent" }
        '400': { description: invalid expression or time zone }
  /api/notification-channels:
    get:
      tags: [schedules]
      summary: Notification channels of the caller's tenant (builder role), names and types only
      description: >
        The channels an administrator set up on the tenant's TenantConfig
        (spec.notifications.channels), for the schedule builder's "Send the result to"
        choice. Read-only: the Secret that holds a channel's destination is never
        returned, and the UI cannot change TenantConfig.
      responses:
        '200': { description: "array of {name, type}; type is webhook, slack or smtp" }
        '403': { description: needs the builder role }
  /api/schedules/{namespace}/{name}/runs:
    get:
      tags: [schedules]
      summary: History of a schedule's runs and workflows, newest first
      parameters:
        - { in: query, name: limit, schema: { type: integer, default: 20, maximum: 100 } }
        - { in: query, name: before, description: "cursor: the nextBefore of the previous page (RFC 3339)", schema: { type: string } }
      responses:
        '200': { description: "runs (trigger schedule or manual) and nextBefore" }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/schedules/{namespace}/{name}/suspend:
    post:
      tags: [schedules]
      summary: Stop new runs (runner role). UI-owned schedules only; a Git-owned one answers 409
      responses:
        '200': { description: "ok, or status unchanged" }
        '409': { description: Git-owned }
  /api/schedules/{namespace}/{name}/resume:
    post:
      tags: [schedules]
      summary: Resume a suspended schedule, or clear the failure breaker of a Degraded one (runner role)
      responses:
        '200': { description: "ok, or status unchanged" }
        '409': { description: Git-owned }
  /api/schedules/{namespace}/{name}/run:
    post:
      tags: [schedules]
      summary: Run now (runner role). A normal run with trigger manual, started by the caller, passing the tenant's quotas
      responses:
        '202': { description: "kind, name and namespace of the created run or workflow" }
        '402': { description: daily budget exceeded }
        '429': { description: concurrent run limit reached }
  /api/runs:
    get:
      tags: [runs]
      summary: List live AgentRuns in the cluster
      parameters:
        - in: query
          name: namespace
          schema: { type: string }
        - in: query
          name: deployment
          schema: { type: string }
        - in: query
          name: schedule
          description: Only runs labelled for this AgentSchedule. Each run summary carries `schedule` and `trigger` (`schedule` for an unattended tick, `manual` for Run now)
          schema: { type: string }
      responses:
        '200': { description: run list }
  /api/runs/{namespace}/{name}:
    get:
      tags: [runs]
      summary: Get a single AgentRun (live or archived)
      responses:
        '200': { description: run detail }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/runs/{namespace}/{name}/stop:
    post:
      tags: [runs]
      summary: Cancel a pending/running/waiting run
      responses:
        '200': { description: { status: "cancelled" } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/runs/{namespace}/{name}/answer:
    post:
      tags: [runs]
      summary: Submit a clarification answer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                answer: { type: string }
      responses:
        '200': { description: { status: "ok", runName: "string" } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/runs/{namespace}/{name}/stream:
    get:
      tags: [runs]
      summary: SSE stream of tokens and trace events
      responses:
        '200':
          description: Event stream
          content:
            text/event-stream: { schema: { type: string } }
  /api/deployments/{namespace}/{name}/execute:
    post:
      tags: [deployments]
      summary: Send a chat message to a deployment (creates an AgentRun)
      responses:
        '200': { description: { runName: "string", sessionId: "string" } }
  /api/deployments/{namespace}/{name}/stream:
    get:
      tags: [deployments]
      summary: SSE stream for deployment execution
  /api/deployments/{namespace}/{name}/history:
    get:
      tags: [deployments]
      summary: Fetch conversation history for a session
  /api/connections:
    get:
      tags: [connections]
      summary: The signed-in user's own connections (viewer). Needs a user identity
      responses:
        '200': { description: "array of {namespace, server, scopes, accountLabel, status (active, needs_reauth, revoked, expired), lastUsedAt, createdAt}" }
        '403': { description: no signed-in user }
        '503': { description: no database or no connection key }
    delete:
      tags: [connections]
      summary: Offboarding. Revoke every connection of one user in the caller's tenant (admin)
      description: Deletes the user's connections and asks each provider to revoke the refresh token (RFC 7009, best effort). Audited per connection and once for the sweep. user is required.
      parameters:
        - { in: query, name: user, required: true, schema: { type: string } }
      responses:
        '200': { description: "{removed, revokedAtProvider, failed}" }
        '400': { description: user is missing }
        '403': { description: not an admin }
        '500': { description: some connections could not be removed; the counts say how many }
  /api/connections/{namespace}/{server}/start:
    post:
      tags: [connections]
      summary: Begin the authorization-code flow with PKCE for a per-user MCP server (runner)
      description: Sets a single-use state cookie (__Host- prefix when the operator serves TLS) and stores the pending flow for 5 minutes. The browser is sent to authorizeUrl.
      parameters:
        - { in: path, name: namespace, required: true, schema: { type: string } }
        - { in: path, name: server, required: true, schema: { type: string } }
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object, properties: { scopes: { type: array, items: { type: string } } } }
      responses:
        '200': { description: "{authorizeUrl}" }
        '404': { description: not found, or not the caller's tenant's }
        '409': { description: the server is not per-user, or an admin has not registered the OAuth app }
  /api/connections/callback:
    get:
      tags: [connections]
      summary: The redirect target registered in each OAuth app; completes the exchange and redirects to /connections?status=
      description: Needs the session. Checks the state (single use, stored in PostgreSQL), the cookie, that the session is the user and tenant the flow was minted for, the server UID and the RFC 9207 iss. status is connected, denied, expired, scopes or failed.
      parameters:
        - { in: query, name: code, schema: { type: string } }
        - { in: query, name: state, schema: { type: string } }
        - { in: query, name: iss, schema: { type: string } }
        - { in: query, name: error, schema: { type: string } }
      responses:
        '302': { description: redirect to the UI }
  /api/connections/{namespace}/{server}:
    delete:
      tags: [connections]
      summary: Disconnect your own connection (runner); an admin revokes another user's with ?user=
      parameters:
        - { in: path, name: namespace, required: true, schema: { type: string } }
        - { in: path, name: server, required: true, schema: { type: string } }
        - { in: query, name: user, schema: { type: string } }
      responses:
        '204': { description: deleted; the provider is asked to revoke the token (RFC 7009) unless revokeOnDisconnect is false }
  /api/mcpservers/{namespace}/{name}/connections:
    get:
      tags: [connections]
      summary: Who is connected to a server and in what state, with counts (admin). Never a token
      parameters:
        - { in: path, name: namespace, required: true, schema: { type: string } }
        - { in: path, name: name, required: true, schema: { type: string } }
      responses:
        '200': { description: "{connections: [{userId, status, scopes, lastUsedAt, createdAt}], counts}" }
  /api/mcp-oauth-apps/{namespace}/{server}:
    get:
      tags: [connections]
      summary: The registered OAuth app of a per-user server, without its secret (admin)
      parameters:
        - { in: path, name: namespace, required: true, schema: { type: string } }
        - { in: path, name: server, required: true, schema: { type: string } }
      responses:
        '200': { description: "{registered, clientId, hasClientSecret, redirectUri, scopesAllowed}" }
    put:
      tags: [connections]
      summary: Register or rotate the OAuth app (admin). The client secret is write-only; empty keeps the stored one
      parameters:
        - { in: path, name: namespace, required: true, schema: { type: string } }
        - { in: path, name: server, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [clientId]
              properties:
                clientId: { type: string }
                clientSecret: { type: string, writeOnly: true }
                scopesAllowed: { type: array, items: { type: string } }
      responses:
        '200': { description: the app view }
  /api/me/connections/required:
    get:
      tags: [connections]
      summary: The per-user servers an agent uses and whether the caller is connected; required lists those that need the caller's own account (runner)
      parameters:
        - { in: query, name: agent, required: true, schema: { type: string }, description: "namespace/name" }
      responses:
        '200': { description: "{servers: [{namespace, server, mode, connected}], required: [...], ownerNeedsReconnect: [...]}" }
  /api/triggers:
    get:
      tags: [triggers]
      summary: List webhook triggers
      description: Needs the viewer role. The secret is never returned.
      parameters:
        - { in: query, name: namespace, schema: { type: string } }
        - { in: query, name: agent, schema: { type: string } }
      responses:
        '200':
          description: the triggers
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Trigger' } }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { description: Triggers need the PostgreSQL store }
    post:
      tags: [triggers]
      summary: Create a webhook trigger for a published agent
      description: >
        Needs the builder role. Audited (kind Trigger). The answer carries the secret,
        which is shown only here; only a key derived from it is stored. A sender signs
        with hex(sha256(secret)) as the HMAC key. An agent that is not published is a 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [namespace, agent, name]
              properties:
                namespace: { type: string }
                agent: { type: string }
                name: { type: string, maxLength: 80 }
                inputPath: { type: string, description: Dotted path of a JSON field to use as the input; empty uses the whole body. }
                rateLimitPerMin: { type: integer, minimum: 1, maximum: 600, default: 30 }
      responses:
        '201':
          description: the trigger and its secret
          content:
            application/json:
              schema:
                type: object
                required: [trigger, secret, hookPath]
                properties:
                  trigger: { $ref: '#/components/schemas/Trigger' }
                  secret: { type: string }
                  hookPath: { type: string, description: 'Path of the hook endpoint, /hooks/ and the trigger id.' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: The agent is not published, a template, or the name is taken }
  /api/triggers/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    patch:
      tags: [triggers]
      summary: Enable or disable a webhook trigger
      description: Needs the builder role. Audited. A disabled trigger answers 404 at its hook.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        '200':
          description: the trigger
          content:
            application/json: { schema: { $ref: '#/components/schemas/Trigger' } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [triggers]
      summary: Delete a webhook trigger
      description: Needs the builder role. Audited.
      responses:
        '204': { description: deleted }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /hooks/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    post:
      tags: [triggers]
      summary: Start a run from a signed webhook
      description: >
        No session. The request is signed: X-AgentOrca-Timestamp is the Unix time in
        seconds and X-AgentOrca-Signature is sha256= and the hex HMAC-SHA256 of
        "<timestamp>.<body>" under hex(sha256(secret)). The timestamp must be within five
        minutes of the operator's clock and a signature is accepted once. The body is at
        most 64 KiB. An unknown, disabled or deleted trigger is 404.
      requestBody:
        required: true
        content:
          '*/*': { schema: { type: string } }
      responses:
        '202':
          description: the run was created
          content:
            application/json:
              schema:
                type: object
                properties:
                  runName: { type: string }
                  namespace: { type: string }
        '401': { description: Missing or wrong timestamp or signature, or a replayed request }
        '404': { description: No such enabled trigger, or its agent or tenant is gone }
        '413': { description: The body is over 64 KiB }
        '422': { description: The body does not fit the trigger's input path }
        '429': { description: The trigger's rate limit or the tenant's quota is used up }
  /api/widget-keys:
    get:
      tags: [widget]
      summary: List chat widget keys
      description: Needs the viewer role.
      parameters:
        - { in: query, name: namespace, schema: { type: string } }
        - { in: query, name: agent, schema: { type: string } }
      responses:
        '200':
          description: the keys
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/WidgetKey' } }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { description: Widget keys need the PostgreSQL store }
    post:
      tags: [widget]
      summary: Create a chat widget key for a published agent
      description: >
        Needs the builder role. Audited (kind WidgetKey). The widget chats through the
        agent's deployment, so an agent that is not published is a 409. Origins are exact
        (no wildcards) and must be https, or http for localhost.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [namespace, agent, name, allowedOrigins]
              properties:
                namespace: { type: string }
                agent: { type: string }
                name: { type: string, maxLength: 80 }
                allowedOrigins: { type: array, minItems: 1, maxItems: 10, items: { type: string } }
                rateLimitPerMin: { type: integer, minimum: 1, maximum: 600, default: 30 }
                budgetUsdPerDay: { type: number, exclusiveMinimum: 0, maximum: 10000, default: 5 }
      responses:
        '201':
          description: the key
          content:
            application/json: { schema: { $ref: '#/components/schemas/WidgetKey' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: The agent is not published, a template, or the name is taken }
  /api/widget-keys/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    patch:
      tags: [widget]
      summary: Change a chat widget key
      description: Needs the builder role. Audited. Any of the fields; a removed origin stops working at once.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled: { type: boolean }
                allowedOrigins: { type: array, items: { type: string } }
                rateLimitPerMin: { type: integer }
                budgetUsdPerDay: { type: number }
      responses:
        '200':
          description: the key
          content:
            application/json: { schema: { $ref: '#/components/schemas/WidgetKey' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [widget]
      summary: Delete a chat widget key
      description: Needs the builder role. Audited.
      responses:
        '204': { description: deleted }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /widget/v1.js:
    get:
      tags: [widget]
      summary: The chat widget script
      description: Public and cacheable. Embedded with a script tag carrying data-key.
      responses:
        '200': { description: JavaScript, content: { text/javascript: { schema: { type: string } } } }
  /widget/v1/{key}/sessions:
    parameters:
      - { in: path, name: key, required: true, schema: { type: string } }
    post:
      tags: [widget]
      summary: Start a widget session
      description: >
        Public, for the origins of the key only (the Origin header; others get 403). Answers
        a token for X-Widget-Session, valid 30 minutes, bound to the key and the origin. Limited
        per key.
      responses:
        '200':
          description: the session
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  expiresAt: { type: string, format: date-time }
                  agent: { type: string }
        '403': { description: The page's origin is not allowed }
        '404': { description: No such enabled key }
        '429': { description: The key's rate limit is used up }
  /widget/v1/{key}/messages:
    parameters:
      - { in: path, name: key, required: true, schema: { type: string } }
    post:
      tags: [widget]
      summary: Send a message in a widget session
      description: >
        Needs X-Widget-Session. Starts a chat turn of the key's agent through its deployment, as the UI's
        chat does. 402 when the key's daily budget is spent, 429 on its rate or when too many runs are active.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [input]
              properties:
                input: { type: string, maxLength: 4000 }
      responses:
        '202':
          description: the run that answers
          content:
            application/json:
              schema: { type: object, properties: { runName: { type: string } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { description: The session is missing, expired, forged or for another key or origin }
        '402': { description: The key's daily budget is spent }
        '403': { description: The page's origin is not allowed }
        '404': { description: The key, agent or tenant is gone }
        '429': { description: Rate limit or too many active runs }
  /widget/v1/{key}/runs/{run}:
    parameters:
      - { in: path, name: key, required: true, schema: { type: string } }
      - { in: path, name: run, required: true, schema: { type: string } }
    get:
      tags: [widget]
      summary: Poll for the answer of a widget message
      description: Needs X-Widget-Session; only runs of that session are visible (404 otherwise).
      responses:
        '200':
          description: the state of the run
          content:
            application/json:
              schema:
                type: object
                properties:
                  phase: { type: string, enum: [running, done, failed] }
                  output: { type: string }
                  error: { type: string }
        '401': { description: The session is missing or expired }
        '404': { description: Not a run of this session }
responseComponents:
  BadRequest:
    description: Bad request
    content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
  NotFound:
    description: Not found
    content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
  Forbidden:
    description: Forbidden
    content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
  ResourceConflict:
    description: >
      The object is not owned by the UI, or metadata.resourceVersion is stale.
      The body carries error and currentResourceVersion.
    content:
      application/json:
        schema:
          type: object
          properties:
            error: { type: string }
            currentResourceVersion: { type: string }
  Conflict:
    description: Conflict
    content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
