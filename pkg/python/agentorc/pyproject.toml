[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentorc"
version = "0.1.0"
description = "Python SDK for the agent-orc external task + ACP APIs"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
authors = [{name = "agent-orc"}]
dependencies = []

[project.scripts]
aoctl-py = "agentorc.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agentorc*"]
